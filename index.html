      ctx.beginPath(); ctx.arc(bx, by, 6 - t * 2, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Leafy clump: a short stem with rounded leaves fanning off the top half.
  function drawLeafyClump(sway, h) {
    ctx.strokeStyle = '#1B5E45'; ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(sway * 0.4, -h * 0.6, sway, -h);
    ctx.stroke();

    ctx.fillStyle = '#2A7D5C';
    // [how far up the stem, sideways offset, tilt]
    const leaves = [[0.52, -12, -0.5], [0.60, 12, 0.45], [0.76, -10, -0.35],
                    [0.84, 10, 0.4], [0.96, 0, -0.05]];
    leaves.forEach(leaf => {
      const t = leaf[0], mt = 1 - t;
      const bx = 2 * mt * t * (sway * 0.4) + t * t * sway + leaf[1];
      const by = 2 * mt * t * (-h * 0.6) + t * t * (-h);
      ctx.save(); ctx.translate(bx, by); ctx.rotate(leaf[2]);
      ctx.beginPath(); ctx.ellipse(0, 0, 11, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  function drawSeaweed() {
    const rootY = viewH - FLOOR_HEIGHT + 6;
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.lineCap = 'round';
    seaweed.forEach(p => {
      if (p.x < -70 || p.x > viewW + 70) return;
      const sway = Math.sin(elapsed * 1.4 + p.phase) * 9;
      ctx.save(); ctx.translate(p.x, rootY);
      if (p.kind === 'bubble') drawBubbleWeed(sway, p.height);
      else drawLeafyClump(sway, p.height);
      ctx.restore();
    });
    ctx.restore();
  }

  // Draws one of the game's own sprites at a given spot and size. Using the
  // real drawing functions means this legend can never drift out of sync with
  // how things actually look in the game.
  function drawLegendIcon(fn, x, y, scale, warn) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    fn(0, 0, warn);
    ctx.restore();
  }

  function drawHowToPage() {
    const L = howToLayout();
    const P = howToSlots(L.wide);
    const y = n => L.top + n * L.s;            // natural units -> screen y
    const x = n => L.cx + n * L.s;             // natural units -> screen x
    const f = n => `${n * L.s}px Arial`;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.textAlign = 'center';

    ctx.fillStyle = '#FFD700'; ctx.font = 'bold ' + f(26);
    ctx.fillText('HOW TO PLAY', x(P.titleX), y(P.titleY));

    // --- the physics: the one thing you can't work out by looking ---
    ctx.fillStyle = 'white'; ctx.font = 'bold ' + f(17);
    ctx.fillText('Hold to swim up. Let go to sink.', x(P.physX), y(P.p1));
    ctx.fillStyle = '#9FE8FF'; ctx.font = f(15);
    ctx.fillText("Dolphins can't fly — they JUMP!", x(P.physX), y(P.p2));
    ctx.fillText('Leap out of the water for sky treats.', x(P.physX), y(P.p3));

    // --- what's worth what. Values are printed from the constants, so the
    // --- legend can't end up lying about the score.
    ctx.fillStyle = '#7CFFB2'; ctx.font = 'bold ' + f(15);
    ctx.fillText('COLLECT THESE', x(P.goodX), y(P.goodY));

    const gx = [-126, -42, 42, 126].map(d => x(P.goodX + d));
    drawLegendIcon(drawGem,     gx[0], y(P.iconsY), 1.0 * L.s);
    drawLegendIcon(drawDonut,   gx[1], y(P.iconsY), 1.0 * L.s);
    drawLegendIcon(drawRainbow, gx[2], y(P.iconsY), 0.62 * L.s);
    drawLegendIcon(drawHeart,   gx[3], y(P.iconsY - 2), 1.0 * L.s);

    ctx.fillStyle = 'white'; ctx.font = 'bold ' + f(14);
    ctx.fillText(GEM_VALUE,     gx[0], y(P.valuesY));
    ctx.fillText(DONUT_VALUE,   gx[1], y(P.valuesY));
    ctx.fillText(RAINBOW_VALUE, gx[2], y(P.valuesY));
    ctx.font = 'bold ' + f(12.5);
    ctx.fillText('+1 life',     gx[3], y(P.valuesY));

    // --- what hurts. Drawn mid-warning so the red glow is learnt right here
    // --- rather than the first time it costs you a life.
    ctx.fillStyle = '#FF8A80'; ctx.font = 'bold ' + f(15);
    ctx.fillText('DODGE THESE', x(P.badX), y(P.badY));

    const bx = [-100, 0, 100].map(d => x(P.badX + d));
    drawLegendIcon(drawSpikyShell, bx[0], y(P.hazY), 0.85 * L.s, 0.55);
    drawLegendIcon(drawSeaUrchin,  bx[1], y(P.hazY), 0.85 * L.s, 0.55);
    drawLegendIcon(drawJellyfish,  bx[2], y(P.hazY - 6), 0.85 * L.s, 0.55);

    ctx.fillStyle = '#FF8A80'; ctx.font = f(12.5);
    ctx.fillText('They flash red before they reach you.', x(P.badX), y(P.w1));
    ctx.fillText('Each one costs a life. You start with ' + START_LIVES + '.', x(P.badX), y(P.w2));

    // The two rules you'd otherwise only discover by accident. The heart count
    // comes from the constant, same as the item legend above.
    ctx.fillStyle = '#FFD93D'; ctx.font = 'bold ' + f(13);
    ctx.fillText(DOUBLE_POINTS_AT + ' hearts = DOUBLE points!', x(P.bonusX), y(P.bonus1));
    ctx.fillStyle = '#9FE8FF'; ctx.font = f(12);
    ctx.fillText('It gets faster as you score!', x(P.bonusX), y(P.bonus2));

    // --- back ---
    const b = howToBackRect();
    const hovered = pointInRect(pointerX, pointerY, b);
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, b.h / 2);
    ctx.fillStyle = hovered ? '#7FD4FF' : '#4FB8EE';
    ctx.fill();
    ctx.strokeStyle = 'white'; ctx.lineWidth = 3 * L.s; ctx.stroke();

    ctx.fillStyle = '#05304A'; ctx.font = 'bold ' + f(19);
    ctx.textBaseline = 'middle';
    ctx.fillText('Back', L.cx, b.y + b.h / 2);
    ctx.textBaseline = 'alphabetic';

    ctx.textAlign = 'left';
  }

  // Shown instead of the game while the screen is taller than it is wide.
  // A phone icon tipping onto its side, and one short line a 7-year-old can
  // read. Desktop windows get told to widen instead — there's no rotating one.
  function drawRotatePrompt() {
    ctx.fillStyle = '#0B2F52';
    ctx.fillRect(0, 0, viewW, viewH);
    const cx = viewW / 2, cy = viewH / 2 - 40;
    const pw = 56, ph = 96;
    // Rock between upright and sideways, pausing at each end.
    const t = (Math.sin(elapsed * 2) + 1) / 2;
    const ease = t * t * (3 - 2 * t);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-ease * Math.PI / 2);
    ctx.beginPath(); ctx.roundRect(-pw / 2, -ph / 2, pw, ph, 10);
    ctx.fillStyle = '#FF69B4'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = 'white'; ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-pw / 2 + 7, -ph / 2 + 12, pw - 14, ph - 24, 4);
    ctx.fillStyle = '#87CEEB'; ctx.fill();
    ctx.restore();

    const touch = isTouchDevice();
    const font = Math.max(18, Math.min(28, viewW * 0.065));
    ctx.textAlign = 'center';
    ctx.fillStyle = 'white';
    ctx.font = `bold ${font}px Arial`;
    ctx.fillText(touch ? 'Turn your phone sideways' : 'Make the window wider',
                 cx, cy + ph / 2 + 30 + font);
    ctx.fillStyle = '#9FE8FF';
    ctx.font = `${font * 0.7}px Arial`;
    ctx.fillText(touch ? 'to play!' : 'than it is tall to play!', cx, cy + ph / 2 + 30 + font * 2.2);
    ctx.textAlign = 'left';
  }

  // Panels (game over, pause) pop in instead of snapping on: 0 -> 1 over
  // SCREEN_POP seconds, overshooting a touch so it lands with a little bounce.
  function screenFade() { return Math.min(1, screenAge / SCREEN_POP); }
  function beginScreenPop() {
    const t = screenFade() - 1;
    const bounce = 1 + 2.7 * t * t * t + 1.7 * t * t;   // "ease out back"
    const k = 0.75 + 0.25 * bounce;
    ctx.save();
    ctx.translate(viewW / 2, viewH / 2);
    ctx.scale(k, k);
    ctx.translate(-viewW / 2, -viewH / 2);
  }

  // Pickup feedback: little four-point stars flying out, and the "+10" that
  // floats up from where the treasure was.
  function drawPickupEffects() {
    sparkles.forEach(sp => {
      const r = 3 + sp.life * 8;
      ctx.globalAlpha = Math.min(1, Math.max(0, sp.life * 1.6));   // bright, then a quick fade
      ctx.fillStyle = sp.color;
      ctx.beginPath();
      ctx.moveTo(sp.x, sp.y - r);
      ctx.lineTo(sp.x + r * 0.3, sp.y - r * 0.3); ctx.lineTo(sp.x + r, sp.y);
      ctx.lineTo(sp.x + r * 0.3, sp.y + r * 0.3); ctx.lineTo(sp.x, sp.y + r);
      ctx.lineTo(sp.x - r * 0.3, sp.y + r * 0.3); ctx.lineTo(sp.x - r, sp.y);
      ctx.lineTo(sp.x - r * 0.3, sp.y - r * 0.3);
      ctx.closePath(); ctx.fill();
    });
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    popups.forEach(pop => {
      const t = 1 - pop.life / POPUP_LIFE;                  // 0 at birth, 1 when gone
      const grow = t < 0.15 ? 0.6 + (t / 0.15) * 0.4 : 1;   // quick pop up to full size
      ctx.globalAlpha = Math.min(1, pop.life / (POPUP_LIFE * 0.4));  // fade at the end
      ctx.font = `bold ${pop.size * grow}px Arial`;
      ctx.lineWidth = pop.size * 0.22;
      ctx.strokeStyle = 'rgba(11, 47, 82, 0.9)';            // navy edge: readable on sky AND water
      ctx.strokeText(pop.text, pop.x, pop.y);
      ctx.fillStyle = pop.color;
      ctx.fillText(pop.text, pop.x, pop.y);
    });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // A soft red glow around the edges for a moment after a bump. Gentle on
  // purpose: enough to say "ouch", not enough to startle a little kid.
  function drawHurtFlash() {
    const since = HURT_TIME - hurtLeft;
    if (hurtLeft <= 0 || since > HURT_FLASH) return;
    const strength = (1 - since / HURT_FLASH) * 0.35;
    const glow = ctx.createRadialGradient(viewW / 2, viewH / 2, viewH * 0.35,
                                          viewW / 2, viewH / 2, viewW * 0.62);
    glow.addColorStop(0, 'rgba(255, 60, 90, 0)');
    glow.addColorStop(1, `rgba(255, 60, 90, ${strength})`);
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, viewW, viewH);
  }

  // The sound button: a little speaker on the same dark circle as the pause
  // button. Sound waves when it's on; a red slash through it when it's off.
  function drawSoundButton() {
    const r = soundButtonRect();
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, u = r.w / 48;   // u: 1 at the smallest size
    ctx.beginPath();
    ctx.arc(cx, cy, r.w / 2, 0, Math.PI * 2);
    ctx.fillStyle = pointInRect(pointerX, pointerY, r) ? 'rgba(0,0,0,0.45)' : 'rgba(0,0,0,0.3)';
    ctx.fill();
    // speaker: a small box with a cone opening to the right
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.moveTo(cx - 13 * u, cy - 4.5 * u); ctx.lineTo(cx - 7 * u, cy - 4.5 * u);
    ctx.lineTo(cx, cy - 11 * u);           ctx.lineTo(cx, cy + 11 * u);
    ctx.lineTo(cx - 7 * u, cy + 4.5 * u);  ctx.lineTo(cx - 13 * u, cy + 4.5 * u);
    ctx.closePath(); ctx.fill();
    ctx.lineCap = 'round';
    if (soundOn) {
      ctx.strokeStyle = 'white'; ctx.lineWidth = 2.6 * u;
      ctx.beginPath(); ctx.arc(cx + 1 * u, cy, 6 * u, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + 1 * u, cy, 11.5 * u, -0.9, 0.9); ctx.stroke();
    } else {
      ctx.strokeStyle = '#FF5A6E'; ctx.lineWidth = 3.4 * u;
      ctx.beginPath(); ctx.moveTo(cx - 13 * u, cy + 12 * u); ctx.lineTo(cx + 13 * u, cy - 12 * u); ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }

  // The pause button: two white bars on a soft dark circle, so it reads
  // against both the pale sky and the water.
  function drawPauseButton() {
    const r = pauseButtonRect();
    const hovered = pointInRect(pointerX, pointerY, r);
    ctx.beginPath();
    ctx.arc(r.x + r.w / 2, r.y + r.h / 2, r.w / 2, 0, Math.PI * 2);
    ctx.fillStyle = hovered ? 'rgba(0,0,0,0.45)' : 'rgba(0,0,0,0.3)';
    ctx.fill();
    ctx.fillStyle = 'white';
    const barW = r.w * 0.13, barH = r.h * 0.4;
    ctx.fillRect(r.x + r.w / 2 - barW * 1.4, r.y + r.h / 2 - barH / 2, barW, barH);
    ctx.fillRect(r.x + r.w / 2 + barW * 0.4, r.y + r.h / 2 - barH / 2, barW, barH);
  }

  function drawPauseMenu() {
    // Resume was pressed: show "3, 2, 1" over the (still frozen) ocean.
    if (resumeCountdown > 0) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.fillRect(0, 0, viewW, viewH);
      const number = Math.ceil(resumeCountdown / RESUME_STEP);
      const within = 1 - (resumeCountdown / RESUME_STEP - (number - 1));  // 0 -> 1 during each number
      const size = viewH * 0.3 * (1.25 - 0.25 * Math.min(1, within * 4));  // each one lands with a pop
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${size}px Arial`;
      ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.12;
      ctx.strokeStyle = 'white';
      ctx.strokeText(number, viewW / 2, viewH / 2);
      ctx.fillStyle = '#FF69B4';
      ctx.fillText(number, viewW / 2, viewH / 2);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      return;
    }
    ctx.fillStyle = `rgba(0, 0, 0, ${0.6 * screenFade()})`;
    ctx.fillRect(0, 0, viewW, viewH);
    beginScreenPop();
    const pm = pauseMenuRects();
    ctx.textAlign = 'center';
    // The title is drawn only if it clears the score and hearts. On a phone
    // held sideways there's no room for it, and the buttons say it anyway.
    const titleFont = Math.min(52, pm.resume.h * 0.8);
    if (pm.titleY - titleFont * 0.8 > hudLivesY() + 10) {
      ctx.fillStyle = '#FF69B4';
      ctx.font = `bold ${titleFont}px Arial`;
      ctx.fillText('Paused', viewW / 2, pm.titleY);
    }
    const btnFont = Math.min(24, pm.resume.h * 0.4);
    // Resume is the pink one — the same colour as Try Again — because it's
    // the thing you almost always want.
    drawPill(pm.resume, 'Resume', '#FF69B4', '#FF9AD5', 'white', btnFont);
    // Armed, the Restart button turns gold and asks for the second tap.
    if (restartArmed > 0) {
      drawPill(pm.restart, 'Tap again to restart', '#FFD93D', '#FFE680', '#4A3200', btnFont);
    } else {
      drawPill(pm.restart, 'Restart', 'rgba(255,255,255,0.14)',
               'rgba(255,255,255,0.28)', 'white', btnFont);
    }
    drawPill(pm.howTo, 'How to play', 'rgba(255,255,255,0.14)',
             'rgba(255,255,255,0.28)', 'white', btnFont);
    drawPill(pm.board, 'High scores', 'rgba(255,255,255,0.14)',
             'rgba(255,255,255,0.28)', 'white', btnFont);
    ctx.restore();   // end of the pop-in started by beginScreenPop()
    ctx.textAlign = 'left';
    drawSoundButton();
  }

  // Shared pill-button drawing, so every button in the game looks the same.
  function drawPill(r, label, fill, fillHover, textColor, fontPx) {
    const hovered = pointInRect(pointerX, pointerY, r);
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, r.h / 2);
    ctx.fillStyle = hovered ? fillHover : fill;
    ctx.fill();
    ctx.strokeStyle = 'white'; ctx.lineWidth = Math.max(2, r.h * 0.06); ctx.stroke();
    ctx.fillStyle = textColor;
    ctx.font = `bold ${fontPx}px Arial`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2);
    ctx.textBaseline = 'alphabetic';
  }

  function drawEnterInitials() {
    const L = initialsLayout();
    const y = n => L.top + n * L.s;
    const f = n => `${n * L.s}px Arial`;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.textAlign = 'center';

    ctx.fillStyle = '#FFD700'; ctx.font = 'bold ' + f(30);
    ctx.fillText('NEW HIGH SCORE!', L.cx, y(40));
    ctx.fillStyle = 'white'; ctx.font = 'bold ' + f(22);
    ctx.fillText(pendingScore, L.cx, y(78));
    ctx.fillStyle = '#9FE8FF'; ctx.font = f(14);
    ctx.fillText('Put your initials on the board', L.cx, y(110));

    for (let i = 0; i < 3; i++) {
      const slot = initialsSlotRect(i);
      const active = i === initialsSlot;

      // chevrons
      ctx.fillStyle = active ? '#FFD700' : 'rgba(255,255,255,0.55)';
      [true, false].forEach(up => {
        const c = initialsChevronRect(i, up);
        const midX = c.x + c.w / 2, midY = c.y + c.h / 2, s2 = 10 * L.s;
        ctx.beginPath();
        if (up) { ctx.moveTo(midX, midY - s2); ctx.lineTo(midX + s2, midY + s2); ctx.lineTo(midX - s2, midY + s2); }
        else    { ctx.moveTo(midX, midY + s2); ctx.lineTo(midX + s2, midY - s2); ctx.lineTo(midX - s2, midY - s2); }
        ctx.closePath(); ctx.fill();
      });

      ctx.beginPath(); ctx.roundRect(slot.x, slot.y, slot.w, slot.h, 10 * L.s);
      ctx.fillStyle = active ? 'rgba(255,215,0,0.18)' : 'rgba(255,255,255,0.10)';
      ctx.fill();
      ctx.strokeStyle = active ? '#FFD700' : 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 3 * L.s; ctx.stroke();

      ctx.fillStyle = 'white'; ctx.font = 'bold ' + f(44);
      ctx.textBaseline = 'middle';
      ctx.fillText(initials[i], slot.x + slot.w / 2, slot.y + slot.h / 2);
      ctx.textBaseline = 'alphabetic';
    }

    const saveLabel = submitStatus === 'sending' ? 'Saving...' :
                      submitStatus === 'error'   ? 'Try again' : 'Save';
    drawPill(initialsSaveRect(), saveLabel, '#4FB8EE', '#7FD4FF', '#05304A', 20 * L.s);
    drawPill(initialsSkipRect(), 'Skip', 'rgba(255,255,255,0.12)',
             'rgba(255,255,255,0.24)', 'white', 15 * L.s);

    if (submitStatus === 'error') {
      ctx.fillStyle = '#FF8A80'; ctx.font = f(12.5);
      ctx.fillText("Couldn't reach the scoreboard.", L.cx, initialsSaveRect().y - 14 * L.s);
    }
    ctx.textAlign = 'left';
  }

  function drawLeaderboard() {
    const L = boardLayout();
    const y = n => L.top + n * L.s;
    const f = n => `${n * L.s}px Arial`;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.84)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.textAlign = 'center';

    ctx.fillStyle = '#FFD700'; ctx.font = 'bold ' + f(26);
    ctx.fillText('HIGH SCORES', L.cx, y(30));

    const labels = ['ALL TIME', 'THIS MONTH', 'THIS WEEK'];
    const keys = ['all', 'month', 'week'];
    for (let i = 0; i < 3; i++) {
      const r = boardTabRect(i);
      const on = keys[i] === boardTab;
      ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 8 * L.s);
      ctx.fillStyle = on ? '#FFD700' : 'rgba(255,255,255,0.12)';
      ctx.fill();
      ctx.fillStyle = on ? '#2a2000' : 'white';
      ctx.font = 'bold ' + f(12);
      ctx.textBaseline = 'middle';
      ctx.fillText(labels[i], r.x + r.w / 2, r.y + r.h / 2);
      ctx.textBaseline = 'alphabetic';
    }

    const rows = board[boardTab];
    // Anchor the list to the ACTUAL tab rect, so flooring the tab height for
    // touch can't push the tabs down into the first row.
    const tabs = boardTabRect(0);
    const listY = tabs.y + tabs.h + 30 * L.s;
    const rowStep = 32 * L.s;

    if (rows === undefined) {
      ctx.fillStyle = 'white'; ctx.font = f(15);
      ctx.fillText('Loading...', L.cx, listY + 30 * L.s);
    } else if (rows === null) {
      ctx.fillStyle = '#FF8A80'; ctx.font = 'bold ' + f(15);
      ctx.fillText("Can't reach the scoreboard", L.cx, listY + 20 * L.s);
      ctx.fillStyle = '#FF8A80'; ctx.font = f(12.5);
      ctx.fillText('You can still play — tap Back.', L.cx, listY + 44 * L.s);
    } else if (rows.length === 0) {
      ctx.fillStyle = '#9FE8FF'; ctx.font = 'bold ' + f(15);
      ctx.fillText('No scores yet!', L.cx, listY + 20 * L.s);
      ctx.fillStyle = '#9FE8FF'; ctx.font = f(12.5);
      ctx.fillText('Be the first one on the board.', L.cx, listY + 44 * L.s);
    } else {
      ctx.textAlign = 'left';
      const left = L.cx - 140 * L.s;
      for (let i = 0; i < rows.length; i++) {
        const ry = listY + i * rowStep;
        if (i % 2 === 0) {
          ctx.fillStyle = 'rgba(255,255,255,0.06)';
          ctx.fillRect(left - 10 * L.s, ry - 20 * L.s, 300 * L.s, 28 * L.s);
        }
        ctx.fillStyle = i === 0 ? '#FFD700' : 'rgba(255,255,255,0.6)';
        ctx.font = 'bold ' + f(15);
        ctx.fillText((i + 1) + '.', left, ry);

        ctx.fillStyle = i === 0 ? '#FFD700' : 'white';
        ctx.font = 'bold ' + f(19);
        ctx.fillText(rows[i].initials, left + 42 * L.s, ry);

        ctx.textAlign = 'right';
        ctx.fillText(rows[i].score, left + 280 * L.s, ry);
        ctx.textAlign = 'left';
      }
      ctx.textAlign = 'center';
    }

    drawPill(boardBackRect(), 'Back', '#4FB8EE', '#7FD4FF', '#05304A', 19 * L.s);
    ctx.textAlign = 'left';
  }

  function draw() {
    const waterLine = waterLineY();

    // SKY
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, viewW, viewH);

    // CLOUDS
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.size, 0, Math.PI*2);
      ctx.arc(c.x + c.size * 0.8, c.y - c.size * 0.3, c.size * 0.8, 0, Math.PI*2);
      ctx.arc(c.x + c.size * 1.6, c.y, c.size * 0.9, 0, Math.PI*2);
      ctx.fill();
    });

    // SANDY FLOOR — scrolls at the same speed as the gems so the world
    // feels like one solid place.
    ctx.fillStyle = '#EEDD82';
    ctx.fillRect(0, viewH - FLOOR_HEIGHT, viewW, FLOOR_HEIGHT);

    ctx.font = '25px Arial';
    for (let i = 0; i <= viewW + 200; i += 200) {
      let scrollX = Math.round(i - worldScroll % 200);
      ctx.fillText('🦪', scrollX, viewH - 25);
      ctx.fillText('⭐', scrollX + 100, viewH - 10);
    }

    // SEAWEED — drawn here so it sits behind the dolphin and the treasures,
    // and gets tinted by the translucent water drawn later on.
    drawSeaweed();

    // HERO (drawn before the water so the translucent water tints it when
    // the dolphin is submerged — that's what makes diving look right)
    if (gameState === 'PLAYING' || gameState === 'PAUSED') {
      // Just bumped: she blinks for a moment, which also shows she's safe.
      const blinking = hurtLeft > 0 && Math.floor(hurtLeft * 10) % 2 === 0;
      if (blinking) ctx.globalAlpha = 0.35;
      drawHero(player.x, player.y, player.dy, player.y >= waterLine);
      ctx.globalAlpha = 1;
    } else if (gameState === 'START') {
      // Deliberately NOT drawn on the how-to page: she bobs at the centre of
      // the screen, which is exactly where the icon legend sits.
      let bobY = waterLine + Math.sin(elapsed * 3) * 10;
      // The bob's actual up/down speed, so the idle tilt matches the motion.
      drawHero(viewW / 2, bobY, Math.cos(elapsed * 3) * 30, true);
    }

    // WATER
    // Trace the wavy surface left to right, then close the shape down the
    // right edge and back along the bottom.
    ctx.fillStyle = 'rgba(30, 144, 255, 0.45)';
    ctx.beginPath();
    ctx.moveTo(0, viewH);
    for (let w = 0; w <= viewW; w += 20) {
      ctx.lineTo(w, waterLine + surfaceWaveAt(w));
    }
    // The loop steps in 20px jumps, so on a screen whose width isn't a
    // multiple of 20 (a 375px phone stops at 360) it never reaches the right
    // edge, and the shape closed diagonally to the corner — leaving a wedge
    // of missing water. Pin the final point to the exact right edge.
    ctx.lineTo(viewW, waterLine + surfaceWaveAt(viewW));
    ctx.lineTo(viewW, viewH);
    ctx.fill();

    ctx.strokeStyle = 'rgba(135, 206, 235, 0.6)';
    ctx.lineWidth = 4;
    ctx.stroke();

    // SPLASHES
    splashes.forEach(p => {
      ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });

    // ITEMS & OBSTACLES (still shown, frozen, behind the pause menu)
    if (gameState === 'PLAYING' || gameState === 'PAUSED') {
      items.forEach(item => {
        if (item.itemType === 'rainbow') drawRainbow(Math.round(item.x), Math.round(item.y));
        else if (item.itemType === 'donut') drawDonut(Math.round(item.x), Math.round(item.y));
        else if (item.itemType === 'heart') drawHeart(Math.round(item.x), Math.round(item.y));
        else drawGem(Math.round(item.x), Math.round(item.y));
      });

      obstacles.forEach(obs => {
        // Shimmer fades in as the shell closes the gap to the dolphin, then
        // fades out quickly once it's safely behind — otherwise the glow
        // would pop off the instant the shell slipped past.
        const gap = obs.x - player.x;
        const warn = gap >= 0
          ? Math.max(0, 1 - gap / warnDistance())
          : Math.max(0, 1 + gap / 120);
        drawObstacle(obs.kind, Math.round(obs.x), Math.round(obs.y), warn);
      });

      drawHurtFlash();
    }

    // --- UI RENDERING (RESPONSIVE) ---
    if (gameState === 'PLAYING' || gameState === 'PAUSED' || gameState === 'GAMEOVER') {
      let hudFont = hudFontSize();
      ctx.fillStyle = 'black';
      ctx.font = `bold ${hudFont}px Arial`;
      // A soft white outline behind the words. Treasures and clouds drift right
      // through this corner, and plain black on top of them was hard to read.
      ctx.lineJoin = 'round';
      ctx.lineWidth = hudFont * 0.22;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      const moneyLabel = 'Money (Gems & Donuts): ' + Math.round(scoreShown);
      ctx.strokeText(moneyLabel, hudX(), 40 + safeT + hudFont);
      ctx.fillText(moneyLabel, hudX(), 40 + safeT + hudFont);
      // Hearts, but a long row would run off a phone screen once the bonus
      // starts paying out, so past HEART_DISPLAY_MAX it becomes a count.
      const shown = Math.max(0, lives);
      const heartText = shown <= HEART_DISPLAY_MAX
        ? '❤️'.repeat(shown)
        : '❤️ x' + shown;
      const livesY = hudLivesY();
      const livesLabel = 'Lives: ' + heartText;
      ctx.strokeText('Lives:', hudX(), livesY);   // outline the word only, not the heart emoji
      ctx.fillText(livesLabel, hudX(), livesY);

      // x2 badge, right after the hearts, pulsing so you notice you have it.
      if (scoreMultiplier() > 1) {
        const badgeX = hudX() + ctx.measureText(livesLabel).width + 12;
        const bh = hudFont * 1.25;
        // Size the pill from the MEASURED text, not a guessed multiple of the
        // font size — guessing clipped the final letter.
        const badgeFont = hudFont * 0.72;
        ctx.font = `bold ${badgeFont}px Arial`;
        const bw = ctx.measureText('x2 POINTS').width + badgeFont * 1.4;
        ctx.save();
        ctx.globalAlpha = 0.75 + Math.abs(Math.sin(elapsed * 5)) * 0.25;
        ctx.beginPath();
        ctx.roundRect(badgeX, livesY - bh * 0.78, bw, bh, bh / 2);
        ctx.fillStyle = '#FFD93D';
        ctx.fill();
        ctx.strokeStyle = '#8A5A00'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#5A3B00';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('x2 POINTS', badgeX + bw / 2, livesY - bh * 0.78 + bh / 2);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        ctx.restore();
        ctx.font = `bold ${hudFont}px Arial`;   // restore the HUD font
        ctx.fillStyle = 'black';
      }
    }

    // Pickup stars and "+10"s go on top of the score and hearts: a high leap
    // carries them into that corner, and under the HUD they were a muddle.
    if (gameState === 'PLAYING' || gameState === 'PAUSED') drawPickupEffects();

    if (gameState === 'PLAYING') drawPauseButton();
    if (gameState === 'PAUSED') drawPauseMenu();

    // --- START SCREEN (RESPONSIVE) ---
    if (gameState === 'START') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, viewW, viewH);

      ctx.textAlign = 'center';

      let titleFont = Math.min(60, viewW * 0.06);
      let creditFont = Math.max(12, Math.min(24, viewW * 0.035));
      let promptFont = Math.max(14, Math.min(30, viewW * 0.045));

      // Each line is placed relative to the one above it. The old version
      // measured title and credits from the screen centre independently, so on
      // a narrow phone (where the title shrinks but the credit doesn't) they
      // collided.
      // Lifted when the "Your best" line is shown, so that line has room above
      // the buttons instead of sitting on top of them.
      const titleY = viewH / 2 - titleFont * 2.4 - (personalBest > 0 ? creditFont : 0);
      ctx.fillStyle = '#FF69B4';
      ctx.font = `bold ${titleFont}px Arial`;
      ctx.fillText('Kitty Unicorn Dolphin Rider', viewW / 2, titleY);

      ctx.fillStyle = 'white';
      ctx.font = `${creditFont}px Arial`;
      const creditY = titleY + titleFont * 0.85 + creditFont * 1.1;
      ctx.fillText('Designed and built by 7 year old Vivian,', viewW / 2, creditY);
      ctx.fillText('with some help from AI.', viewW / 2, creditY + creditFont * 1.5);

      if (personalBest > 0) {
        ctx.fillStyle = '#7CFFB2';
        ctx.font = `bold ${creditFont * 1.15}px Arial`;
        ctx.fillText('Your best: ' + personalBest, viewW / 2, creditY + creditFont * 3.2);
      }

      // --- HOW TO PLAY + HIGH SCORES buttons ---
      const sb = startButtonRects();
      const btnFont = Math.min(17, sb.howTo.h * 0.34);
      drawPill(sb.howTo, 'How to play', 'rgba(255,255,255,0.14)',
               'rgba(255,255,255,0.28)', 'white', btnFont);
      drawPill(sb.board, 'High scores', 'rgba(255,255,255,0.14)',
               'rgba(255,255,255,0.28)', 'white', btnFont);
      const hb = sb.howTo;

      // The prompt sits below the button, measured FROM it, so the two can
      // never overlap on an awkward screen size.
      ctx.fillStyle = '#FFD700';
      ctx.font = `bold ${promptFont}px Arial`;
      ctx.globalAlpha = 0.5 + Math.abs(Math.sin(elapsed * 3)) * 0.5;
      ctx.fillText(isTouchDevice() ? 'Tap to Start!' : 'Click or press Enter to Start!',
                   viewW / 2, hb.y + hb.h + promptFont * 2.0);
      ctx.globalAlpha = 1.0;

      ctx.textAlign = 'left';
      drawSoundButton();   // so a grown-up can mute it before a game even starts
    }

    // --- GAME OVER SCREEN (RESPONSIVE) ---
    if (gameState === 'GAMEOVER') {
      ctx.fillStyle = `rgba(0, 0, 0, ${0.7 * screenFade()})`;
      ctx.fillRect(0, 0, viewW, viewH);
      beginScreenPop();   // finished well inside INPUT_GRACE, so taps always match what's drawn

      ctx.textAlign = 'center';

      let goFont = Math.min(80, viewW * 0.12);
      let scoreFont = Math.min(40, viewW * 0.07);
      let retryFont = Math.max(14, Math.min(30, viewW * 0.045));

      ctx.fillStyle = 'white';
      ctx.font = `bold ${goFont}px Arial`;
      ctx.fillText('GAME OVER', viewW / 2, viewH / 2 - goFont * 0.5);

      ctx.font = `bold ${scoreFont}px Arial`;
      ctx.fillStyle = '#FFD700';
      const scoreY = viewH / 2 + scoreFont * 1.2;
      ctx.fillText('Final Score: ' + score, viewW / 2, scoreY);

      // Your own best on this device — something to beat on every run, not
      // just the ones good enough for the online board.
      const bestY = gameOverButtonRect().y - scoreFont * 0.34;
      if (beatBestThisRun) {
        ctx.fillStyle = '#7CFFB2';
        ctx.font = `bold ${scoreFont * 0.62}px Arial`;
        ctx.globalAlpha = 0.6 + Math.abs(Math.sin(elapsed * 6)) * 0.4;
        ctx.fillText('NEW PERSONAL BEST!', viewW / 2, bestY);
        ctx.globalAlpha = 1;
      } else if (personalBest > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.font = `${scoreFont * 0.55}px Arial`;
        ctx.fillText('Your best: ' + personalBest, viewW / 2, bestY);
      }

      // --- TRY AGAIN BUTTON ---
      // A real target you have to aim at, so you can read your score first.
      const btn = gameOverButtonRect();
      const hovered = pointInRect(pointerX, pointerY, btn);
      const radius = btn.h / 2;

      // Gentle breathing glow so it's obviously the thing to press.
      const glow = 0.5 + Math.abs(Math.sin(elapsed * 3)) * 0.5;
      ctx.save();
      ctx.shadowColor = `rgba(255, 215, 0, ${glow * 0.9})`;
      ctx.shadowBlur = hovered ? 34 : 20;

      ctx.beginPath();
      ctx.roundRect(btn.x, btn.y, btn.w, btn.h, radius);
      const btnGrad = ctx.createLinearGradient(0, btn.y, 0, btn.y + btn.h);
      btnGrad.addColorStop(0, hovered ? '#FF9AD5' : '#FF69B4');
      btnGrad.addColorStop(1, hovered ? '#FF69B4' : '#E0489A');
      ctx.fillStyle = btnGrad;
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.roundRect(btn.x, btn.y, btn.w, btn.h, radius);
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = 'white';
      ctx.font = `bold ${Math.min(34, btn.h * 0.44)}px Arial`;
      ctx.textBaseline = 'middle';
      ctx.fillText('Try Again', viewW / 2, btn.y + btn.h / 2);
      ctx.textBaseline = 'alphabetic';

      // Only drawn if it actually fits. On a very short landscape screen it
      // fell off the bottom — and a phone held sideways has no keyboard to
      // press Enter with anyway, so omitting it there loses nothing.
      const hintY = btn.y + btn.h + retryFont * 1.3;
      if (hintY <= viewH - 6 && !isTouchDevice()) {   // no Enter key on a phone
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.font = `${Math.max(12, retryFont * 0.62)}px Arial`;
        ctx.fillText('(or press Enter)', viewW / 2, hintY);
      }

      ctx.restore();   // end of the pop-in
      ctx.textAlign = 'left';
    }

    if (gameState === 'HOWTO') drawHowToPage();
    if (gameState === 'ENTER_INITIALS') drawEnterInitials();
    if (gameState === 'LEADERBOARD') drawLeaderboard();

    // Last, so it covers everything.
    if (isPortrait()) drawRotatePrompt();

    // TODO: shop screen — a 'SHOP' gameState drawn here, spending `score`.
  }

  // =====================================================================
  // MAIN LOOP
  // =====================================================================

  let lastTime = 0;

  function loop(now) {
    // requestAnimationFrame hands us a timestamp in milliseconds. The gap
    // since the last frame ("dt", in seconds) is what every movement gets
    // multiplied by, so the game runs at the same speed on every device.
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > MAX_DT) dt = MAX_DT;

    elapsed += dt;
    refreshSafeArea(dt);

    ctx.clearRect(0, 0, viewW, viewH);
    // Ease toward the target. Eased in loop() rather than update() so the
    // world visibly calms back down on the game-over and start screens
    // instead of still racing from the last run.
    // While a run is paused the world holds still and the difficulty is kept
    // as it was, so resuming picks up exactly where you left off.
    if (!runPaused) {
      const dTarget = gameState === 'PLAYING' ? difficultyTarget() : 0;
      difficultyNow += (dTarget - difficultyNow) * (1 - Math.pow(0.25, dt));

      worldScroll += scrollSpeed() * dt; // accumulated, NOT elapsed * speed
      updateSeaweed(dt); // outside update() so it drifts on the start screen too
    }
    if (gameState === 'PLAYING') spawn(dt);
    update(dt);

    // How long the current screen has been up, for the pop-in.
    if (gameState !== screenWas) { screenWas = gameState; screenAge = 0; }
    else screenAge += dt;
    if (resumeCountdown > 0) {
      resumeCountdown -= dt;
      if (resumeCountdown <= 0) finishResume();
    }
    if (restartArmed > 0) restartArmed -= dt;   // un-arms itself if the second tap never comes
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
  </script>
</body>
</html>
