<!DOCTYPE html>
<html>
<head>
  <!-- Without this, a server that does not send charset=utf-8 (anything
       but GitHub Pages, basically) mangles every emoji: the hearts in the
       lives counter render as "a ¤i". -->
  <meta charset="utf-8">
  <title>Kitty Unicorn Dolphin Rider</title>
  <!-- This meta tag prevents mobile browsers from zooming in when you tap! -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Ride a dolphin, leap for rainbows, dodge the spiky things. A game designed by 7 year old Vivian.">

  <!-- Installable web app. No service worker: Chrome no longer requires one,
       and the game already works offline on its own. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0B2F52">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kitty Unicorn">
  <!-- "default" not "black-translucent": the top of the screen during play is
       pale sky blue, and a translucent bar draws its clock in white on top. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%88%3C/text%3E%3C/svg%3E">

  <meta property="og:title" content="Kitty Unicorn Dolphin Rider">
  <meta property="og:description" content="Ride a dolphin, leap for rainbows, dodge the spiky things. A game designed by 7 year old Vivian.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kudr.eriksheridan.com/">
  <meta property="og:image" content="https://kudr.eriksheridan.com/icon-512.png">
  <style>
    /* touch-action: none prevents the screen from scrolling when swiping/tapping */
    body { margin: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
  // =====================================================================
  // SETUP
  // =====================================================================

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // --- TUNING VALUES ---------------------------------------------------
  // Every speed below is "per SECOND", not "per frame". That's what makes
  // the game feel the same on a slow phone and a fast 120Hz laptop.
  // (Tweak these numbers to change how the game feels.)

  // Dolphin movement
  // How far in from the left edge the dolphin sits. On a wide screen it's a
  // fixed 200px, but on a narrow phone that was over HALF the screen — you
  // couldn't see gems or shells arriving in time to react. So on small
  // screens it slides left to a quarter of the width instead.
  const PLAYER_X_MAX  = 200;
  const PLAYER_X_FRAC = 0.25;
  const PLAYER_X_MIN  = 90;  // any less and the dolphin's tail hangs off-screen
  const RISE_ACCEL  = 7920;  // how hard you're pushed UP while holding, in water
  const SINK_ACCEL  = 3600;  // how hard you sink when you let go, in water
  const AIR_GRAVITY = 1620;  // gravity while airborne (you can't steer mid-leap)
  const WATER_DRAG  = 0.92;  // fraction of speed kept each 1/60s in water
  const AIR_DRAG    = 0.98;  // ...and in the air
  const CEILING_Y   = 40;    // dolphin can't fly higher than this

  // How much the dolphin tips nose-up/nose-down as it moves. Speeds are in
  // pixels per SECOND (so they reach ~1000), hence the very small number.
  const TILT_PER_SPEED = 0.0005;
  const MAX_TILT       = 0.5; // ...but never tip further than this (~30°),
                              // so a fast dive can't turn into a somersault

  // World
  const SCROLL_SPEED   = 300; // px/sec that gems and the seafloor slide left
  const OBSTACLE_SPEED = 360; // shells come at you slightly faster

  // Shells shimmer once they're this close, giving a warning before they
  // arrive. At 360 px/sec that's about 1.7 seconds to react — enough time
  // for a young player to steer out of the way.
  const SHELL_WARN_DISTANCE = 600;

  // Most hazards are the spiky shell. Urchins and jellyfish turn up now and
  // then, so they stay a surprise rather than becoming the norm.
  const URCHIN_CHANCE = 0.12;
  const JELLY_CHANCE  = 0.12;

  // Each hazard gets a hit box matching its own shape, instead of one square
  // for all three. The jellyfish is a narrow dome with long trailing
  // tentacles, so a wide box would let it sting you through empty water at
  // its sides; `oy` shifts the box down to cover those tentacles.
  const OBSTACLE_HITBOX = {
    shell:  { hw: 45, hh: 45, oy: 0 },
    urchin: { hw: 36, hh: 36, oy: 0 },
    jelly:  { hw: 26, hh: 30, oy: 10 }
  };
  const FLOOR_HEIGHT   = 60;  // height of the sandy seafloor

  // Spawning (chances PER SECOND)
  const ITEM_SPAWN_RATE     = 1.2;
  const OBSTACLE_SPAWN_RATE = 0.36;
  const ITEM_MIN_Y          = 40; // highest anything spawns
  // Share of spawned items that are rainbows. Rarer than a heart (5%), so
  // you'll usually see about three in a game — but a long run can have more.
  const RAINBOW_CHANCE      = 0.03;
  // Donuts and hearts are the valuable ones, so they only appear in the SKY —
  // you have to leap out of the water to earn them. Gems (the cheap ones) can
  // show up anywhere, so diving is still worth something.
  const AIR_ITEM_MARGIN     = 45; // keeps sky items clear of the wavy surface
  // The rainbow sits in a big bubble, so it needs more room than the others
  // to stay fully on screen up top and clear of the waves down below.
  const RAINBOW_BUBBLE_R    = 30; // how big the bubble around the rainbow is
  const RAINBOW_MIN_Y       = 62;
  const RAINBOW_MARGIN      = 70;

  // Splash particles
  const SPLASH_GRAVITY = 1800;
  const SPLASH_FADE    = 1.8; // how fast a droplet fades out, per second

  // Scoring
  const GEM_VALUE     = 10;
  const DONUT_VALUE   = 50;
  const RAINBOW_VALUE = 116;  // Vivian's pick — 16 is her lucky number
  const START_LIVES = 3;

  // --- LEADERBOARD ------------------------------------------------------
  // This publishable key is MEANT to be public. The table has Row Level
  // Security allowing only SELECT and INSERT, so the worst anyone can do with
  // it is add a score — it cannot be used to edit or delete the board, or to
  // reach anything else. (Verified: PATCH and DELETE match zero rows.)
  //
  // Scores are forgeable by anyone who opens devtools. That's unavoidable for
  // a browser game with no accounts, and fine for this one.
  const SUPABASE_URL = 'https://dsandoakgeceuzyhwxhg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_p7QhKoUFYdj1alM5Sx5hkQ_Q7JxR4gi';
  const LEADERBOARD_SIZE = 10;
  const NET_TIMEOUT_MS = 6000;

  // Three letters can spell things you'd rather not see on a child's game.
  // Not exhaustive and not a security boundary — just a decency filter.
  const BLOCKED_INITIALS = ['ASS','ARS','FUK','FCK','FUC','SHT','SHI','CUM',
    'TIT','DIK','DIC','COK','CNT','PIS','PSS','WTF','KKK','FAG','NIG','HOE',
    'SLT','ANL','SEX','JIZ','TWT'];

  // If the browser tab is hidden for a while, the next frame's time gap is
  // huge and would teleport the dolphin. Clamping it makes the game just
  // pick up smoothly instead.
  const MAX_DT = 0.05;

  // --- CANVAS SIZING (sharp on Retina / high-DPI screens) --------------
  // viewW/viewH are the size in CSS pixels — all game logic uses these.
  // The canvas itself is made bigger behind the scenes (times the device
  // pixel ratio) so the art is crisp instead of blurry, then we scale the
  // drawing context to match so we can keep thinking in normal pixels.
  let viewW = 0;
  let viewH = 0;

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    viewW = window.innerWidth;
    viewH = window.innerHeight;

    canvas.width  = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    canvas.style.width  = viewW + 'px';
    canvas.style.height = viewH + 'px';

    // Changing canvas.width resets the context, so re-apply the scale here.
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  resizeCanvas();

  // Where the surface of the water sits.
  function waterLineY() {
    return viewH / 2 + 20;
  }

  // How far the wavy surface rises or falls at a given x, relative to the
  // flat waterline. Kept as one function so every bit of the surface is
  // drawn from the same formula.
  function surfaceWaveAt(x) {
    return Math.sin((x * 0.005) + (elapsed * 3)) * 15;
  }

  // The dolphin's home x position, worked out from the current screen width.
  // It's a function rather than a constant so rotating a phone recalculates it.
  function playerHomeX() {
    return Math.max(PLAYER_X_MIN, Math.min(PLAYER_X_MAX, viewW * PLAYER_X_FRAC));
  }

  // Where the "Try Again" button sits on the GAME OVER screen. Both the
  // drawing code and the click test call this, so they can never disagree
  // about where the button actually is.
  function gameOverButtonRect() {
    const scoreFont = Math.min(40, viewW * 0.07);
    const w = Math.max(200, Math.min(340, viewW * 0.5));
    const h = Math.max(56, Math.min(84, viewH * 0.09));
    return {
      x: viewW / 2 - w / 2,
      y: viewH / 2 + scoreFont * 1.2 + 48,
      w: w,
      h: h
    };
  }

  // The how-to-play page is laid out in fixed "natural" units and then scaled
  // to fit the screen. A phone held sideways has plenty of width but almost no
  // height, so it switches to TWO COLUMNS there — shrinking a single column to
  // fit 375px of height drove the text down to ~9px, which a child can't read.
  function howToLayout() {
    const wide = viewH < 520 && viewW > 560;
    const natW = wide ? 660 : 330;
    const natH = wide ? 330 : 480;
    const scale = Math.min(1, (viewH - 30) / natH, (viewW - 30) / natW);
    return { wide: wide, s: scale, cx: viewW / 2, top: (viewH - natH * scale) / 2 };
  }

  // Where everything sits, in natural units, for each of the two shapes.
  function howToSlots(wide) {
    return wide
      ? { titleX: -165, titleY: 30, physX: -165, p1: 88, p2: 122, p3: 148,
          goodX: 165, goodY: 30, iconsY: 74, valuesY: 114,
          badX: 165, badY: 156, hazY: 202, w1: 250, w2: 270, backY: 278 }
      : { titleX: 0, titleY: 26, physX: 0, p1: 74, p2: 102, p3: 126,
          goodX: 0, goodY: 170, iconsY: 212, valuesY: 250,
          badX: 0, badY: 292, hazY: 336, w1: 388, w2: 408, backY: 424 };
  }

  function howToBackRect() {
    const L = howToLayout();
    const w = 150 * L.s, h = 46 * L.s;
    return { x: L.cx - w / 2, y: L.top + howToSlots(L.wide).backY * L.s, w: w, h: h };
  }

  // Start screen now has two buttons side by side. Both are laid out from one
  // place so they can never overlap or drift apart.
  function startButtonRects() {
    const gap = 12;
    const total = Math.max(300, Math.min(420, viewW * 0.86));
    const w = (total - gap) / 2;
    const h = Math.max(48, Math.min(58, viewH * 0.062));
    const y = viewH / 2 + 24;
    return {
      howTo: { x: viewW / 2 - total / 2, y: y, w: w, h: h },
      board: { x: viewW / 2 - total / 2 + w + gap, y: y, w: w, h: h }
    };
  }

  // --- initials entry ---
  function initialsLayout() {
    const s = Math.min(1, (viewH - 40) / 420, (viewW - 30) / 320);
    return { s: s, cx: viewW / 2, top: (viewH - 420 * s) / 2 };
  }
  function initialsSlotRect(i) {
    const L = initialsLayout();
    const w = 64 * L.s, h = 84 * L.s, gap = 16 * L.s;
    const total = w * 3 + gap * 2;
    return { x: L.cx - total / 2 + i * (w + gap), y: L.top + 150 * L.s, w: w, h: h };
  }
  function initialsChevronRect(i, up) {
    const slot = initialsSlotRect(i);
    const L = initialsLayout();
    const h = Math.max(42, 42 * L.s);   // floored: still tappable when scaled
    return { x: slot.x, y: up ? slot.y - h - 6 * L.s : slot.y + slot.h + 6 * L.s,
             w: slot.w, h: h };
  }

  // Save and Skip sit SIDE BY SIDE, not stacked. Stacked, two floored-height
  // buttons plus their gap overflowed the bottom of a landscape phone.
  function initialsButtonRow() {
    const L = initialsLayout();
    const h = Math.max(48, 52 * L.s);
    const saveW = Math.max(130, 170 * L.s);
    const skipW = Math.max(96, 120 * L.s);
    const gap = 14 * L.s;
    const total = saveW + gap + skipW;
    const y = L.top + 332 * L.s;
    return {
      save: { x: L.cx - total / 2, y: y, w: saveW, h: h },
      skip: { x: L.cx - total / 2 + saveW + gap, y: y, w: skipW, h: h }
    };
  }
  function initialsSaveRect() { return initialsButtonRow().save; }
  function initialsSkipRect() { return initialsButtonRow().skip; }

  // --- leaderboard ---
  function boardLayout() {
    const s = Math.min(1, (viewH - 30) / 520, (viewW - 24) / 340);
    return { s: s, cx: viewW / 2, top: (viewH - 520 * s) / 2 };
  }
  function boardTabRect(i) {
    const L = boardLayout();
    const w = 104 * L.s, h = Math.max(40, 38 * L.s), gap = 6 * L.s;
    const total = w * 3 + gap * 2;
    return { x: L.cx - total / 2 + i * (w + gap), y: L.top + 58 * L.s, w: w, h: h };
  }
  function boardBackRect() {
    const L = boardLayout();
    const w = Math.max(130, 150 * L.s), h = Math.max(46, 46 * L.s);
    return { x: L.cx - w / 2, y: L.top + 462 * L.s, w: w, h: h };
  }

  function pointInRect(px, py, r) {
    return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  }

  // --- GAME STATE ------------------------------------------------------
  let isPressing = false;
  let score = 0;
  let lives = START_LIVES;
  let gameState = 'START';
  let elapsed = 0; // seconds since load — drives all the wobble animations

  // --- leaderboard state ---
  const board = { all: null, month: null, week: null };   // null = not loaded
  let boardTab = 'all';
  let boardStatus = 'idle';      // idle | loading | ok | error
  let initials = ['A', 'A', 'A'];
  let initialsSlot = 0;
  let pendingScore = 0;          // the score waiting to be saved
  let submitStatus = 'idle';     // idle | sending | done | error

  const player = { x: playerHomeX(), y: viewH / 2, dy: 0 };
  const items = [];
  const obstacles = [];
  const splashes = [];
  const clouds = [];

  for (let i = 0; i < 6; i++) {
    clouds.push({
      x: Math.random() * viewW,
      y: Math.random() * (viewH / 2 - 80) + 20,
      size: Math.random() * 25 + 30,
      speed: Math.random() * 30 + 12 // px/sec
    });
  }

  // --- SEAWEED (background scenery) ---
  const SEAWEED_COUNT = 12;
  const seaweed = [];

  function makeSeaweed(x) {
    return {
      x: x,
      kind: Math.random() < 0.5 ? 'bubble' : 'leafy',
      height: 55 + Math.random() * 75,
      phase: Math.random() * Math.PI * 2
    };
  }

  for (let i = 0; i < SEAWEED_COUNT; i++) {
    seaweed.push(makeSeaweed(Math.random() * (viewW + 300)));
  }

  // Seaweed is rooted in the sandy floor, so it has to scroll at exactly the
  // same speed. This lives outside update() on purpose: update() stops while
  // you're on the start screen, but the floor keeps sliding, and frozen weeds
  // growing out of moving sand would look broken.
  function updateSeaweed(dt) {
    for (let i = 0; i < seaweed.length; i++) {
      seaweed[i].x -= SCROLL_SPEED * dt;
      if (seaweed[i].x < -70) seaweed[i] = makeSeaweed(viewW + 70 + Math.random() * 140);
    }
  }

  // Handle window resizing (like rotating a phone) dynamically
  window.addEventListener('resize', () => {
    resizeCanvas();
    player.x = playerHomeX(); // re-centre for the new width (e.g. phone rotated)
    if (player.y > viewH - 80) player.y = viewH - 80;
  });

  // Calendar periods, not rolling windows — everyone's board resets together,
  // so there's a fresh start to race for. Week starts Monday.
  function periodStart(period) {
    const now = new Date();
    if (period === 'month') return new Date(now.getFullYear(), now.getMonth(), 1);
    if (period === 'week') {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // Monday = 0
      return d;
    }
    return null; // all time
  }

  function supaHeaders() {
    return { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY,
             'Content-Type': 'application/json' };
  }

  // Every network call in this game returns null on ANY failure rather than
  // throwing. The game has to stay playable with no internet at all, so a
  // dead leaderboard must never be able to break a frame.
  async function loadScores(period) {
    try {
      let url = SUPABASE_URL + '/rest/v1/scores?select=initials,score' +
                '&order=score.desc&limit=' + LEADERBOARD_SIZE;
      const since = periodStart(period);
      if (since) url += '&created_at=gte.' + encodeURIComponent(since.toISOString());

      const res = await fetch(url, {
        headers: supaHeaders(),
        signal: AbortSignal.timeout(NET_TIMEOUT_MS)
      });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) {
      return null;
    }
  }

  async function submitScore(name, value) {
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/scores', {
        method: 'POST',
        headers: supaHeaders(),
        body: JSON.stringify({ initials: name, score: value }),
        signal: AbortSignal.timeout(NET_TIMEOUT_MS)
      });
      return res.ok;
    } catch (e) {
      return false;
    }
  }

  function refreshBoard(period) {
    boardStatus = 'loading';
    loadScores(period).then(rows => {
      board[period] = rows;                       // null means "couldn't load"
      boardStatus = rows === null ? 'error' : 'ok';
    });
  }

  // Did this run earn a place? If we can't reach the server we say no, so the
  // player is never asked for initials we then fail to save.
  async function qualifiesForBoard(value) {
    if (value <= 0) return false;
    const rows = await loadScores('all');
    if (rows === null) return false;
    board.all = rows;
    if (rows.length < LEADERBOARD_SIZE) return true;
    return value > rows[rows.length - 1].score;
  }

  // Keeps a "keep this fraction of speed every 1/60s" drag feeling the same
  // no matter the frame rate.
  function applyDrag(value, keepPerTick, dt) {
    return value * Math.pow(keepPerTick, dt * 60);
  }

  // --- AUDIO SYSTEM ----------------------------------------------------
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playCollectSound(isDonut) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    osc.type = 'sine';
    let freq = isDonut ? 1200 : 800;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.1);

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  }

  function playHitSound() {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);

    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  }

  function playHeartSound() {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    osc.type = 'square';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
    osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);

    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }

  function playRainbowSound() {
    if (!audioCtx) return;
    // A little rising arpeggio — the fanciest sound in the game, for the
    // rarest thing in it. Five notes climbing, each starting slightly later.
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    notes.forEach((freq, i) => {
      const t = audioCtx.currentTime + i * 0.07;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);

      osc.start(t); osc.stop(t + 0.35);
    });
  }

  function playSplashSound() {
    if (!audioCtx) return;
    let bloop = audioCtx.createOscillator();
    let bloopGain = audioCtx.createGain();
    bloop.type = 'sine';
    bloop.frequency.setValueAtTime(600, audioCtx.currentTime);
    bloop.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
    bloopGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
    bloopGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    bloop.connect(bloopGain); bloopGain.connect(audioCtx.destination);
    bloop.start(); bloop.stop(audioCtx.currentTime + 0.15);

    let bufferSize = audioCtx.sampleRate * 0.15;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    let noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    let filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 800;
    let noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
    noise.start();
  }

  // =====================================================================
  // INPUT
  // =====================================================================

  function handleGameStart() {
    score = 0;
    lives = START_LIVES;
    items.length = 0;
    obstacles.length = 0;
    splashes.length = 0;
    player.x = playerHomeX();
    player.y = viewH / 2;
    player.dy = 0;
    gameState = 'PLAYING';
  }

  // Where the mouse/finger last was, in CSS pixels. The canvas fills the
  // whole window, so the browser's client coordinates are already what we
  // draw in — no conversion needed.
  let pointerX = -1;
  let pointerY = -1;

  function cycleLetter(i, dir) {
    const code = initials[i].charCodeAt(0) - 65;
    initials[i] = String.fromCharCode(65 + ((code + dir) % 26 + 26) % 26);
    initialsSlot = i;
  }

  function openLeaderboard() {
    gameState = 'LEADERBOARD';
    boardTab = 'all';
    refreshBoard('all');
  }

  function saveInitials() {
    if (submitStatus === 'sending') return;
    let name = initials.join('');
    if (BLOCKED_INITIALS.indexOf(name) !== -1) name = 'AAA'; // quietly tidied
    submitStatus = 'sending';
    submitScore(name, pendingScore).then(ok => {
      submitStatus = ok ? 'done' : 'error';
      if (ok) {
        board.all = board.month = board.week = null; // force a re-fetch
        openLeaderboard();
      }
    });
  }

  function readPointerPos(e) {
    if (!e) return;
    const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
    if (t) { pointerX = t.clientX; pointerY = t.clientY; }
    else if (e.clientX !== undefined) { pointerX = e.clientX; pointerY = e.clientY; }
  }

  function handlePointerDown(e) {
    if (e) e.preventDefault(); // Extra safeguard for mobile touches
    readPointerPos(e);
    initAudio();

    if (gameState === 'START') {
      // Tapping a button opens that page; tapping anywhere else still just
      // starts the game, the way it always has.
      const sb = startButtonRects();
      if (pointInRect(pointerX, pointerY, sb.howTo)) gameState = 'HOWTO';
      else if (pointInRect(pointerX, pointerY, sb.board)) openLeaderboard();
      else handleGameStart();
    } else if (gameState === 'ENTER_INITIALS') {
      for (let i = 0; i < 3; i++) {
        if (pointInRect(pointerX, pointerY, initialsChevronRect(i, true)))  { cycleLetter(i, +1); return; }
        if (pointInRect(pointerX, pointerY, initialsChevronRect(i, false))) { cycleLetter(i, -1); return; }
        if (pointInRect(pointerX, pointerY, initialsSlotRect(i)))           { initialsSlot = i; return; }
      }
      if (pointInRect(pointerX, pointerY, initialsSaveRect())) saveInitials();
      else if (pointInRect(pointerX, pointerY, initialsSkipRect())) gameState = 'GAMEOVER';
    } else if (gameState === 'LEADERBOARD') {
      for (let i = 0; i < 3; i++) {
        if (pointInRect(pointerX, pointerY, boardTabRect(i))) {
          boardTab = ['all', 'month', 'week'][i];
          if (board[boardTab] === null || board[boardTab] === undefined) refreshBoard(boardTab);
          else boardStatus = 'ok';
          return;
        }
      }
      if (pointInRect(pointerX, pointerY, boardBackRect())) gameState = 'START';
    } else if (gameState === 'HOWTO') {
      gameState = 'START'; // any tap goes back — nothing to lose by closing it
    } else if (gameState === 'GAMEOVER') {
      // You have to actually hit the Try Again button. A stray tap anywhere
      // else does nothing, so your score stays on screen until you're ready.
      if (pointInRect(pointerX, pointerY, gameOverButtonRect())) handleGameStart();
    } else if (gameState === 'PLAYING') {
      isPressing = true;
    }
  }

  window.addEventListener('mousemove', readPointerPos);
  window.addEventListener('mousedown', handlePointerDown);
  window.addEventListener('mouseup', () => isPressing = false);
  window.addEventListener('touchstart', handlePointerDown, { passive: false });
  window.addEventListener('touchend', () => isPressing = false);

  window.addEventListener('keydown', (e) => {
    // --- initials entry has its own keyboard handling ---
    if (gameState === 'ENTER_INITIALS') {
      if (e.key && /^[a-zA-Z]$/.test(e.key)) {
        initials[initialsSlot] = e.key.toUpperCase();
        if (initialsSlot < 2) initialsSlot++;
      } else if (e.code === 'ArrowUp')    cycleLetter(initialsSlot, +1);
      else if (e.code === 'ArrowDown')    cycleLetter(initialsSlot, -1);
      else if (e.code === 'ArrowLeft')    initialsSlot = Math.max(0, initialsSlot - 1);
      else if (e.code === 'ArrowRight')   initialsSlot = Math.min(2, initialsSlot + 1);
      else if (e.code === 'Backspace')    initialsSlot = Math.max(0, initialsSlot - 1);
      else if (e.code === 'Enter')        saveInitials();
      else if (e.code === 'Escape')       gameState = 'GAMEOVER';
      e.preventDefault();
      return;
    }
    if (gameState === 'LEADERBOARD' && (e.code === 'Enter' || e.code === 'Escape')) {
      gameState = 'START'; e.preventDefault(); return;
    }

    if (e.code === 'Enter') {
      if (gameState === 'HOWTO') {
        gameState = 'START'; // Enter closes the instructions rather than
                             // launching straight into a game, so you always
                             // land back somewhere you recognise
      } else if (gameState === 'START' || gameState === 'GAMEOVER') {
        initAudio();
        handleGameStart();
      }
      e.preventDefault();
    }
    if (e.code === 'Space') {
      if (gameState === 'PLAYING') {
        initAudio();
        isPressing = true;
      }
      e.preventDefault();
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') isPressing = false;
  });

  // =====================================================================
  // UPDATE
  // =====================================================================

  function spawn(dt) {
    // "rate * dt" turns a per-second chance into a per-frame chance, so the
    // same number of gems appears no matter the frame rate.
    if (Math.random() < ITEM_SPAWN_RATE * dt) {
      let rand = Math.random();
      let type = 'gem';
      if (rand < RAINBOW_CHANCE) type = 'rainbow';
      else if (rand < RAINBOW_CHANCE + 0.05) type = 'heart';
      else if (rand < RAINBOW_CHANCE + 0.25) type = 'donut';

      // Rainbows, donuts and hearts are air-only, so the good stuff costs a leap.
      // Gems can be anywhere, which keeps diving worth a little something.
      let highestY = ITEM_MIN_Y;
      let lowestY;
      if (type === 'gem') {
        lowestY = viewH - FLOOR_HEIGHT - 40; // down to just above the seafloor
      } else if (type === 'rainbow') {
        highestY = RAINBOW_MIN_Y;
        lowestY = waterLineY() - RAINBOW_MARGIN;
      } else {
        lowestY = waterLineY() - AIR_ITEM_MARGIN; // stay up in the sky
      }
      if (lowestY < highestY) lowestY = highestY; // guard for very short screens

      items.push({
        x: viewW + 50,
        baseY: highestY + Math.random() * (lowestY - highestY),
        phase: Math.random() * Math.PI * 2,
        itemType: type
      });
    }

    if (Math.random() < OBSTACLE_SPAWN_RATE * dt) {
      let r = Math.random();
      let kind = 'shell';
      if (r < URCHIN_CHANCE) kind = 'urchin';
      else if (r < URCHIN_CHANCE + JELLY_CHANCE) kind = 'jelly';

      // Hazards stay underwater, and off the seafloor so they're not buried.
      let top = waterLineY();
      let bottom = viewH - FLOOR_HEIGHT - 30;
      if (kind === 'urchin') top += 12;                  // spines reach higher
      if (kind === 'jelly') { top += 22; bottom -= 40; } // tentacles hang low

      obstacles.push({
        x: viewW + 50,
        y: top + Math.random() * (bottom - top),
        kind: kind
      });
    }
  }

  function createSplash(x, y, speed) {
    playSplashSound();
    for (let i = 0; i < 30; i++) {
      splashes.push({
        x: x + (Math.random() - 0.5) * 80, y: y,
        dx: (Math.random() - 0.5) * 480 - 120,
        dy: -(Math.random() * 480 + Math.abs(speed) * 0.6 + 120),
        life: 1.0, size: Math.random() * 8 + 3
      });
    }
  }

  function update(dt) {
    if (gameState !== 'PLAYING') return;

    const waterLine = waterLineY();

    clouds.forEach(c => {
      c.x -= c.speed * dt;
      if (c.x < -100) { c.x = viewW + 100; c.y = Math.random() * (viewH / 2 - 80) + 20; }
    });

    // --- Dolphin physics ---
    // Remember whether we were underwater BEFORE moving, so we can spot the
    // exact moment we cross the surface and make a splash.
    const wasInWater = player.y >= waterLine;

    if (wasInWater) {
      if (isPressing) player.dy -= RISE_ACCEL * dt; else player.dy += SINK_ACCEL * dt;
      player.dy = applyDrag(player.dy, WATER_DRAG, dt);
    } else {
      player.dy += AIR_GRAVITY * dt;
      player.dy = applyDrag(player.dy, AIR_DRAG, dt);
    }

    player.y += player.dy * dt;

    if (player.y < CEILING_Y) { player.y = CEILING_Y; player.dy = 0; }
    if (player.y > viewH - FLOOR_HEIGHT - 20) { player.y = viewH - FLOOR_HEIGHT - 20; player.dy = 0; }

    const isInWater = player.y >= waterLine;
    if (wasInWater !== isInWater) createSplash(player.x, waterLine, player.dy);

    // --- Splash droplets ---
    for (let i = splashes.length - 1; i >= 0; i--) {
      let p = splashes[i];
      p.x += p.dx * dt;
      p.y += p.dy * dt;
      p.dy += SPLASH_GRAVITY * dt;
      p.life -= SPLASH_FADE * dt;
      if (p.life <= 0) splashes.splice(i, 1);
    }

    // --- Gems, donuts and hearts ---
    for (let i = items.length - 1; i >= 0; i--) {
      items[i].x -= SCROLL_SPEED * dt;
      items[i].y = items[i].baseY + Math.sin(elapsed * 3 + items[i].phase) * 10;

      if (Math.abs(items[i].x - player.x) < 50 && Math.abs(items[i].y - player.y) < 50) {
        if (items[i].itemType === 'heart') {
          lives++;
          playHeartSound();
        } else if (items[i].itemType === 'rainbow') {
          score += RAINBOW_VALUE;
          playRainbowSound();
        } else {
          score += items[i].itemType === 'donut' ? DONUT_VALUE : GEM_VALUE;
          playCollectSound(items[i].itemType === 'donut');
        }
        items.splice(i, 1);
      } else if (items[i].x < -50) {
        items.splice(i, 1);
      }
    }

    // --- Spiky shells ---
    for (let i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].x -= OBSTACLE_SPEED * dt;
      const box = OBSTACLE_HITBOX[obstacles[i].kind] || OBSTACLE_HITBOX.shell;
      if (Math.abs(obstacles[i].x - player.x) < box.hw &&
          Math.abs((obstacles[i].y + box.oy) - player.y) < box.hh) {
        playHitSound();
        lives--;
        obstacles.splice(i, 1);

        if (lives <= 0) {
          gameState = 'GAMEOVER';
          isPressing = false;
          // Ask the board whether this run earned a place. If we can't reach
          // it, qualifiesForBoard returns false and the player simply never
          // sees the initials screen — no error, no blocked game.
          pendingScore = score;
          submitStatus = 'idle';
          initials = ['A', 'A', 'A'];
          initialsSlot = 0;
          const runScore = score;
          qualifiesForBoard(runScore).then(yes => {
            if (yes && gameState === 'GAMEOVER' && score === runScore) {
              gameState = 'ENTER_INITIALS';
            }
          });
        }
      } else if (obstacles[i].x < -50) {
        obstacles.splice(i, 1);
      }
    }
  }

  // =====================================================================
  // DRAW
  // =====================================================================

  function drawGem(x, y) {
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = '#00FFFF';
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(15, 0); ctx.lineTo(0, 20); ctx.lineTo(-15, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(8, -5); ctx.lineTo(0, 5); ctx.lineTo(-8, -5); ctx.fill();
    ctx.strokeStyle = '#008B8B'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(15, 0); ctx.lineTo(0, 20); ctx.lineTo(-15, 0); ctx.closePath(); ctx.stroke();
    ctx.restore();
  }

  function drawDonut(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#D2B48C'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FF69B4'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'white'; ctx.fillRect(-8, -8, 4, 2); ctx.fillStyle = 'yellow'; ctx.fillRect(5, -10, 2, 4);
    ctx.fillStyle = 'cyan'; ctx.fillRect(-10, 5, 2, 4); ctx.fillStyle = 'white'; ctx.fillRect(4, 8, 4, 2);
    ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawHeart(x, y) {
    ctx.save(); ctx.translate(x, y);
    let scale = 1 + Math.sin(elapsed * 6) * 0.1;
    ctx.scale(scale, scale);
    ctx.fillStyle = '#FF0000';
    ctx.beginPath(); ctx.moveTo(0, 5); ctx.bezierCurveTo(0, -10, -15, -15, -15, -5); ctx.bezierCurveTo(-15, 5, 0, 15, 0, 20); ctx.bezierCurveTo(0, 15, 15, 5, 15, -5); ctx.bezierCurveTo(15, -15, 0, -10, 0, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ctx.beginPath(); ctx.arc(-6, -5, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#8B0000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 5); ctx.bezierCurveTo(0, -10, -15, -15, -15, -5); ctx.bezierCurveTo(-15, 5, 0, 15, 0, 20); ctx.bezierCurveTo(0, 15, 15, 5, 15, -5); ctx.bezierCurveTo(15, -15, 0, -10, 0, 5); ctx.stroke();
    ctx.restore();
  }

  // `warn` runs 0 → 1 as the shell closes in, fading a shimmer up around it
  // so you get a heads-up instead of a nasty surprise.
  // The rainbow treasure: the rarest thing in the game, so it gets the
  // fanciest art — a bigger rainbow floating inside a rainbow-rimmed bubble.
  function drawRainbow(x, y) {
    ctx.save(); ctx.translate(x, y);

    // The soft inside of the bubble.
    ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
    ctx.beginPath(); ctx.arc(0, 0, RAINBOW_BUBBLE_R, 0, Math.PI * 2); ctx.fill();

    // The rainbow: five arcs nested inside each other, flat side down.
    // PI -> 2*PI sweeps the TOP half of the circle (canvas y grows downward).
    const bands = [[22, '#FF4136'], [18, '#FF851B'], [14, '#FFDC00'],
                   [10, '#2ECC40'], [6, '#0074D9']];
    ctx.lineWidth = 4;
    ctx.lineCap = 'butt';
    bands.forEach(band => {
      ctx.strokeStyle = band[1];
      ctx.beginPath();
      ctx.arc(0, 11, band[0], Math.PI, Math.PI * 2);
      ctx.stroke();
    });

    // The bubble's rim: six coloured arcs going all the way round.
    const rim = ['#FF4136', '#FF851B', '#FFDC00', '#2ECC40', '#0074D9', '#B10DC9'];
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    rim.forEach((color, i) => {
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.arc(0, 0, RAINBOW_BUBBLE_R,
              -Math.PI / 2 + (i / 6) * Math.PI * 2,
              -Math.PI / 2 + ((i + 1) / 6) * Math.PI * 2);
      ctx.stroke();
    });

    // A shine near the top left, the way a real bubble catches the light.
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.beginPath(); ctx.ellipse(-12, -14, 7, 4.5, -0.61, 0, Math.PI * 2); ctx.fill();

    // Sparkles just outside the bubble, twinkling out of phase.
    [[-36, -13], [36, -9], [0, -33]].forEach((pos, i) => {
      const twinkle = 0.45 + Math.abs(Math.sin(elapsed * 5 + i * 2)) * 0.55;
      const sz = 2.2 + twinkle * 1.8;
      const sx = pos[0], sy = pos[1];
      ctx.fillStyle = 'rgba(255, 255, 255, ' + twinkle + ')';
      ctx.beginPath();
      ctx.moveTo(sx, sy - sz);
      ctx.lineTo(sx + sz * 0.35, sy - sz * 0.35);
      ctx.lineTo(sx + sz, sy);
      ctx.lineTo(sx + sz * 0.35, sy + sz * 0.35);
      ctx.lineTo(sx, sy + sz);
      ctx.lineTo(sx - sz * 0.35, sy + sz * 0.35);
      ctx.lineTo(sx - sz, sy);
      ctx.lineTo(sx - sz * 0.35, sy - sz * 0.35);
      ctx.closePath(); ctx.fill();
    });

    ctx.restore();
  }

  // The red "watch out" glow. All three hazards share it, so there's one
  // place to change how the warning looks. RED on purpose: a gold or white
  // sparkle reads as treasure and made players swim TOWARD the hazards.
  function drawHazardShimmer(warn) {
    if (warn <= 0) return;
    const pulse = 0.55 + Math.abs(Math.sin(elapsed * 9)) * 0.45;
    const radius = 34 + warn * 12;
    const halo = ctx.createRadialGradient(0, 0, radius * 0.3, 0, 0, radius);
    halo.addColorStop(0, `rgba(255, 40, 40, ${warn * pulse * 0.85})`);
    halo.addColorStop(1, 'rgba(190, 0, 0, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();

    // Warning sparks orbiting out of phase, so it flickers like a hazard
    // light rather than glowing steadily.
    for (let s = 0; s < 3; s++) {
      const angle = (s / 3) * Math.PI * 2 + elapsed * 1.5;
      const twinkle = Math.abs(Math.sin(elapsed * 7 + s * 2));
      ctx.fillStyle = `rgba(255, 80, 60, ${warn * twinkle * 0.95})`;
      ctx.beginPath();
      ctx.arc(Math.cos(angle) * 32, Math.sin(angle) * 27, 1.5 + twinkle * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Sea urchin: a dark ball under two rings of spines, the short set sitting
  // between the long ones so it reads as prickly all the way round.
  function drawSeaUrchin(x, y, warn) {
    ctx.save(); ctx.translate(x, y);
    drawHazardShimmer(warn);
    ctx.rotate(Math.sin(elapsed * 2.2) * 0.15);

    ctx.lineCap = 'round';
    ctx.strokeStyle = '#7A1F44'; ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + Math.PI / 12;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 13, Math.sin(a) * 13);
      ctx.lineTo(Math.cos(a) * 23, Math.sin(a) * 23);
      ctx.stroke();
    }
    ctx.strokeStyle = '#9E2C55'; ctx.lineWidth = 2.6;
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 14, Math.sin(a) * 14);
      ctx.lineTo(Math.cos(a) * 30, Math.sin(a) * 30);
      ctx.stroke();
    }

    ctx.fillStyle = '#8B2252';
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(168, 56, 102, 0.9)';
    ctx.beginPath(); ctx.arc(-5, -5, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Jellyfish: a scalloped dome with tentacles that drift behind it as it
  // bobs along.
  function drawJellyfish(x, y, warn) {
    ctx.save(); ctx.translate(x, y);
    drawHazardShimmer(warn);
    ctx.translate(0, Math.sin(elapsed * 2.4) * 3); // gentle bob

    const drift = Math.sin(elapsed * 2) * 4;
    // Vivian's colours: the original deep pink dome, with distinctly darker
    // tentacles underneath so the two halves read apart.
    ctx.strokeStyle = '#8E1B3A'; ctx.lineWidth = 2.8; ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const tx = -14 + i * 7;
      ctx.beginPath();
      ctx.moveTo(tx, 6);
      ctx.quadraticCurveTo(tx - 3 + drift, 16, tx + 1 + drift, 25);
      ctx.quadraticCurveTo(tx + 4 + drift * 1.2, 31, tx + 1 + drift * 1.5, 37);
      ctx.stroke();
    }

    ctx.fillStyle = '#C2185B';
    ctx.beginPath();
    ctx.ellipse(0, 4, 20, 17, 0, Math.PI, Math.PI * 2); // top half of the dome
    ctx.quadraticCurveTo(15, 11, 10, 4);
    ctx.quadraticCurveTo(5, 11, 0, 4);
    ctx.quadraticCurveTo(-5, 11, -10, 4);
    ctx.quadraticCurveTo(-15, 11, -20, 4);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.beginPath(); ctx.ellipse(-7, -6, 7, 4, -0.4, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-7, -1, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -1, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d0c22';
    ctx.beginPath(); ctx.arc(-7, -1, 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -1, 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Picks the right hazard art for this obstacle.
  function drawObstacle(kind, x, y, warn) {
    if (kind === 'urchin') drawSeaUrchin(x, y, warn);
    else if (kind === 'jelly') drawJellyfish(x, y, warn);
    else drawSpikyShell(x, y, warn);
  }

  function drawSpikyShell(x, y, warn) {
    ctx.save(); ctx.translate(x, y);
    drawHazardShimmer(warn);
    ctx.rotate(Math.sin(elapsed * 3) * 0.2);

    ctx.fillStyle = '#8B0000'; ctx.beginPath();
    ctx.moveTo(-5, -5); ctx.lineTo(-10, -20); ctx.lineTo(0, -10);
    ctx.moveTo(5, -5); ctx.lineTo(5, -25); ctx.lineTo(15, -8);
    ctx.moveTo(15, -2); ctx.lineTo(25, -15); ctx.lineTo(20, 5);
    ctx.moveTo(0, 5); ctx.lineTo(-5, 20); ctx.lineTo(10, 8);
    ctx.moveTo(15, 5); ctx.lineTo(18, 22); ctx.lineTo(25, 5); ctx.fill();
    ctx.fillStyle = '#FFA07A'; ctx.beginPath(); ctx.moveTo(25, 0); ctx.bezierCurveTo(25, 15, -10, 15, -25, 0); ctx.bezierCurveTo(-10, -15, 25, -15, 25, 0); ctx.fill();
    ctx.fillStyle = '#FFC0CB'; ctx.beginPath(); ctx.ellipse(20, 0, 6, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#CD5C5C'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(5, -12); ctx.quadraticCurveTo(-5, 0, 5, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(15, -10); ctx.quadraticCurveTo(5, 0, 15, 10); ctx.stroke();
    ctx.restore();
  }

  // Draws the dolphin + kitty unicorn rider at a given spot. Taking x/y as
  // arguments means the start screen can show the hero somewhere else
  // without secretly moving the real player.
  function drawHero(x, y, dy, inWater) {
    ctx.save();
    ctx.translate(x, y);
    let tilt = dy * TILT_PER_SPEED;
    if (!inWater) tilt *= 0.5; // gentler tip while airborne
    tilt = Math.max(-MAX_TILT, Math.min(MAX_TILT, tilt));
    ctx.rotate(tilt);
    let animCycle = Math.sin(elapsed * 12);

    let dolGrad = ctx.createLinearGradient(-60, 0, 70, 0);
    dolGrad.addColorStop(0, '#0099DD'); dolGrad.addColorStop(1, '#44CCFF');
    ctx.fillStyle = dolGrad;

    let tailY = 20 + animCycle * 10;
    ctx.beginPath(); ctx.moveTo(-40, 20); ctx.quadraticCurveTo(-60, tailY - 25, -70, tailY - 15); ctx.quadraticCurveTo(-55, tailY, -70, tailY + 15); ctx.quadraticCurveTo(-60, tailY + 25, -40, 20); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5, 22, 50, 22, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(45, 12, 15, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(60, 24, 18, 7, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0099DD'; ctx.beginPath(); ctx.moveTo(0, 5); ctx.quadraticCurveTo(-5, -20, -15, -20); ctx.quadraticCurveTo(-15, -5, -25, 10); ctx.fill();

    let flipRot = Math.sin(elapsed * 12) * 0.2;
    ctx.save(); ctx.translate(15, 35); ctx.rotate(flipRot); ctx.beginPath(); ctx.ellipse(-5, 10, 8, 15, -Math.PI/4, 0, Math.PI*2); ctx.fill(); ctx.restore();

    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(42, 14, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(44, 14, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#005588'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(45, 25); ctx.quadraticCurveTo(60, 28, 70, 24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(45, 25); ctx.lineTo(42, 22); ctx.stroke();

    // --- THE RIDER ---
    // Vivian's redesign: a lavender chibi kitten with a rainbow mane, a flower
    // crown, a rainbow horn, closed happy eyes and a paw that waves.
    // Drawn at 0.7 so the whole hero keeps the footprint it had before.
    //
    // The DOLPHIN above is deliberately untouched. Every attempt to redraw it
    // came out worse than this one -- it went "closer", then "looks like a
    // shark", then "worse". It already has what matters: a long snout, a
    // rounded body, a friendly eye and a big smile. Leave it alone.
    ctx.translate(5, 2);
    ctx.scale(0.7, 0.7);

    const OUTLINE = '#4A4670';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // Rainbow mane, sweeping back behind her and drifting as she swims.
    const maneSway = Math.sin(elapsed * 3) * 3;
    ctx.lineWidth = 12;
    [['#FF6B6B', -58], ['#FFA94D', -66], ['#FFD93D', -70]].forEach((band, i) => {
      ctx.strokeStyle = band[0];
      ctx.beginPath();
      ctx.moveTo(-18 + i * 7, band[1]);
      ctx.quadraticCurveTo(-50 + i * 9, -48 + i * 6 + maneSway,
                           -58 + i * 11, -18 + i * 6 + maneSway);
      ctx.stroke();
    });
    ctx.strokeStyle = OUTLINE;

    // Body, chest and front paws.
    ctx.lineWidth = 3; ctx.fillStyle = '#C9A5E8';
    ctx.beginPath(); ctx.ellipse(2, -6, 17, 15, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 2.4; ctx.fillStyle = '#FDFAFF';
    ctx.beginPath(); ctx.ellipse(6, -4, 9, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-4, 7, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(12, 8, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // The raised paw actually waves.
    ctx.save();
    ctx.translate(16, -22);
    ctx.rotate(Math.sin(elapsed * 5) * 0.25);
    ctx.strokeStyle = '#C9A5E8'; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -10, 22, -22); ctx.stroke();
    ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -10, 22, -22); ctx.stroke();
    ctx.fillStyle = '#FDFAFF';
    ctx.beginPath(); ctx.arc(25, -28, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#F5A3BE';
    ctx.beginPath(); ctx.ellipse(25, -31, 3.2, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    [[21, -26], [25, -24.5], [29, -26]].forEach(pad => {
      ctx.beginPath(); ctx.arc(pad[0], pad[1], 1.8, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    // Ears.
    ctx.lineWidth = 3; ctx.fillStyle = '#C9A5E8';
    ctx.beginPath(); ctx.moveTo(-30, -66);
    ctx.quadraticCurveTo(-38, -94, -32, -97);
    ctx.quadraticCurveTo(-19, -86, -9, -80); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30, -66);
    ctx.quadraticCurveTo(38, -94, 32, -97);
    ctx.quadraticCurveTo(19, -86, 9, -80); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#F5A3BE';
    ctx.beginPath(); ctx.moveTo(-28, -68);
    ctx.quadraticCurveTo(-33, -88, -31, -90);
    ctx.quadraticCurveTo(-21, -82, -13, -78); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(28, -68);
    ctx.quadraticCurveTo(33, -88, 31, -90);
    ctx.quadraticCurveTo(21, -82, 13, -78); ctx.closePath(); ctx.fill();

    // Rainbow horn, built from stacked slices of a cone.
    ctx.lineWidth = 2.2;
    [['#B980F0', -86, -95, 7, 5.6], ['#5BA9F0', -95, -104, 5.6, 4.2],
     ['#6BCB77', -104, -113, 4.2, 2.8]].forEach(sl => {
      ctx.fillStyle = sl[0];
      ctx.beginPath();
      ctx.moveTo(-sl[3], sl[1]); ctx.lineTo(sl[3], sl[1]);
      ctx.lineTo(sl[4], sl[2]); ctx.lineTo(-sl[4], sl[2]);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    });
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath(); ctx.moveTo(-2.8, -113); ctx.lineTo(2.8, -113); ctx.lineTo(0, -126);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Head.
    ctx.lineWidth = 3; ctx.fillStyle = '#C9A5E8';
    ctx.beginPath(); ctx.arc(0, -50, 34, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // Flower crown.
    [[-22, -74, '#FF9ECD'], [22, -72, '#FFE066']].forEach(f => {
      ctx.lineWidth = 2; ctx.fillStyle = f[2];
      [[0, -4], [3.8, -1.3], [2.4, 3.3], [-2.4, 3.3], [-3.8, -1.3]].forEach(petal => {
        ctx.beginPath();
        ctx.arc(f[0] + petal[0], f[1] + petal[1], 3.3, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      });
      ctx.fillStyle = '#FFE066';
      ctx.beginPath(); ctx.arc(f[0], f[1], 2.3, 0, Math.PI * 2); ctx.fill();
    });

    // Closed happy eyes. Two upward arcs read as a delighted cat; solid dark
    // almond shapes read as a sleeping one.
    ctx.strokeStyle = OUTLINE; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.moveTo(-21, -56); ctx.quadraticCurveTo(-13, -67, -5, -56); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, -56); ctx.quadraticCurveTo(13, -67, 21, -56); ctx.stroke();

    // Blush.
    ctx.globalAlpha = 0.8; ctx.fillStyle = '#F5A3BE';
    ctx.beginPath(); ctx.ellipse(-25, -42, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(25, -42, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // Muzzle, nose, open smile and tongue.
    ctx.fillStyle = '#FDFAFF';
    ctx.beginPath(); ctx.ellipse(-8, -36, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, -36, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#E8709B';
    ctx.beginPath(); ctx.moveTo(-3, -42); ctx.lineTo(3, -42); ctx.lineTo(0, -38.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7A4A6A'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(-11, -38);
    ctx.quadraticCurveTo(0, -41, 11, -38);
    ctx.quadraticCurveTo(10, -22, 0, -22);
    ctx.quadraticCurveTo(-10, -22, -11, -38);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FF8FB8';
    ctx.beginPath(); ctx.moveTo(-5, -27); ctx.quadraticCurveTo(0, -21, 5, -27);
    ctx.quadraticCurveTo(0, -24, -5, -27); ctx.closePath(); ctx.fill();
    ctx.restore();

    // TODO: customization shop — swap the pink/blue colours above for the
    // outfit and dolphin colours the player has bought.
  }

  // Bubble weed: a curving stem studded with beads. The beads are placed by
  // walking the SAME curve the stem is drawn from, so they always sit on it.
  function drawBubbleWeed(sway, h) {
    ctx.strokeStyle = '#1B5E45'; ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(sway * 0.4, -h * 0.55, sway, -h);
    ctx.stroke();

    ctx.fillStyle = '#2A7D5C';
    for (let t = 0.16; t <= 1.001; t += 0.17) {
      const mt = 1 - t;
      const bx = 2 * mt * t * (sway * 0.4) + t * t * sway;
      const by = 2 * mt * t * (-h * 0.55) + t * t * (-h);
      ctx.beginPath(); ctx.arc(bx, by, 6 - t * 2, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Leafy clump: a short stem with rounded leaves fanning off the top half.
  function drawLeafyClump(sway, h) {
    ctx.strokeStyle = '#1B5E45'; ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(sway * 0.4, -h * 0.6, sway, -h);
    ctx.stroke();

    ctx.fillStyle = '#2A7D5C';
    // [how far up the stem, sideways offset, tilt]
    const leaves = [[0.52, -12, -0.5], [0.60, 12, 0.45], [0.76, -10, -0.35],
                    [0.84, 10, 0.4], [0.96, 0, -0.05]];
    leaves.forEach(leaf => {
      const t = leaf[0], mt = 1 - t;
      const bx = 2 * mt * t * (sway * 0.4) + t * t * sway + leaf[1];
      const by = 2 * mt * t * (-h * 0.6) + t * t * (-h);
      ctx.save(); ctx.translate(bx, by); ctx.rotate(leaf[2]);
      ctx.beginPath(); ctx.ellipse(0, 0, 11, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  function drawSeaweed() {
    const rootY = viewH - FLOOR_HEIGHT + 6;
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.lineCap = 'round';
    seaweed.forEach(p => {
      if (p.x < -70 || p.x > viewW + 70) return;
      const sway = Math.sin(elapsed * 1.4 + p.phase) * 9;
      ctx.save(); ctx.translate(p.x, rootY);
      if (p.kind === 'bubble') drawBubbleWeed(sway, p.height);
      else drawLeafyClump(sway, p.height);
      ctx.restore();
    });
    ctx.restore();
  }

  // Draws one of the game's own sprites at a given spot and size. Using the
  // real drawing functions means this legend can never drift out of sync with
  // how things actually look in the game.
  function drawLegendIcon(fn, x, y, scale, warn) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    fn(0, 0, warn);
    ctx.restore();
  }

  function drawHowToPage() {
    const L = howToLayout();
    const P = howToSlots(L.wide);
    const y = n => L.top + n * L.s;            // natural units -> screen y
    const x = n => L.cx + n * L.s;             // natural units -> screen x
    const f = n => `${n * L.s}px Arial`;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.textAlign = 'center';

    ctx.fillStyle = '#FFD700'; ctx.font = 'bold ' + f(26);
    ctx.fillText('HOW TO PLAY', x(P.titleX), y(P.titleY));

    // --- the physics: the one thing you can't work out by looking ---
    ctx.fillStyle = 'white'; ctx.font = 'bold ' + f(17);
    ctx.fillText('Hold to swim up. Let go to sink.', x(P.physX), y(P.p1));
    ctx.fillStyle = '#9FE8FF'; ctx.font = f(15);
    ctx.fillText("Dolphins can't fly — they JUMP!", x(P.physX), y(P.p2));
    ctx.fillText('Leap out of the water for sky treats.', x(P.physX), y(P.p3));

    // --- what's worth what. Values are printed from the constants, so the
    // --- legend can't end up lying about the score.
    ctx.fillStyle = '#7CFFB2'; ctx.font = 'bold ' + f(15);
    ctx.fillText('COLLECT THESE', x(P.goodX), y(P.goodY));

    const gx = [-126, -42, 42, 126].map(d => x(P.goodX + d));
    drawLegendIcon(drawGem,     gx[0], y(P.iconsY), 1.0 * L.s);
    drawLegendIcon(drawDonut,   gx[1], y(P.iconsY), 1.0 * L.s);
    drawLegendIcon(drawRainbow, gx[2], y(P.iconsY), 0.62 * L.s);
    drawLegendIcon(drawHeart,   gx[3], y(P.iconsY - 2), 1.0 * L.s);

    ctx.fillStyle = 'white'; ctx.font = 'bold ' + f(14);
    ctx.fillText(GEM_VALUE,     gx[0], y(P.valuesY));
    ctx.fillText(DONUT_VALUE,   gx[1], y(P.valuesY));
    ctx.fillText(RAINBOW_VALUE, gx[2], y(P.valuesY));
    ctx.font = 'bold ' + f(12.5);
    ctx.fillText('+1 life',     gx[3], y(P.valuesY));

    // --- what hurts. Drawn mid-warning so the red glow is learnt right here
    // --- rather than the first time it costs you a life.
    ctx.fillStyle = '#FF8A80'; ctx.font = 'bold ' + f(15);
    ctx.fillText('DODGE THESE', x(P.badX), y(P.badY));

    const bx = [-100, 0, 100].map(d => x(P.badX + d));
    drawLegendIcon(drawSpikyShell, bx[0], y(P.hazY), 0.85 * L.s, 0.55);
    drawLegendIcon(drawSeaUrchin,  bx[1], y(P.hazY), 0.85 * L.s, 0.55);
    drawLegendIcon(drawJellyfish,  bx[2], y(P.hazY - 6), 0.85 * L.s, 0.55);

    ctx.fillStyle = '#FF8A80'; ctx.font = f(12.5);
    ctx.fillText('They flash red before they reach you.', x(P.badX), y(P.w1));
    ctx.fillText('Each one costs a life. You start with ' + START_LIVES + '.', x(P.badX), y(P.w2));

    // --- back ---
    const b = howToBackRect();
    const hovered = pointInRect(pointerX, pointerY, b);
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, b.h / 2);
    ctx.fillStyle = hovered ? '#7FD4FF' : '#4FB8EE';
    ctx.fill();
    ctx.strokeStyle = 'white'; ctx.lineWidth = 3 * L.s; ctx.stroke();

    ctx.fillStyle = '#05304A'; ctx.font = 'bold ' + f(19);
    ctx.textBaseline = 'middle';
    ctx.fillText('Back', L.cx, b.y + b.h / 2);
    ctx.textBaseline = 'alphabetic';

    ctx.textAlign = 'left';
  }

  // Shared pill-button drawing, so every button in the game looks the same.
  function drawPill(r, label, fill, fillHover, textColor, fontPx) {
    const hovered = pointInRect(pointerX, pointerY, r);
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, r.h / 2);
    ctx.fillStyle = hovered ? fillHover : fill;
    ctx.fill();
    ctx.strokeStyle = 'white'; ctx.lineWidth = Math.max(2, r.h * 0.06); ctx.stroke();
    ctx.fillStyle = textColor;
    ctx.font = `bold ${fontPx}px Arial`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2);
    ctx.textBaseline = 'alphabetic';
  }

  function drawEnterInitials() {
    const L = initialsLayout();
    const y = n => L.top + n * L.s;
    const f = n => `${n * L.s}px Arial`;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.textAlign = 'center';

    ctx.fillStyle = '#FFD700'; ctx.font = 'bold ' + f(30);
    ctx.fillText('NEW HIGH SCORE!', L.cx, y(40));
    ctx.fillStyle = 'white'; ctx.font = 'bold ' + f(22);
    ctx.fillText(pendingScore, L.cx, y(78));
    ctx.fillStyle = '#9FE8FF'; ctx.font = f(14);
    ctx.fillText('Put your initials on the board', L.cx, y(110));

    for (let i = 0; i < 3; i++) {
      const slot = initialsSlotRect(i);
      const active = i === initialsSlot;

      // chevrons
      ctx.fillStyle = active ? '#FFD700' : 'rgba(255,255,255,0.55)';
      [true, false].forEach(up => {
        const c = initialsChevronRect(i, up);
        const midX = c.x + c.w / 2, midY = c.y + c.h / 2, s2 = 10 * L.s;
        ctx.beginPath();
        if (up) { ctx.moveTo(midX, midY - s2); ctx.lineTo(midX + s2, midY + s2); ctx.lineTo(midX - s2, midY + s2); }
        else    { ctx.moveTo(midX, midY + s2); ctx.lineTo(midX + s2, midY - s2); ctx.lineTo(midX - s2, midY - s2); }
        ctx.closePath(); ctx.fill();
      });

      ctx.beginPath(); ctx.roundRect(slot.x, slot.y, slot.w, slot.h, 10 * L.s);
      ctx.fillStyle = active ? 'rgba(255,215,0,0.18)' : 'rgba(255,255,255,0.10)';
      ctx.fill();
      ctx.strokeStyle = active ? '#FFD700' : 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 3 * L.s; ctx.stroke();

      ctx.fillStyle = 'white'; ctx.font = 'bold ' + f(44);
      ctx.textBaseline = 'middle';
      ctx.fillText(initials[i], slot.x + slot.w / 2, slot.y + slot.h / 2);
      ctx.textBaseline = 'alphabetic';
    }

    const saveLabel = submitStatus === 'sending' ? 'Saving...' :
                      submitStatus === 'error'   ? 'Try again' : 'Save';
    drawPill(initialsSaveRect(), saveLabel, '#4FB8EE', '#7FD4FF', '#05304A', 20 * L.s);
    drawPill(initialsSkipRect(), 'Skip', 'rgba(255,255,255,0.12)',
             'rgba(255,255,255,0.24)', 'white', 15 * L.s);

    if (submitStatus === 'error') {
      ctx.fillStyle = '#FF8A80'; ctx.font = f(12.5);
      ctx.fillText("Couldn't reach the scoreboard.", L.cx, initialsSaveRect().y - 14 * L.s);
    }
    ctx.textAlign = 'left';
  }

  function drawLeaderboard() {
    const L = boardLayout();
    const y = n => L.top + n * L.s;
    const f = n => `${n * L.s}px Arial`;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.84)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.textAlign = 'center';

    ctx.fillStyle = '#FFD700'; ctx.font = 'bold ' + f(26);
    ctx.fillText('HIGH SCORES', L.cx, y(30));

    const labels = ['ALL TIME', 'THIS MONTH', 'THIS WEEK'];
    const keys = ['all', 'month', 'week'];
    for (let i = 0; i < 3; i++) {
      const r = boardTabRect(i);
      const on = keys[i] === boardTab;
      ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 8 * L.s);
      ctx.fillStyle = on ? '#FFD700' : 'rgba(255,255,255,0.12)';
      ctx.fill();
      ctx.fillStyle = on ? '#2a2000' : 'white';
      ctx.font = 'bold ' + f(12);
      ctx.textBaseline = 'middle';
      ctx.fillText(labels[i], r.x + r.w / 2, r.y + r.h / 2);
      ctx.textBaseline = 'alphabetic';
    }

    const rows = board[boardTab];
    // Anchor the list to the ACTUAL tab rect, so flooring the tab height for
    // touch can't push the tabs down into the first row.
    const tabs = boardTabRect(0);
    const listY = tabs.y + tabs.h + 30 * L.s;
    const rowStep = 32 * L.s;

    if (boardStatus === 'loading' && !rows) {
      ctx.fillStyle = 'white'; ctx.font = f(15);
      ctx.fillText('Loading...', L.cx, listY + 30 * L.s);
    } else if (rows === null || rows === undefined) {
      ctx.fillStyle = '#FF8A80'; ctx.font = 'bold ' + f(15);
      ctx.fillText("Can't reach the scoreboard", L.cx, listY + 20 * L.s);
      ctx.fillStyle = '#FF8A80'; ctx.font = f(12.5);
      ctx.fillText('You can still play — tap Back.', L.cx, listY + 44 * L.s);
    } else if (rows.length === 0) {
      ctx.fillStyle = '#9FE8FF'; ctx.font = 'bold ' + f(15);
      ctx.fillText('No scores yet!', L.cx, listY + 20 * L.s);
      ctx.fillStyle = '#9FE8FF'; ctx.font = f(12.5);
      ctx.fillText('Be the first one on the board.', L.cx, listY + 44 * L.s);
    } else {
      ctx.textAlign = 'left';
      const left = L.cx - 140 * L.s;
      for (let i = 0; i < rows.length; i++) {
        const ry = listY + i * rowStep;
        if (i % 2 === 0) {
          ctx.fillStyle = 'rgba(255,255,255,0.06)';
          ctx.fillRect(left - 10 * L.s, ry - 20 * L.s, 300 * L.s, 28 * L.s);
        }
        ctx.fillStyle = i === 0 ? '#FFD700' : 'rgba(255,255,255,0.6)';
        ctx.font = 'bold ' + f(15);
        ctx.fillText((i + 1) + '.', left, ry);

        ctx.fillStyle = i === 0 ? '#FFD700' : 'white';
        ctx.font = 'bold ' + f(19);
        ctx.fillText(rows[i].initials, left + 42 * L.s, ry);

        ctx.textAlign = 'right';
        ctx.fillText(rows[i].score, left + 280 * L.s, ry);
        ctx.textAlign = 'left';
      }
      ctx.textAlign = 'center';
    }

    drawPill(boardBackRect(), 'Back', '#4FB8EE', '#7FD4FF', '#05304A', 19 * L.s);
    ctx.textAlign = 'left';
  }

  function draw() {
    const waterLine = waterLineY();

    // SKY
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, viewW, viewH);

    // CLOUDS
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    clouds.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.size, 0, Math.PI*2);
      ctx.arc(c.x + c.size * 0.8, c.y - c.size * 0.3, c.size * 0.8, 0, Math.PI*2);
      ctx.arc(c.x + c.size * 1.6, c.y, c.size * 0.9, 0, Math.PI*2);
      ctx.fill();
    });

    // SANDY FLOOR — scrolls at the same speed as the gems so the world
    // feels like one solid place.
    ctx.fillStyle = '#EEDD82';
    ctx.fillRect(0, viewH - FLOOR_HEIGHT, viewW, FLOOR_HEIGHT);

    ctx.font = '25px Arial';
    for (let i = 0; i <= viewW + 200; i += 200) {
      let scrollX = Math.round(i - (elapsed * SCROLL_SPEED) % 200);
      ctx.fillText('🦪', scrollX, viewH - 25);
      ctx.fillText('⭐', scrollX + 100, viewH - 10);
    }

    // SEAWEED — drawn here so it sits behind the dolphin and the treasures,
    // and gets tinted by the translucent water drawn later on.
    drawSeaweed();

    // HERO (drawn before the water so the translucent water tints it when
    // the dolphin is submerged — that's what makes diving look right)
    if (gameState === 'PLAYING') {
      drawHero(player.x, player.y, player.dy, player.y >= waterLine);
    } else if (gameState === 'START') {
      // Deliberately NOT drawn on the how-to page: she bobs at the centre of
      // the screen, which is exactly where the icon legend sits.
      let bobY = waterLine + Math.sin(elapsed * 3) * 10;
      // The bob's actual up/down speed, so the idle tilt matches the motion.
      drawHero(viewW / 2, bobY, Math.cos(elapsed * 3) * 30, true);
    }

    // WATER
    // Trace the wavy surface left to right, then close the shape down the
    // right edge and back along the bottom.
    ctx.fillStyle = 'rgba(30, 144, 255, 0.45)';
    ctx.beginPath();
    ctx.moveTo(0, viewH);
    for (let w = 0; w <= viewW; w += 20) {
      ctx.lineTo(w, waterLine + surfaceWaveAt(w));
    }
    // The loop steps in 20px jumps, so on a screen whose width isn't a
    // multiple of 20 (a 375px phone stops at 360) it never reaches the right
    // edge, and the shape closed diagonally to the corner — leaving a wedge
    // of missing water. Pin the final point to the exact right edge.
    ctx.lineTo(viewW, waterLine + surfaceWaveAt(viewW));
    ctx.lineTo(viewW, viewH);
    ctx.fill();

    ctx.strokeStyle = 'rgba(135, 206, 235, 0.6)';
    ctx.lineWidth = 4;
    ctx.stroke();

    // SPLASHES
    splashes.forEach(p => {
      ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });

    // ITEMS & OBSTACLES
    if (gameState === 'PLAYING') {
      items.forEach(item => {
        if (item.itemType === 'rainbow') drawRainbow(Math.round(item.x), Math.round(item.y));
        else if (item.itemType === 'donut') drawDonut(Math.round(item.x), Math.round(item.y));
        else if (item.itemType === 'heart') drawHeart(Math.round(item.x), Math.round(item.y));
        else drawGem(Math.round(item.x), Math.round(item.y));
      });

      obstacles.forEach(obs => {
        // Shimmer fades in as the shell closes the gap to the dolphin, then
        // fades out quickly once it's safely behind — otherwise the glow
        // would pop off the instant the shell slipped past.
        const gap = obs.x - player.x;
        const warn = gap >= 0
          ? Math.max(0, 1 - gap / SHELL_WARN_DISTANCE)
          : Math.max(0, 1 + gap / 120);
        drawObstacle(obs.kind, Math.round(obs.x), Math.round(obs.y), warn);
      });
    }

    // --- UI RENDERING (RESPONSIVE) ---
    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
      let hudFont = Math.max(16, Math.min(30, viewW * 0.04));
      ctx.fillStyle = 'black';
      ctx.font = `bold ${hudFont}px Arial`;
      ctx.fillText('Money (Gems & Donuts): ' + score, 20, 40 + hudFont);
      ctx.fillText('Lives: ' + '❤️'.repeat(Math.max(0, lives)), 20, 50 + hudFont * 2.2);
    }

    // --- START SCREEN (RESPONSIVE) ---
    if (gameState === 'START') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, viewW, viewH);

      ctx.textAlign = 'center';

      let titleFont = Math.min(60, viewW * 0.06);
      let creditFont = Math.max(12, Math.min(24, viewW * 0.035));
      let promptFont = Math.max(14, Math.min(30, viewW * 0.045));

      // Each line is placed relative to the one above it. The old version
      // measured title and credits from the screen centre independently, so on
      // a narrow phone (where the title shrinks but the credit doesn't) they
      // collided.
      const titleY = viewH / 2 - titleFont * 2.4;
      ctx.fillStyle = '#FF69B4';
      ctx.font = `bold ${titleFont}px Arial`;
      ctx.fillText('Kitty Unicorn Dolphin Rider', viewW / 2, titleY);

      ctx.fillStyle = 'white';
      ctx.font = `${creditFont}px Arial`;
      const creditY = titleY + titleFont * 0.85 + creditFont * 1.1;
      ctx.fillText('Designed and built by 7 year old Vivian,', viewW / 2, creditY);
      ctx.fillText('with some help from AI.', viewW / 2, creditY + creditFont * 1.5);

      // --- HOW TO PLAY + HIGH SCORES buttons ---
      const sb = startButtonRects();
      const btnFont = Math.min(17, sb.howTo.h * 0.34);
      drawPill(sb.howTo, 'How to play', 'rgba(255,255,255,0.14)',
               'rgba(255,255,255,0.28)', 'white', btnFont);
      drawPill(sb.board, 'High scores', 'rgba(255,255,255,0.14)',
               'rgba(255,255,255,0.28)', 'white', btnFont);
      const hb = sb.howTo;

      // The prompt sits below the button, measured FROM it, so the two can
      // never overlap on an awkward screen size.
      ctx.fillStyle = '#FFD700';
      ctx.font = `bold ${promptFont}px Arial`;
      ctx.globalAlpha = 0.5 + Math.abs(Math.sin(elapsed * 3)) * 0.5;
      ctx.fillText('Click or press Enter to Start!', viewW / 2, hb.y + hb.h + promptFont * 2.0);
      ctx.globalAlpha = 1.0;

      ctx.textAlign = 'left';
    }

    // --- GAME OVER SCREEN (RESPONSIVE) ---
    if (gameState === 'GAMEOVER') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, viewW, viewH);

      ctx.textAlign = 'center';

      let goFont = Math.min(80, viewW * 0.12);
      let scoreFont = Math.min(40, viewW * 0.07);
      let retryFont = Math.max(14, Math.min(30, viewW * 0.045));

      ctx.fillStyle = 'white';
      ctx.font = `bold ${goFont}px Arial`;
      ctx.fillText('GAME OVER', viewW / 2, viewH / 2 - goFont * 0.5);

      ctx.font = `bold ${scoreFont}px Arial`;
      ctx.fillStyle = '#FFD700';
      ctx.fillText('Final Score: ' + score, viewW / 2, viewH / 2 + scoreFont * 1.2);

      // --- TRY AGAIN BUTTON ---
      // A real target you have to aim at, so you can read your score first.
      const btn = gameOverButtonRect();
      const hovered = pointInRect(pointerX, pointerY, btn);
      const radius = btn.h / 2;

      // Gentle breathing glow so it's obviously the thing to press.
      const glow = 0.5 + Math.abs(Math.sin(elapsed * 3)) * 0.5;
      ctx.save();
      ctx.shadowColor = `rgba(255, 215, 0, ${glow * 0.9})`;
      ctx.shadowBlur = hovered ? 34 : 20;

      ctx.beginPath();
      ctx.roundRect(btn.x, btn.y, btn.w, btn.h, radius);
      const btnGrad = ctx.createLinearGradient(0, btn.y, 0, btn.y + btn.h);
      btnGrad.addColorStop(0, hovered ? '#FF9AD5' : '#FF69B4');
      btnGrad.addColorStop(1, hovered ? '#FF69B4' : '#E0489A');
      ctx.fillStyle = btnGrad;
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.roundRect(btn.x, btn.y, btn.w, btn.h, radius);
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = 'white';
      ctx.font = `bold ${Math.min(34, btn.h * 0.44)}px Arial`;
      ctx.textBaseline = 'middle';
      ctx.fillText('Try Again', viewW / 2, btn.y + btn.h / 2);
      ctx.textBaseline = 'alphabetic';

      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.font = `${Math.max(12, retryFont * 0.62)}px Arial`;
      ctx.fillText('(or press Enter)', viewW / 2, btn.y + btn.h + retryFont * 1.3);

      ctx.textAlign = 'left';
    }

    if (gameState === 'HOWTO') drawHowToPage();
    if (gameState === 'ENTER_INITIALS') drawEnterInitials();
    if (gameState === 'LEADERBOARD') drawLeaderboard();

    // TODO: shop screen — a 'SHOP' gameState drawn here, spending `score`.
  }

  // =====================================================================
  // MAIN LOOP
  // =====================================================================

  let lastTime = 0;

  function loop(now) {
    // requestAnimationFrame hands us a timestamp in milliseconds. The gap
    // since the last frame ("dt", in seconds) is what every movement gets
    // multiplied by, so the game runs at the same speed on every device.
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > MAX_DT) dt = MAX_DT;

    elapsed += dt;

    ctx.clearRect(0, 0, viewW, viewH);
    updateSeaweed(dt); // outside update() so it drifts on the start screen too
    if (gameState === 'PLAYING') spawn(dt);
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
  </script>
</body>
</html>
