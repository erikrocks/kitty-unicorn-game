<!DOCTYPE html>
<html>
<head>
  <!-- Without this, a server that does not send charset=utf-8 (anything
       but GitHub Pages, basically) mangles every emoji: the hearts in the
       lives counter render as "a ¤i". -->
  <meta charset="utf-8">
  <title>Kitty Unicorn Dolphin Rider</title>
  <!-- This meta tag prevents mobile browsers from zooming in when you tap! -->
  <!-- viewport-fit=cover: the ocean runs edge to edge, under the iPhone's notch
       / Dynamic Island. The HUD and pause button are kept clear of it using the
       safe-area insets (see readSafeArea). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Ride a dolphin, leap for rainbows, dodge the spiky things. A game designed by 7 year old Vivian.">

  <!-- Installable web app. No service worker: Chrome no longer requires one,
       and the game already works offline on its own. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0B2F52">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kitty Unicorn">
  <!-- "default" not "black-translucent": the top of the screen during play is
       pale sky blue, and a translucent bar draws its clock in white on top. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%88%3C/text%3E%3C/svg%3E">

  <meta property="og:title" content="Kitty Unicorn Dolphin Rider">
  <meta property="og:description" content="Ride a dolphin, leap for rainbows, dodge the spiky things. A game designed by 7 year old Vivian.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kudr.eriksheridan.com/">
  <meta property="og:image" content="https://kudr.eriksheridan.com/icon-512.png">
  <style>
    /* touch-action: none prevents the screen from scrolling when swiping/tapping */
    body { margin: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <!-- Invisible. Its padding is the phone's safe area (notch, Dynamic Island,
       rounded corners), which is the only way JavaScript can read env() values. -->
  <div id="safeArea" style="position: fixed; visibility: hidden; pointer-events: none;
       padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);"></div>
  <script>
  // =====================================================================
  // SETUP
  // =====================================================================

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Older browsers (iPadOS 15, Firefox before 112) have no ctx.roundRect, and
  // without it EVERY screen throws on its first button — the game is a blank
  // blue page. This stand-in builds the same shape from arcTo, which has been
  // supported everywhere for over a decade. Browsers that have the real one
  // keep it.
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      r = Math.max(0, Math.min(typeof r === 'number' ? r : 0, w / 2, h / 2));
      this.moveTo(x + r, y);
      this.arcTo(x + w, y,     x + w, y + h, r);
      this.arcTo(x + w, y + h, x,     y + h, r);
      this.arcTo(x,     y + h, x,     y,     r);
      this.arcTo(x,     y,     x + w, y,     r);
      this.closePath();
    };
  }

  // --- TUNING VALUES ---------------------------------------------------
  // Every speed below is "per SECOND", not "per frame". That's what makes
  // the game feel the same on a slow phone and a fast 120Hz laptop.
  // (Tweak these numbers to change how the game feels.)

  // Dolphin movement
  // How far in from the left edge the dolphin sits. On a wide screen it's a
  // fixed 200px, but on a narrow phone that was over HALF the screen — you
  // couldn't see gems or shells arriving in time to react. So on small
  // screens it slides left to a quarter of the width instead.
  const PLAYER_X_MAX  = 200;
  const PLAYER_X_FRAC = 0.25;
  const PLAYER_X_MIN  = 90;  // any less and the dolphin's tail hangs off-screen
  const RISE_ACCEL  = 7920;  // how hard you're pushed UP while holding, in water
  const SINK_ACCEL  = 3600;  // how hard you sink when you let go, in water
  const AIR_GRAVITY = 1620;  // gravity while airborne (you can't steer mid-leap)
  const WATER_DRAG  = 0.92;  // fraction of speed kept each 1/60s in water
  const AIR_DRAG    = 0.98;  // ...and in the air
  const CEILING_Y   = 40;    // dolphin can't fly higher than this

  // How much the dolphin tips nose-up/nose-down as it moves. Speeds are in
  // pixels per SECOND (so they reach ~1000), hence the very small number.
  const TILT_PER_SPEED = 0.0005;
  const MAX_TILT       = 0.5; // ...but never tip further than this (~30°),
                              // so a fast dive can't turn into a somersault

  // World
  const SCROLL_SPEED   = 300; // px/sec that gems and the seafloor slide left
  const OBSTACLE_SPEED = 360; // shells come at you slightly faster

  // Shells shimmer once they're this close, giving a warning before they
  // arrive. At 360 px/sec that's about 1.7 seconds to react — enough time
  // for a young player to steer out of the way.
  const SHELL_WARN_DISTANCE = 600;

  // Most hazards are the spiky shell. Urchins and jellyfish turn up now and
  // then, so they stay a surprise rather than becoming the norm.
  const URCHIN_CHANCE = 0.12;
  const JELLY_CHANCE  = 0.12;

  // Each hazard gets a hit box matching its own shape, instead of one square
  // for all three. The jellyfish is a narrow dome with long trailing
  // tentacles, so a wide box would let it sting you through empty water at
  // its sides; `oy` shifts the box down to cover those tentacles.
  const OBSTACLE_HITBOX = {
    shell:  { hw: 45, hh: 45, oy: 0 },
    urchin: { hw: 36, hh: 36, oy: 0 },
    jelly:  { hw: 26, hh: 30, oy: 10 }
  };
  const FLOOR_HEIGHT   = 60;  // height of the sandy seafloor

  // Spawning (chances PER SECOND)
  const ITEM_SPAWN_RATE     = 1.2;
  const OBSTACLE_SPAWN_RATE = 0.36;
  const ITEM_MIN_Y          = 40; // highest anything spawns
  // Share of spawned items that are rainbows. Rarer than a heart (5%), so
  // you'll usually see about three in a game — but a long run can have more.
  const RAINBOW_CHANCE      = 0.03;
  // Donuts and hearts are the valuable ones, so they only appear in the SKY —
  // you have to leap out of the water to earn them. Gems (the cheap ones) can
  // show up anywhere, so diving is still worth something.
  const AIR_ITEM_MARGIN     = 45; // keeps sky items clear of the wavy surface
  // The rainbow sits in a big bubble, so it needs more room than the others
  // to stay fully on screen up top and clear of the waves down below.
  const RAINBOW_BUBBLE_R    = 30; // how big the bubble around the rainbow is
  const RAINBOW_MIN_Y       = 62;
  const RAINBOW_MARGIN      = 70;

  // Splash particles
  const SPLASH_GRAVITY = 1800;
  const SPLASH_FADE    = 1.8; // how fast a droplet fades out, per second

  // Feedback ("juice"): none of this changes the rules, it just lets you SEE
  // what happened. Before it, a 116-point rainbow simply vanished.
  const POPUP_LIFE     = 0.9;  // seconds a "+10" floats before it's gone
  const POPUP_RISE     = 70;   // how fast it floats up, per second
  const POPUP_LIFT     = 92;   // how far above the pickup it starts (clear of the kitten's horn)
  const SPARKLE_COUNT  = 10;   // little stars thrown out by each pickup
  const SPARKLE_SPEED  = 300;
  const SPARKLE_FADE   = 1.5;  // per second
  // After a bump the hero blinks and can't be hit again for a moment. Two
  // hazards close together used to take two hearts before you could react.
  const HURT_TIME      = 1.2;
  const HURT_FLASH     = 0.35; // how long the soft red edge glow lasts
  // Resuming from pause counts down first, so you're not dropped straight
  // back into the thing you paused to avoid.
  const RESUME_STEP    = 0.6;  // seconds each of "3", "2", "1" stays up
  // Restart throws the current run away, so it takes two taps: the first one
  // "arms" the button for this long, and only a second tap in that time restarts.
  const RESTART_CONFIRM = 3;
  const SCREEN_POP     = 0.3;  // seconds the game-over / pause panels take to pop in

  // --- DIFFICULTY RAMP --------------------------------------------------
  // Difficulty ramps on SCORE, not on time. Time-based punished a beginner
  // for surviving and let a strong player coast; scoring is what actually
  // measures how well you're doing, so good players get challenged sooner and
  // a struggling one gets a gentler ride. Everything ramps from 1x to the caps
  // below by DIFFICULTY_SCORE points, then PLATEAUS — it has to stay
  // winnable-feeling for a 7-year-old, so it gets faster, never impossible.
  //
  // At 2000 points: a beginner takes ~320s to get there, an expert with the
  // x2 bonus ~47s. (The old time ramp was a flat 150s for everyone.)
  //
  // Note the x2 bonus now cuts both ways — double points also means you reach
  // full difficulty twice as fast. That's deliberate.
  const DIFFICULTY_SCORE = 2000; // points to reach full difficulty
  const MAX_SPEED_MULT   = 1.7;  // everything scrolls up to 1.7x faster
  const MAX_HAZARD_MULT  = 2.0;  // twice as many hazards at full difficulty

  // --- HEART BONUS ------------------------------------------------------
  // Vivian's idea: hold six hearts and everything is worth double. Hearts are
  // rare (5% of items), so six is an achievement — and it gives you something
  // to protect just as the game starts speeding up.
  const DOUBLE_POINTS_AT = 6;
  const HEART_DISPLAY_MAX = 8;   // beyond this the HUD shows a count, not a row

  // Scoring
  const GEM_VALUE     = 10;
  const DONUT_VALUE   = 50;
  const RAINBOW_VALUE = 116;  // Vivian's pick — 16 is her lucky number
  const START_LIVES = 3;

  // --- LEADERBOARD ------------------------------------------------------
  // This publishable key is MEANT to be public. The table has Row Level
  // Security allowing only SELECT and INSERT, so the worst anyone can do with
  // it is add a score — it cannot be used to edit or delete the board, or to
  // reach anything else. (Verified: PATCH and DELETE match zero rows.)
  //
  // Scores are forgeable by anyone who opens devtools. That's unavoidable for
  // a browser game with no accounts, and fine for this one.
  const SUPABASE_URL = 'https://dsandoakgeceuzyhwxhg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_p7QhKoUFYdj1alM5Sx5hkQ_Q7JxR4gi';
  const LEADERBOARD_SIZE = 10;
  const NET_TIMEOUT_MS = 6000;

  // Three letters can spell things you'd rather not see on a child's game.
  // Not exhaustive and not a security boundary — just a decency filter.
  const BLOCKED_INITIALS = ['ASS','ARS','FUK','FCK','FUC','SHT','SHI','CUM',
    'TIT','DIK','DIC','COK','CNT','PIS','PSS','WTF','KKK','FAG','NIG','HOE',
    'SLT','ANL','SEX','JIZ','TWT'];

  // If the browser tab is hidden for a while, the next frame's time gap is
  // huge and would teleport the dolphin. Clamping it makes the game just
  // pick up smoothly instead.
  const MAX_DT = 0.05;

  // --- CANVAS SIZING (sharp on Retina / high-DPI screens) --------------
  // viewW/viewH are the size in CSS pixels — all game logic uses these.
  // The canvas itself is made bigger behind the scenes (times the device
  // pixel ratio) so the art is crisp instead of blurry, then we scale the
  // drawing context to match so we can keep thinking in normal pixels.
  let viewW = 0;
  let viewH = 0;
  // How big everything is drawn. Every screen shows the same amount of ocean:
  // GAME_HEIGHT game units from top to bottom (on a landscape screen). The
  // whole game — world, dolphin, text — is then zoomed to fit:
  //   - a phone held sideways (~360-440 tall) zooms DOWN to ~0.7-0.8. At 1:1
  //     everything was too big: "looks like you're swimming in a puddle".
  //   - an iPad (~744-1032 tall) zooms UP. At 1:1 it was a tiny dolphin in a
  //     huge ocean, with the pages floating small in the middle.
  // viewW/viewH are in these zoomed units, so the game code doesn't need to
  // know. Two exceptions: touch targets (realPx) and the full-screen pages
  // (pageMaxScale) must not shrink with it.
  const GAME_HEIGHT = 540;
  const ZOOM_MIN = 0.6;
  const ZOOM_MAX = 2;
  let zoom = 1;

  // A size in REAL screen pixels, converted to game units. Used for touch
  // target floors: a finger doesn't get smaller because the game zoomed out.
  function realPx(px) { return px / zoom; }
  // The how-to, high score and initials pages may grow up to this much, so
  // that zooming out on a phone doesn't shrink their text below what a
  // 7-year-old can read. (They never grow past what fits on screen.)
  function pageMaxScale() { return Math.max(1, 1 / zoom); }
  // The height those pages may use: the screen minus the strip at the bottom
  // where an iPhone's home bar lives. Their Back buttons sit at the very
  // bottom, and a button on the home bar is a button a kid swipes home with.
  function pageH() { return viewH - safeB; }

  // How much of each edge is covered by the notch / Dynamic Island / rounded
  // corners, in game units. Zero on most screens. Only the HUD and the pause
  // button need to stay clear of it; the ocean deliberately runs underneath.
  let safeL = 0, safeR = 0, safeT = 0, safeB = 0;
  function readSafeArea() {
    const el = document.getElementById('safeArea');
    if (!el) return;
    const cs = getComputedStyle(el);
    safeL = (parseFloat(cs.paddingLeft) || 0) / zoom;
    safeR = (parseFloat(cs.paddingRight) || 0) / zoom;
    safeT = (parseFloat(cs.paddingTop) || 0) / zoom;
    safeB = (parseFloat(cs.paddingBottom) || 0) / zoom;
  }
  // The safe area is re-read a couple of times a second, not only on resize.
  // It's cheap, and a wrapper app is free to change these numbers (rotating
  // between the two landscape directions, say) without a resize ever firing.
  let safeAreaAge = 0;
  function refreshSafeArea(dt) {
    safeAreaAge += dt;
    if (safeAreaAge < 0.5) return;
    safeAreaAge = 0;
    const before = safeL;
    readSafeArea();
    if (safeL !== before) player.x = playerHomeX();   // keep the dolphin clear of the notch too
  }

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const cssW = window.innerWidth, cssH = window.innerHeight;
    zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.min(cssW, cssH) / GAME_HEIGHT));
    viewW = cssW / zoom;
    viewH = cssH / zoom;

    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width  = cssW + 'px';
    canvas.style.height = cssH + 'px';

    // Changing canvas.width resets the context, so re-apply the scale here.
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, 0, 0);
    readSafeArea();
  }

  resizeCanvas();

  // The game is landscape only: held upright, a phone is too narrow to see
  // what's coming. The app versions lock the screen sideways; in a browser we
  // can't, so we show a "turn it sideways" screen instead (drawRotatePrompt).
  function isPortrait() { return viewH > viewW; }
  // A phone or tablet: no Enter key to press, and "click" is the wrong word.
  function isTouchDevice() { return 'ontouchstart' in window || navigator.maxTouchPoints > 0; }

  // Where the surface of the water sits.
  function waterLineY() {
    return viewH / 2 + 20;
  }

  // How far the wavy surface rises or falls at a given x, relative to the
  // flat waterline. Kept as one function so every bit of the surface is
  // drawn from the same formula.
  function surfaceWaveAt(x) {
    return Math.sin((x * 0.005) + (elapsed * 3)) * 15;
  }

  // The dolphin's home x position, worked out from the current screen width.
  // It's a function rather than a constant so rotating a phone recalculates it.
  function playerHomeX() {
    // + safeL so a notch on the left can't sit on top of the dolphin's tail.
    return safeL + Math.max(PLAYER_X_MIN, Math.min(PLAYER_X_MAX, viewW * PLAYER_X_FRAC));
  }

  // Where the "Try Again" button sits on the GAME OVER screen. Both the
  // drawing code and the click test call this, so they can never disagree
  // about where the button actually is.
  function gameOverButtonRect() {
    const scoreFont = Math.min(40, viewW * 0.07);
    const w = Math.max(200, Math.min(340, viewW * 0.5));
    const h = Math.max(realPx(56), Math.min(84, viewH * 0.09));
    return {
      x: viewW / 2 - w / 2,
      // Room for the personal-best line, but tightened on a short screen: a
      // sideways phone is only ~375px tall and the "(or press Enter)" hint
      // below the button was already falling off the bottom before this line
      // was added.
      y: viewH / 2 + scoreFont * 1.2 + (viewH < 520 ? 34 : 62),
      w: w,
      h: h
    };
  }

  // The how-to-play page is laid out in fixed "natural" units and then scaled
  // to fit the screen. A phone held sideways has plenty of width but almost no
  // height, so it switches to TWO COLUMNS there — shrinking a single column to
  // fit 375px of height drove the text down to ~9px, which a child can't read.
  function howToLayout() {
    // Two columns whenever the screen is wider than tall enough for them —
    // judged by shape, not by a fixed height, so it holds at any zoom.
    const wide = viewW >= viewH * 1.25;
    const natW = wide ? 660 : 330;
    const natH = wide ? 330 : 520;
    const scale = Math.min(pageMaxScale(), (pageH() - 30) / natH, (viewW - 30) / natW);
    return { wide: wide, s: scale, cx: viewW / 2, top: (pageH() - natH * scale) / 2 };
  }

  // Where everything sits, in natural units, for each of the two shapes.
  function howToSlots(wide) {
    return wide
      // Two columns: the bonus lines go under the physics text on the LEFT,
      // where there's room. Squeezing them above the button collided with the
      // hazard warnings.
      ? { titleX: -165, titleY: 30, physX: -165, p1: 88, p2: 122, p3: 148,
          goodX: 165, goodY: 30, iconsY: 74, valuesY: 114,
          badX: 165, badY: 156, hazY: 202, w1: 250, w2: 270,
          bonusX: -165, bonus1: 194, bonus2: 218, backY: 278 }
      : { titleX: 0, titleY: 26, physX: 0, p1: 74, p2: 102, p3: 126,
          goodX: 0, goodY: 170, iconsY: 212, valuesY: 250,
          badX: 0, badY: 292, hazY: 336, w1: 382, w2: 400,
          bonusX: 0, bonus1: 428, bonus2: 450, backY: 470 };
  }

  function howToBackRect() {
    const L = howToLayout();
    // Floored like every other button — unfloored it shrank to 40px on short screens.
    const w = Math.max(130, 150 * L.s), h = Math.max(realPx(48), 46 * L.s);
    return { x: L.cx - w / 2, y: L.top + howToSlots(L.wide).backY * L.s, w: w, h: h };
  }

  // Start screen now has two buttons side by side. Both are laid out from one
  // place so they can never overlap or drift apart.
  function startButtonRects() {
    const gap = 12;
    const total = Math.max(300, Math.min(420, viewW * 0.86));
    const w = (total - gap) / 2;
    const h = Math.max(realPx(48), Math.min(58, viewH * 0.062));
    const y = viewH / 2 + 24;
    return {
      howTo: { x: viewW / 2 - total / 2, y: y, w: w, h: h },
      board: { x: viewW / 2 - total / 2 + w + gap, y: y, w: w, h: h }
    };
  }

  // --- initials entry ---
  function initialsLayout() {
    const s = Math.min(pageMaxScale(), (pageH() - 40) / 420, (viewW - 30) / 320);
    return { s: s, cx: viewW / 2, top: (pageH() - 420 * s) / 2 };
  }
  function initialsSlotRect(i) {
    const L = initialsLayout();
    const w = 64 * L.s, h = 84 * L.s, gap = 16 * L.s;
    const total = w * 3 + gap * 2;
    return { x: L.cx - total / 2 + i * (w + gap), y: L.top + 150 * L.s, w: w, h: h };
  }
  function initialsChevronRect(i, up) {
    const slot = initialsSlotRect(i);
    const L = initialsLayout();
    const h = Math.max(realPx(44), 42 * L.s);   // floored at Apple's 44pt minimum: still tappable when scaled
    return { x: slot.x, y: up ? slot.y - h - 6 * L.s : slot.y + slot.h + 6 * L.s,
             w: slot.w, h: h };
  }

  // Save and Skip sit SIDE BY SIDE, not stacked. Stacked, two floored-height
  // buttons plus their gap overflowed the bottom of a landscape phone.
  function initialsButtonRow() {
    const L = initialsLayout();
    const h = Math.max(realPx(48), 52 * L.s);
    const saveW = Math.max(130, 170 * L.s);
    const skipW = Math.max(96, 120 * L.s);
    const gap = 14 * L.s;
    const total = saveW + gap + skipW;
    const y = L.top + 332 * L.s;
    return {
      save: { x: L.cx - total / 2, y: y, w: saveW, h: h },
      skip: { x: L.cx - total / 2 + saveW + gap, y: y, w: skipW, h: h }
    };
  }
  function initialsSaveRect() { return initialsButtonRow().save; }
  function initialsSkipRect() { return initialsButtonRow().skip; }

  // --- leaderboard ---
  function boardLayout() {
    const s = Math.min(pageMaxScale(), (pageH() - 30) / 520, (viewW - 24) / 340);
    return { s: s, cx: viewW / 2, top: (pageH() - 520 * s) / 2 };
  }
  function boardTabRect(i) {
    const L = boardLayout();
    const w = 104 * L.s, h = Math.max(realPx(44), 38 * L.s), gap = 6 * L.s;  // 44 = Apple's minimum touch size
    const total = w * 3 + gap * 2;
    return { x: L.cx - total / 2 + i * (w + gap), y: L.top + 58 * L.s, w: w, h: h };
  }
  function boardBackRect() {
    const L = boardLayout();
    const w = Math.max(130, 150 * L.s), h = Math.max(realPx(48), 46 * L.s);
    return { x: L.cx - w / 2, y: L.top + 462 * L.s, w: w, h: h };
  }

  // --- HUD (score + lives, top left) ---
  function hudFontSize() { return Math.max(16, Math.min(30, viewW * 0.04)); }
  function hudX() { return 20 + safeL; }   // clear of a notch on the left
  function hudLivesY() { return 50 + safeT + hudFontSize() * 2.2; }

  // --- pause ---
  // Top-right corner while playing. Floored at 48px like every other button:
  // it's a small icon, so it's the one most likely to shrink below a finger.
  function pauseButtonRect() {
    const s = Math.max(realPx(48), Math.min(60, viewW * 0.06));
    return { x: viewW - s - 14 - safeR, y: 14 + safeT, w: s, h: s };   // clear of a notch on the right
  }
  // The sound on/off button borrows the pause button's corner. It shows on the
  // start screen and the pause menu, where the pause button itself isn't drawn.
  function soundButtonRect() { return pauseButtonRect(); }
  // The menu: a title, then four stacked buttons, centred as one block so it
  // fits a sideways phone (~375px tall) as well as a desktop.
  function pauseMenuRects() {
    const w = Math.max(220, Math.min(320, viewW * 0.6));
    const h = Math.max(realPx(48), Math.min(64, viewH * 0.08));
    const gap = Math.max(10, h * 0.25);
    const titleH = h * 1.3;
    const top = (viewH - (titleH + h * 4 + gap * 3)) / 2;
    const x = viewW / 2 - w / 2;
    const row = i => ({ x: x, y: top + titleH + i * (h + gap), w: w, h: h });
    return { titleY: top + h * 0.85, resume: row(0), restart: row(1), howTo: row(2), board: row(3) };
  }

  function pointInRect(px, py, r) {
    return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  }

  // --- GAME STATE ------------------------------------------------------
  let isPressing = false;
  let score = 0;
  let lives = START_LIVES;
  let gameState = 'START';
  // True while a run is on hold: on the pause menu, OR on the how-to / high
  // score pages opened FROM the pause menu. It's what tells those pages to go
  // back to the paused run instead of the title screen, and what keeps the
  // world frozen while you're away.
  let runPaused = false;
  let elapsed = 0; // seconds since load — drives all the wobble animations
  // Difficulty eases toward its score-derived target rather than snapping to
  // it — a doubled rainbow is 232 points, which would jerk the whole world to
  // a new speed mid-jump.
  let difficultyNow = 0;
  // Total distance the world has slid left. The seafloor used to be placed
  // with `elapsed * SCROLL_SPEED`, which breaks the moment the speed can
  // change: multiplying ALL elapsed time by the CURRENT speed makes the floor
  // lurch. Accumulating the distance is the only correct way.
  let worldScroll = 0;
  let personalBest = 0;
  let beatBestThisRun = false;
  // Screens that pop up on their own (game over, and the initials screen a
  // moment later once the board replies) ignore input for a beat. A kid still
  // mashing the screen from the last run could otherwise hit Skip on a high
  // score before ever seeing it.
  const INPUT_GRACE = 0.6;   // seconds
  let screenShownAt = -99;
  function inGrace() { return elapsed - screenShownAt < INPUT_GRACE; }
  let doubleActive = false; // so the fanfare fires on CROSSING into the bonus,
                            // not on every frame you're sitting in it

  // --- leaderboard state ---
  // Per tab: undefined = loading, null = failed, array = loaded. One shared
  // status used to let a fast "this week" reply mark "all time" as loaded
  // while it was still in flight, so it wrongly said the board was down.
  const board = { all: undefined, month: undefined, week: undefined };
  const boardRequest = { all: 0, month: 0, week: 0 };
  let boardTab = 'all';
  let initials = ['A', 'A', 'A']; // replaced with the saved ones once loadSavedInitials exists
  let initialsSlot = 0;
  let pendingScore = 0;          // the score waiting to be saved
  let submitStatus = 'idle';     // idle | sending | done | error

  const player = { x: playerHomeX(), y: viewH / 2, dy: 0 };
  const items = [];
  const obstacles = [];
  const splashes = [];
  const popups = [];      // floating "+10" texts: { x, y, text, color, size, life }
  const sparkles = [];    // pickup stars: { x, y, dx, dy, life, color }
  let hurtLeft = 0;       // seconds of blink / can't-be-hit left after a bump
  let scoreShown = 0;     // what the HUD displays; it rolls up toward `score`
  let resumeCountdown = 0; // > 0 while "3, 2, 1" is showing after Resume
  let restartArmed = 0;    // > 0 while Restart is waiting for its confirming second tap
  let screenAge = 0;      // seconds since gameState last changed (for the pop-in)
  let screenWas = 'START';
  const clouds = [];

  for (let i = 0; i < 6; i++) {
    clouds.push({
      x: Math.random() * viewW,
      y: Math.random() * (viewH / 2 - 80) + 20,
      size: Math.random() * 25 + 30,
      speed: Math.random() * 30 + 12 // px/sec
    });
  }

  // --- SEAWEED (background scenery) ---
  const SEAWEED_COUNT = 12;
  const seaweed = [];

  function makeSeaweed(x) {
    return {
      x: x,
      kind: Math.random() < 0.5 ? 'bubble' : 'leafy',
      height: 55 + Math.random() * 75,
      phase: Math.random() * Math.PI * 2
    };
  }

  for (let i = 0; i < SEAWEED_COUNT; i++) {
    seaweed.push(makeSeaweed(Math.random() * (viewW + 300)));
  }

  // Seaweed is rooted in the sandy floor, so it has to scroll at exactly the
  // same speed. This lives outside update() on purpose: update() stops while
  // you're on the start screen, but the floor keeps sliding, and frozen weeds
  // growing out of moving sand would look broken.
  function updateSeaweed(dt) {
    for (let i = 0; i < seaweed.length; i++) {
      seaweed[i].x -= scrollSpeed() * dt;
      if (seaweed[i].x < -70) seaweed[i] = makeSeaweed(viewW + 70 + Math.random() * 140);
    }
  }

  // Handle window resizing (like rotating a phone) dynamically
  window.addEventListener('resize', () => {
    resizeCanvas();
    if (isPortrait()) pauseGame(); // turned upright mid-run: hold it, don't lose a life
    player.x = playerHomeX(); // re-centre for the new width (e.g. phone rotated)
    if (player.y > viewH - 80) player.y = viewH - 80;
  });

  // Calendar periods, not rolling windows — everyone's board resets together,
  // so there's a fresh start to race for. Week starts Monday.
  function periodStart(period) {
    const now = new Date();
    if (period === 'month') return new Date(now.getFullYear(), now.getMonth(), 1);
    if (period === 'week') {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // Monday = 0
      return d;
    }
    return null; // all time
  }

  // AbortSignal.timeout doesn't exist before Safari 16, and calling it threw
  // inside loadScores — so the leaderboard was silently dead on older iPads.
  function timeoutSignal(ms) {
    if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
      return AbortSignal.timeout(ms);
    }
    if (typeof AbortController === 'function') {
      const c = new AbortController();
      setTimeout(() => c.abort(), ms);
      return c.signal;
    }
    return undefined; // no way to time out; the fetch just takes as long as it takes
  }

  function supaHeaders() {
    return { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY,
             'Content-Type': 'application/json' };
  }

  // Every network call in this game returns null on ANY failure rather than
  // throwing. The game has to stay playable with no internet at all, so a
  // dead leaderboard must never be able to break a frame.
  async function loadScores(period) {
    try {
      let url = SUPABASE_URL + '/rest/v1/scores?select=initials,score' +
                '&order=score.desc&limit=' + LEADERBOARD_SIZE;
      const since = periodStart(period);
      if (since) url += '&created_at=gte.' + encodeURIComponent(since.toISOString());

      const res = await fetch(url, {
        headers: supaHeaders(),
        signal: timeoutSignal(NET_TIMEOUT_MS)
      });
      if (!res.ok) return null;
      const data = await res.json();
      // A 200 with a non-array body made qualifiesForBoard throw at every game
      // over. And never draw a row we don't understand: junk would render as
      // the literal text "null" on a child's scoreboard.
      if (!Array.isArray(data)) return null;
      return data.filter(r => r && typeof r.initials === 'string' &&
                              /^[A-Z]{3}$/.test(r.initials) &&
                              Number.isFinite(r.score) && r.score >= 0);
    } catch (e) {
      return null;
    }
  }

  async function submitScore(name, value) {
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/scores', {
        method: 'POST',
        headers: supaHeaders(),
        body: JSON.stringify({ initials: name, score: value }),
        signal: timeoutSignal(NET_TIMEOUT_MS)
      });
      return res.ok;
    } catch (e) {
      return false;
    }
  }

  function refreshBoard(period) {
    const id = ++boardRequest[period];
    board[period] = undefined;                        // loading
    loadScores(period).then(rows => {
      if (id !== boardRequest[period]) return;        // a newer request won
      board[period] = rows;                           // array, or null if it failed
    });
  }

  // Did this run earn a place? If we can't reach the server we say no, so the
  // player is never asked for initials we then fail to save.
  async function qualifiesForBoard(value) {
    if (value <= 0) return false;
    const rows = await loadScores('all');
    if (rows === null) return false;
    board.all = rows;
    if (rows.length < LEADERBOARD_SIZE) return true;
    return value > rows[rows.length - 1].score;
  }

  // 0 at the start of a run, 1 once it's as hard as it gets.
  function difficultyTarget() {
    return Math.min(1, score / DIFFICULTY_SCORE);
  }
  function difficulty() { return difficultyNow; }
  function speedMult()  { return 1 + (MAX_SPEED_MULT  - 1) * difficulty(); }
  function hazardMult() { return 1 + (MAX_HAZARD_MULT - 1) * difficulty(); }
  function scrollSpeed() { return SCROLL_SPEED * speedMult(); }

  // Everything scrolls faster as the game ramps up, so the warning distance
  // has to grow with it — otherwise the red shimmer gives you LESS time to
  // react exactly when you need it most.
  function warnDistance() { return SHELL_WARN_DISTANCE * speedMult(); }

  function scoreMultiplier() {
    return lives >= DOUBLE_POINTS_AT ? 2 : 1;
  }

  // Call after ANYTHING that changes `lives`. Fires the fanfare the moment you
  // cross into the bonus, and re-arms once you drop back below it.
  // Returns true if it played, so the caller can skip its own sound rather
  // than stacking two on the same frame.
  function checkDoubleBonus() {
    const on = scoreMultiplier() > 1;
    const justCrossed = on && !doubleActive;
    if (justCrossed) playDoubleSound();
    doubleActive = on;
    return justCrossed;
  }

  // Personal best, stored on this device. Wrapped because localStorage throws
  // outright in some privacy modes rather than just returning nothing — and a
  // missing high score must never stop the game running.
  function loadBest() {
    try {
      // Only a plain whole number in the leaderboard's own range is believed.
      // A hand-edited "-500" made a 0-point run a "new best"; "1e20" made the
      // best unbeatable.
      const raw = localStorage.getItem('kudr.best') || '';
      return /^\d{1,7}$/.test(raw) ? Math.min(parseInt(raw, 10), 1000000) : 0;
    } catch (e) { return 0; }
  }
  function saveBest(value) {
    try { localStorage.setItem('kudr.best', String(value)); } catch (e) {}
  }
  personalBest = loadBest();
  initials = loadSavedInitials();

  // The initials you last put on the board, so you don't have to dial them in
  // from AAA every time. Validated on the way out of storage: anything that
  // isn't exactly three capitals is ignored, so a corrupted or hand-edited
  // value can't put junk in the entry boxes.
  function loadSavedInitials() {
    try {
      const raw = localStorage.getItem('kudr.initials') || '';
      return /^[A-Z]{3}$/.test(raw) ? raw.split('') : ['A', 'A', 'A'];
    } catch (e) { return ['A', 'A', 'A']; }
  }
  function storeInitials(name) {
    try { localStorage.setItem('kudr.initials', name); } catch (e) {}
  }

  // Keeps a "keep this fraction of speed every 1/60s" drag feeling the same
  // no matter the frame rate.
  function applyDrag(value, keepPerTick, dt) {
    return value * Math.pow(keepPerTick, dt * 60);
  }

  // --- AUDIO SYSTEM ----------------------------------------------------
  let audioCtx = null;
  // Every sound is connected to this one "master volume" rather than straight
  // to the speakers, so the sound on/off button only has to turn one knob —
  // and any sound added later is muted with the rest automatically.
  let soundOut = null;
  let soundOn = loadSoundSetting();

  // Remembered on this device (`kudr.sound`). Only the exact word "off" mutes;
  // anything else, including nothing saved or a mangled value, means sound on.
  function loadSoundSetting() {
    try { return localStorage.getItem('kudr.sound') !== 'off'; } catch (e) { return true; }
  }
  function setSound(on) {
    soundOn = on;
    if (soundOut) soundOut.gain.value = on ? 1 : 0;
    try { localStorage.setItem('kudr.sound', on ? 'on' : 'off'); } catch (e) {}
    if (on) playCollectSound(false);   // a little chime, so you can hear it came back
  }

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      soundOut = audioCtx.createGain();
      soundOut.gain.value = soundOn ? 1 : 0;
      soundOut.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playCollectSound(isDonut) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(soundOut);

    osc.type = 'sine';
    let freq = isDonut ? 1200 : 800;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.1);

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  }

  function playHitSound() {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(soundOut);

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);

    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  }

  function playHeartSound() {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(soundOut);

    osc.type = 'square';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
    osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);

    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }

  function playRainbowSound() {
    if (!audioCtx) return;
    // A little rising arpeggio — the fanciest sound in the game, for the
    // rarest thing in it. Five notes climbing, each starting slightly later.
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    notes.forEach((freq, i) => {
      const t = audioCtx.currentTime + i * 0.07;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(soundOut);

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);

      osc.start(t); osc.stop(t + 0.35);
    });
  }

  function playDoubleSound() {
    if (!audioCtx) return;
    // A short two-note fanfare in harmony, G+D then C+G, resolving upward.
    // Deliberately unlike the rainbow's arpeggio: this should read as "you
    // earned something that lasts", not "you picked something up".
    const t0 = audioCtx.currentTime;
    [[0, 392.00, 587.33], [0.12, 523.25, 783.99]].forEach(step => {
      const when = step[0];
      [step[1], step[2]].forEach(freq => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(soundOut);

        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, t0 + when);

        gain.gain.setValueAtTime(0.0001, t0 + when);
        gain.gain.exponentialRampToValueAtTime(0.13, t0 + when + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + when + 0.30);

        osc.start(t0 + when); osc.stop(t0 + when + 0.30);
      });
    });

    // A bright sweep on top, so it sparkles rather than just honking.
    let shine = audioCtx.createOscillator();
    let shineGain = audioCtx.createGain();
    shine.connect(shineGain); shineGain.connect(soundOut);
    shine.type = 'triangle';
    shine.frequency.setValueAtTime(1046.5, t0 + 0.22);
    shine.frequency.exponentialRampToValueAtTime(2093, t0 + 0.42);
    shineGain.gain.setValueAtTime(0.0001, t0 + 0.22);
    shineGain.gain.exponentialRampToValueAtTime(0.16, t0 + 0.26);
    shineGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.50);
    shine.start(t0 + 0.22); shine.stop(t0 + 0.50);
  }

  function playSplashSound() {
    if (!audioCtx) return;
    let bloop = audioCtx.createOscillator();
    let bloopGain = audioCtx.createGain();
    bloop.type = 'sine';
    bloop.frequency.setValueAtTime(600, audioCtx.currentTime);
    bloop.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
    bloopGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
    bloopGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    bloop.connect(bloopGain); bloopGain.connect(soundOut);
    bloop.start(); bloop.stop(audioCtx.currentTime + 0.15);

    let bufferSize = audioCtx.sampleRate * 0.15;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    let noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    let filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 800;
    let noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(soundOut);
    noise.start();
  }

  // =====================================================================
  // INPUT
  // =====================================================================

  function handleGameStart() {
    score = 0;
    difficultyNow = 0;        // difficulty starts over
    beatBestThisRun = false;
    doubleActive = false;
    lives = START_LIVES;
    items.length = 0;
    obstacles.length = 0;
    splashes.length = 0;
    popups.length = 0;
    sparkles.length = 0;
    hurtLeft = 0;
    scoreShown = 0;
    resumeCountdown = 0;
    restartArmed = 0;
    player.x = playerHomeX();
    player.y = viewH / 2;
    player.dy = 0;
    runPaused = false;
    gameState = 'PLAYING';
  }

  // Restart from the pause menu: give up this run and begin a new one. A run
  // you walk away from can still be your best, so that's saved first.
  function restartRun() {
    if (score > personalBest) { personalBest = score; saveBest(personalBest); }
    handleGameStart();
  }

  function pauseGame() {
    resumeCountdown = 0;   // leaving mid-countdown (another app, a call) cancels it
    restartArmed = 0;
    if (gameState !== 'PLAYING') return;
    gameState = 'PAUSED';
    runPaused = true;
    isPressing = false;  // a held press mustn't still be "on" when you resume
  }
  // Resume doesn't drop you straight back in: it counts "3, 2, 1" first (see
  // loop() and drawPauseMenu()), then finishResume() actually restarts play.
  function resumeGame() {
    if (resumeCountdown <= 0) resumeCountdown = RESUME_STEP * 3;
  }
  function finishResume() {
    resumeCountdown = 0;
    gameState = 'PLAYING';
    runPaused = false;
    // isPressing is deliberately left alone: if you're already holding when
    // the countdown ends, the dolphin starts swimming up straight away.
  }
  // Where Back goes from the how-to and high score pages: to the paused run
  // if you came from the pause menu, otherwise the title screen.
  function closeMenuPage() {
    gameState = runPaused ? 'PAUSED' : 'START';
  }

  // Where the mouse/finger last was, in game units (screen pixels divided by
  // the big-screen zoom — see resizeCanvas).
  let pointerX = -1;
  let pointerY = -1;

  function cycleLetter(i, dir) {
    const code = initials[i].charCodeAt(0) - 65;
    initials[i] = String.fromCharCode(65 + ((code + dir) % 26 + 26) % 26);
    initialsSlot = i;
  }

  function openLeaderboard() {
    gameState = 'LEADERBOARD';
    boardTab = 'all';
    // Fetch all three up front: tabs switch instantly, and nothing shown can
    // be stale from an earlier visit.
    refreshBoard('all'); refreshBoard('month'); refreshBoard('week');
  }

  function saveInitials() {
    if (submitStatus === 'sending') return;
    let name = initials.join('');
    if (BLOCKED_INITIALS.indexOf(name) !== -1) name = 'AAA'; // quietly tidied
    submitStatus = 'sending';
    submitScore(name, pendingScore).then(ok => {
      submitStatus = ok ? 'done' : 'error';
      if (ok) {
        // Store what actually went on the board, so a name the blocklist
        // tidied isn't offered back again next time.
        storeInitials(name);
        openLeaderboard();
      }
    });
  }

  function readPointerPos(e) {
    if (!e) return;
    const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
    // Divided by zoom: the finger is in screen pixels, the game is in
    // zoomed ones (see resizeCanvas).
    if (t) { pointerX = t.clientX / zoom; pointerY = t.clientY / zoom; }
    else if (e.clientX !== undefined) { pointerX = e.clientX / zoom; pointerY = e.clientY / zoom; }
  }

  function handlePointerDown(e) {
    if (e) e.preventDefault(); // Extra safeguard for mobile touches
    readPointerPos(e);
    initAudio();
    if (isPortrait()) return;  // only the "turn sideways" screen is showing

    if (gameState === 'START') {
      // Tapping a button opens that page; tapping anywhere else still just
      // starts the game, the way it always has.
      const sb = startButtonRects();
      if (pointInRect(pointerX, pointerY, soundButtonRect())) setSound(!soundOn);
      else if (pointInRect(pointerX, pointerY, sb.howTo)) gameState = 'HOWTO';
      else if (pointInRect(pointerX, pointerY, sb.board)) openLeaderboard();
      else handleGameStart();
    } else if (gameState === 'ENTER_INITIALS') {
      if (inGrace()) return;
      for (let i = 0; i < 3; i++) {
        if (pointInRect(pointerX, pointerY, initialsChevronRect(i, true)))  { cycleLetter(i, +1); return; }
        if (pointInRect(pointerX, pointerY, initialsChevronRect(i, false))) { cycleLetter(i, -1); return; }
        if (pointInRect(pointerX, pointerY, initialsSlotRect(i)))           { initialsSlot = i; return; }
      }
      if (pointInRect(pointerX, pointerY, initialsSaveRect())) saveInitials();
      else if (pointInRect(pointerX, pointerY, initialsSkipRect())) gameState = 'GAMEOVER';
    } else if (gameState === 'LEADERBOARD') {
      for (let i = 0; i < 3; i++) {
        if (pointInRect(pointerX, pointerY, boardTabRect(i))) {
          boardTab = ['all', 'month', 'week'][i];
          if (board[boardTab] === null) refreshBoard(boardTab);   // retry a failed tab
          return;
        }
      }
      if (pointInRect(pointerX, pointerY, boardBackRect())) closeMenuPage();
    } else if (gameState === 'HOWTO') {
      closeMenuPage(); // any tap goes back — nothing to lose by closing it
    } else if (gameState === 'GAMEOVER') {
      if (inGrace()) return;
      // You have to actually hit the Try Again button. A stray tap anywhere
      // else does nothing, so your score stays on screen until you're ready.
      if (pointInRect(pointerX, pointerY, gameOverButtonRect())) handleGameStart();
    } else if (gameState === 'PAUSED') {
      // Only the buttons do anything — a stray tap shouldn't drop you back
      // into the ocean before you're ready.
      // During the countdown the menu is gone; a press just gets you ready to swim.
      if (resumeCountdown > 0) { isPressing = true; return; }
      const pm = pauseMenuRects();
      if (pointInRect(pointerX, pointerY, soundButtonRect())) {
        restartArmed = 0;
        setSound(!soundOn);
        return;
      }
      if (pointInRect(pointerX, pointerY, pm.restart)) {
        // First tap arms it, second tap (while it's still armed) restarts.
        if (restartArmed > 0) restartRun();
        else restartArmed = RESTART_CONFIRM;
        return;
      }
      restartArmed = 0;   // tapping anything else stands the Restart button down
      if (pointInRect(pointerX, pointerY, pm.resume)) resumeGame();
      else if (pointInRect(pointerX, pointerY, pm.howTo)) gameState = 'HOWTO';
      else if (pointInRect(pointerX, pointerY, pm.board)) openLeaderboard();
    } else if (gameState === 'PLAYING') {
      // The pause button eats its own tap; anywhere else is a swim press.
      if (pointInRect(pointerX, pointerY, pauseButtonRect())) pauseGame();
      else isPressing = true;
    }
  }

  window.addEventListener('mousemove', readPointerPos);
  window.addEventListener('mousedown', handlePointerDown);
  window.addEventListener('mouseup', () => isPressing = false);
  window.addEventListener('touchstart', handlePointerDown, { passive: false });
  // Only let go when the LAST finger lifts, so a two-finger hold doesn't drop
  // the moment one finger moves.
  window.addEventListener('touchend', e => {
    if (!e.touches || e.touches.length === 0) isPressing = false;
  });
  // Without these the dolphin rose forever if the press ended somewhere we
  // never heard about: an iOS system gesture or notification (touchcancel),
  // switching apps or tabs mid-hold (blur / hidden).
  window.addEventListener('touchcancel', () => isPressing = false);
  // Leaving mid-run (another app, a phone call, switching tabs) also pauses,
  // so you come back to the menu instead of straight into a spiky shell.
  window.addEventListener('blur', () => { isPressing = false; pauseGame(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { isPressing = false; pauseGame(); }
  });

  window.addEventListener('keydown', (e) => {
    if (isPortrait()) { e.preventDefault(); return; }
    // --- initials entry has its own keyboard handling ---
    if (gameState === 'ENTER_INITIALS') {
      if (inGrace()) { e.preventDefault(); return; }
      if (e.key && /^[a-zA-Z]$/.test(e.key)) {
        initials[initialsSlot] = e.key.toUpperCase();
        if (initialsSlot < 2) initialsSlot++;
      } else if (e.code === 'ArrowUp')    cycleLetter(initialsSlot, +1);
      else if (e.code === 'ArrowDown')    cycleLetter(initialsSlot, -1);
      else if (e.code === 'ArrowLeft')    initialsSlot = Math.max(0, initialsSlot - 1);
      else if (e.code === 'ArrowRight')   initialsSlot = Math.min(2, initialsSlot + 1);
      else if (e.code === 'Backspace')    initialsSlot = Math.max(0, initialsSlot - 1);
      else if (e.code === 'Enter')        saveInitials();
      else if (e.code === 'Escape')       gameState = 'GAMEOVER';
      e.preventDefault();
      return;
    }
    if (gameState === 'LEADERBOARD' && (e.code === 'Enter' || e.code === 'Escape')) {
      closeMenuPage(); e.preventDefault(); return;
    }
    if (e.code === 'KeyM') { initAudio(); setSound(!soundOn); e.preventDefault(); return; }   // M mutes
    // Escape or P pauses; on the pause menu, Escape / P / Enter resume.
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (gameState === 'PLAYING') pauseGame();
      else if (gameState === 'PAUSED') {
        if (resumeCountdown > 0) resumeCountdown = 0;   // changed your mind: back to the menu
        else resumeGame();
      }
      else if (gameState === 'HOWTO') closeMenuPage();
      e.preventDefault(); return;
    }
    if (gameState === 'PAUSED' && e.code === 'Enter') {
      resumeGame(); e.preventDefault(); return;
    }

    if (e.code === 'Enter') {
      if (gameState === 'HOWTO') {
        closeMenuPage();     // Enter closes the instructions rather than
                             // launching straight into a game, so you always
                             // land back somewhere you recognise
      } else if (gameState === 'START' || (gameState === 'GAMEOVER' && !inGrace())) {
        initAudio();
        handleGameStart();
      }
      e.preventDefault();
    }
    if (e.code === 'Space') {
      if (gameState === 'PLAYING' || resumeCountdown > 0) {
        initAudio();
        isPressing = true;
      }
      e.preventDefault();
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') isPressing = false;
  });

  // =====================================================================
  // UPDATE
  // =====================================================================

  function spawn(dt) {
    // "rate * dt" turns a per-second chance into a per-frame chance, so the
    // same number of gems appears no matter the frame rate.
    if (Math.random() < ITEM_SPAWN_RATE * dt) {
      let rand = Math.random();
      let type = 'gem';
      if (rand < RAINBOW_CHANCE) type = 'rainbow';
      else if (rand < RAINBOW_CHANCE + 0.05) type = 'heart';
      else if (rand < RAINBOW_CHANCE + 0.25) type = 'donut';

      // Rainbows, donuts and hearts are air-only, so the good stuff costs a leap.
      // Gems can be anywhere, which keeps diving worth a little something.
      let highestY = ITEM_MIN_Y;
      let lowestY;
      if (type === 'gem') {
        lowestY = viewH - FLOOR_HEIGHT - 40; // down to just above the seafloor
      } else if (type === 'rainbow') {
        highestY = RAINBOW_MIN_Y;
        lowestY = waterLineY() - RAINBOW_MARGIN;
      } else {
        lowestY = waterLineY() - AIR_ITEM_MARGIN; // stay up in the sky
      }
      if (lowestY < highestY) lowestY = highestY; // guard for very short screens

      items.push({
        x: viewW + 50,
        baseY: highestY + Math.random() * (lowestY - highestY),
        phase: Math.random() * Math.PI * 2,
        itemType: type
      });
    }

    if (Math.random() < OBSTACLE_SPAWN_RATE * hazardMult() * dt) {
      let r = Math.random();
      let kind = 'shell';
      if (r < URCHIN_CHANCE) kind = 'urchin';
      else if (r < URCHIN_CHANCE + JELLY_CHANCE) kind = 'jelly';

      // Hazards stay underwater, and off the seafloor so they're not buried.
      let top = waterLineY();
      let bottom = viewH - FLOOR_HEIGHT - 30;
      if (kind === 'urchin') top += 12;                  // spines reach higher
      if (kind === 'jelly') { top += 22; bottom -= 40; } // tentacles hang low

      obstacles.push({
        x: viewW + 50,
        y: top + Math.random() * (bottom - top),
        kind: kind
      });
    }
  }

  // A floating "+10" where a treasure was collected.
  function addPopup(x, y, text, color, size) {
    // Starts well above the treasure. A pickup always happens right on top of
    // the hero, and the kitten's face is ~60px above that point: any lower
    // and the number covers her.
    // ...but never so high it floats off the top of the screen.
    const startY = Math.max(size + 40 + safeT, y - POPUP_LIFT);
    popups.push({ x: x, y: startY, text: text, color: color, size: size, life: POPUP_LIFE });
  }

  // A ring of little stars flying out of a pickup, in the treasure's colour.
  function addSparkles(x, y, color) {
    for (let i = 0; i < SPARKLE_COUNT; i++) {
      const angle = (i / SPARKLE_COUNT) * Math.PI * 2 + Math.random() * 0.5;
      const speed = SPARKLE_SPEED * (0.5 + Math.random() * 0.5);
      sparkles.push({ x: x, y: y, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed,
                      life: 1, color: color });
    }
  }

  function createSplash(x, y, speed) {
    playSplashSound();
    for (let i = 0; i < 30; i++) {
      splashes.push({
        x: x + (Math.random() - 0.5) * 80, y: y,
        dx: (Math.random() - 0.5) * 480 - 120,
        dy: -(Math.random() * 480 + Math.abs(speed) * 0.6 + 120),
        life: 1.0, size: Math.random() * 8 + 3
      });
    }
  }

  function update(dt) {
    if (gameState !== 'PLAYING') return;

    const waterLine = waterLineY();

    clouds.forEach(c => {
      c.x -= c.speed * dt;
      if (c.x < -100) { c.x = viewW + 100; c.y = Math.random() * (viewH / 2 - 80) + 20; }
    });

    // --- Dolphin physics ---
    // Remember whether we were underwater BEFORE moving, so we can spot the
    // exact moment we cross the surface and make a splash.
    const wasInWater = player.y >= waterLine;

    if (wasInWater) {
      if (isPressing) player.dy -= RISE_ACCEL * dt; else player.dy += SINK_ACCEL * dt;
      player.dy = applyDrag(player.dy, WATER_DRAG, dt);
    } else {
      player.dy += AIR_GRAVITY * dt;
      player.dy = applyDrag(player.dy, AIR_DRAG, dt);
    }

    player.y += player.dy * dt;

    if (player.y < CEILING_Y) { player.y = CEILING_Y; player.dy = 0; }
    if (player.y > viewH - FLOOR_HEIGHT - 20) { player.y = viewH - FLOOR_HEIGHT - 20; player.dy = 0; }

    const isInWater = player.y >= waterLine;
    if (wasInWater !== isInWater) createSplash(player.x, waterLine, player.dy);

    // --- Splash droplets ---
    for (let i = splashes.length - 1; i >= 0; i--) {
      let p = splashes[i];
      p.x += p.dx * dt;
      p.y += p.dy * dt;
      p.dy += SPLASH_GRAVITY * dt;
      p.life -= SPLASH_FADE * dt;
      if (p.life <= 0) splashes.splice(i, 1);
    }

    // --- Pickup pop-ups and sparkles ---
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].y -= POPUP_RISE * dt;
      popups[i].life -= dt;
      if (popups[i].life <= 0) popups.splice(i, 1);
    }
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const sp = sparkles[i];
      sp.x += sp.dx * dt;
      sp.y += sp.dy * dt;
      sp.dx = applyDrag(sp.dx, 0.92, dt);   // they shoot out, then hang and fade
      sp.dy = applyDrag(sp.dy, 0.92, dt);
      sp.life -= SPARKLE_FADE * dt;
      if (sp.life <= 0) sparkles.splice(i, 1);
    }
    if (hurtLeft > 0) hurtLeft -= dt;

    // The HUD number rolls up to the real score instead of jumping.
    scoreShown += (score - scoreShown) * (1 - Math.pow(0.0005, dt));
    if (score - scoreShown < 0.5) scoreShown = score;

    // --- Gems, donuts and hearts ---
    for (let i = items.length - 1; i >= 0; i--) {
      items[i].x -= scrollSpeed() * dt;
      items[i].y = items[i].baseY + Math.sin(elapsed * 3 + items[i].phase) * 10;

      if (Math.abs(items[i].x - player.x) < 50 && Math.abs(items[i].y - player.y) < 50) {
        const ix = items[i].x, iy = items[i].y;
        if (items[i].itemType === 'heart') {
          lives++;
          // The heart that unlocks the bonus plays the fanfare INSTEAD of the
          // usual chime — the two on top of each other were muddy.
          if (!checkDoubleBonus()) playHeartSound();
          addPopup(ix, iy, '+1 \u2665', '#FF4D6D', 26);
          addSparkles(ix, iy, '#FF8FA3');
        } else if (items[i].itemType === 'rainbow') {
          const gained = RAINBOW_VALUE * scoreMultiplier();
          score += gained;
          playRainbowSound();
          addPopup(ix, iy, '+' + gained, '#FFD93D', 34);   // the big one gets a big number
          addSparkles(ix, iy, '#FFD93D'); addSparkles(ix, iy, '#FF69B4');
        } else {
          const isDonut = items[i].itemType === 'donut';
          const gained = (isDonut ? DONUT_VALUE : GEM_VALUE) * scoreMultiplier();
          score += gained;
          playCollectSound(isDonut);
          addPopup(ix, iy, '+' + gained, isDonut ? '#FF8AD0' : '#7FFFF4', isDonut ? 26 : 22);
          addSparkles(ix, iy, isDonut ? '#FF8AD0' : '#7FFFF4');
        }
        items.splice(i, 1);
      } else if (items[i].x < -50) {
        items.splice(i, 1);
      }
    }

    // --- Spiky shells ---
    for (let i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].x -= OBSTACLE_SPEED * speedMult() * dt;
      const box = OBSTACLE_HITBOX[obstacles[i].kind] || OBSTACLE_HITBOX.shell;
      // hurtLeft > 0: still blinking from the last bump, so this one passes by.
      if (hurtLeft <= 0 &&
          Math.abs(obstacles[i].x - player.x) < box.hw &&
          Math.abs((obstacles[i].y + box.oy) - player.y) < box.hh) {
        playHitSound();
        lives--;
        hurtLeft = HURT_TIME;
        checkDoubleBonus();   // losing the bonus re-arms the fanfare
        obstacles.splice(i, 1);

        if (lives <= 0) {
          gameState = 'GAMEOVER';
          isPressing = false;
          scoreShown = score;   // no half-rolled number frozen behind the game-over panel
          // Ask the board whether this run earned a place. If we can't reach
          // it, qualifiesForBoard returns false and the player simply never
          // sees the initials screen — no error, no blocked game.
          pendingScore = score;
          // Personal best lives on this device, separate from the online
          // board — it's something to beat even on a run that doesn't make
          // the top ten.
          if (score > personalBest) {
            personalBest = score;
            saveBest(personalBest);
            beatBestThisRun = true;
          }
          submitStatus = 'idle';
          initials = loadSavedInitials();  // start from last time, not AAA
          initialsSlot = 0;
          const runScore = score;
          screenShownAt = elapsed;
          qualifiesForBoard(runScore).then(yes => {
            if (yes && gameState === 'GAMEOVER' && score === runScore) {
              gameState = 'ENTER_INITIALS';
              screenShownAt = elapsed;
            }
          });
          // Stop here. Two hazards overlapping you on the same frame used to
          // drive lives to -1 and run this whole game-over block twice.
          break;
        }
      } else if (obstacles[i].x < -50) {
        obstacles.splice(i, 1);
      }
    }
  }

  // =====================================================================
  // DRAW
  // =====================================================================

  function drawGem(x, y) {
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = '#00FFFF';
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(15, 0); ctx.lineTo(0, 20); ctx.lineTo(-15, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(8, -5); ctx.lineTo(0, 5); ctx.lineTo(-8, -5); ctx.fill();
    ctx.strokeStyle = '#008B8B'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(15, 0); ctx.lineTo(0, 20); ctx.lineTo(-15, 0); ctx.closePath(); ctx.stroke();
    ctx.restore();
  }

  function drawDonut(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#D2B48C'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FF69B4'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'white'; ctx.fillRect(-8, -8, 4, 2); ctx.fillStyle = 'yellow'; ctx.fillRect(5, -10, 2, 4);
    ctx.fillStyle = 'cyan'; ctx.fillRect(-10, 5, 2, 4); ctx.fillStyle = 'white'; ctx.fillRect(4, 8, 4, 2);
    ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawHeart(x, y) {
    ctx.save(); ctx.translate(x, y);
    let scale = 1 + Math.sin(elapsed * 6) * 0.1;
    ctx.scale(scale, scale);
    ctx.fillStyle = '#FF0000';
    ctx.beginPath(); ctx.moveTo(0, 5); ctx.bezierCurveTo(0, -10, -15, -15, -15, -5); ctx.bezierCurveTo(-15, 5, 0, 15, 0, 20); ctx.bezierCurveTo(0, 15, 15, 5, 15, -5); ctx.bezierCurveTo(15, -15, 0, -10, 0, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ctx.beginPath(); ctx.arc(-6, -5, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#8B0000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 5); ctx.bezierCurveTo(0, -10, -15, -15, -15, -5); ctx.bezierCurveTo(-15, 5, 0, 15, 0, 20); ctx.bezierCurveTo(0, 15, 15, 5, 15, -5); ctx.bezierCurveTo(15, -15, 0, -10, 0, 5); ctx.stroke();
    ctx.restore();
  }

  // `warn` runs 0 → 1 as the shell closes in, fading a shimmer up around it
  // so you get a heads-up instead of a nasty surprise.
  // The rainbow treasure: the rarest thing in the game, so it gets the
  // fanciest art — a bigger rainbow floating inside a rainbow-rimmed bubble.
  function drawRainbow(x, y) {
    ctx.save(); ctx.translate(x, y);

    // The soft inside of the bubble.
    ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
    ctx.beginPath(); ctx.arc(0, 0, RAINBOW_BUBBLE_R, 0, Math.PI * 2); ctx.fill();

    // The rainbow: five arcs nested inside each other, flat side down.
    // PI -> 2*PI sweeps the TOP half of the circle (canvas y grows downward).
    const bands = [[22, '#FF4136'], [18, '#FF851B'], [14, '#FFDC00'],
                   [10, '#2ECC40'], [6, '#0074D9']];
    ctx.lineWidth = 4;
    ctx.lineCap = 'butt';
    bands.forEach(band => {
      ctx.strokeStyle = band[1];
      ctx.beginPath();
      ctx.arc(0, 11, band[0], Math.PI, Math.PI * 2);
      ctx.stroke();
    });

    // The bubble's rim: six coloured arcs going all the way round.
    const rim = ['#FF4136', '#FF851B', '#FFDC00', '#2ECC40', '#0074D9', '#B10DC9'];
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    rim.forEach((color, i) => {
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.arc(0, 0, RAINBOW_BUBBLE_R,
              -Math.PI / 2 + (i / 6) * Math.PI * 2,
              -Math.PI / 2 + ((i + 1) / 6) * Math.PI * 2);
      ctx.stroke();
    });

    // A shine near the top left, the way a real bubble catches the light.
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.beginPath(); ctx.ellipse(-12, -14, 7, 4.5, -0.61, 0, Math.PI * 2); ctx.fill();

    // Sparkles just outside the bubble, twinkling out of phase.
    [[-36, -13], [36, -9], [0, -33]].forEach((pos, i) => {
      const twinkle = 0.45 + Math.abs(Math.sin(elapsed * 5 + i * 2)) * 0.55;
      const sz = 2.2 + twinkle * 1.8;
      const sx = pos[0], sy = pos[1];
      ctx.fillStyle = 'rgba(255, 255, 255, ' + twinkle + ')';
      ctx.beginPath();
      ctx.moveTo(sx, sy - sz);
      ctx.lineTo(sx + sz * 0.35, sy - sz * 0.35);
      ctx.lineTo(sx + sz, sy);
      ctx.lineTo(sx + sz * 0.35, sy + sz * 0.35);
      ctx.lineTo(sx, sy + sz);
      ctx.lineTo(sx - sz * 0.35, sy + sz * 0.35);
      ctx.lineTo(sx - sz, sy);
      ctx.lineTo(sx - sz * 0.35, sy - sz * 0.35);
      ctx.closePath(); ctx.fill();
    });

    ctx.restore();
  }

  // The red "watch out" glow. All three hazards share it, so there's one
  // place to change how the warning looks. RED on purpose: a gold or white
  // sparkle reads as treasure and made players swim TOWARD the hazards.
  function drawHazardShimmer(warn) {
    if (warn <= 0) return;
    const pulse = 0.55 + Math.abs(Math.sin(elapsed * 9)) * 0.45;
    const radius = 34 + warn * 12;
    const halo = ctx.createRadialGradient(0, 0, radius * 0.3, 0, 0, radius);
    halo.addColorStop(0, `rgba(255, 40, 40, ${warn * pulse * 0.85})`);
    halo.addColorStop(1, 'rgba(190, 0, 0, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();

    // Warning sparks orbiting out of phase, so it flickers like a hazard
    // light rather than glowing steadily.
    for (let s = 0; s < 3; s++) {
      const angle = (s / 3) * Math.PI * 2 + elapsed * 1.5;
      const twinkle = Math.abs(Math.sin(elapsed * 7 + s * 2));
      ctx.fillStyle = `rgba(255, 80, 60, ${warn * twinkle * 0.95})`;
      ctx.beginPath();
      ctx.arc(Math.cos(angle) * 32, Math.sin(angle) * 27, 1.5 + twinkle * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Sea urchin: a dark ball under two rings of spines, the short set sitting
  // between the long ones so it reads as prickly all the way round.
  function drawSeaUrchin(x, y, warn) {
    ctx.save(); ctx.translate(x, y);
    drawHazardShimmer(warn);
    ctx.rotate(Math.sin(elapsed * 2.2) * 0.15);

    ctx.lineCap = 'round';
    ctx.strokeStyle = '#7A1F44'; ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + Math.PI / 12;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 13, Math.sin(a) * 13);
      ctx.lineTo(Math.cos(a) * 23, Math.sin(a) * 23);
      ctx.stroke();
    }
    ctx.strokeStyle = '#9E2C55'; ctx.lineWidth = 2.6;
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 14, Math.sin(a) * 14);
      ctx.lineTo(Math.cos(a) * 30, Math.sin(a) * 30);
      ctx.stroke();
    }

    ctx.fillStyle = '#8B2252';
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(168, 56, 102, 0.9)';
    ctx.beginPath(); ctx.arc(-5, -5, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Jellyfish: a scalloped dome with tentacles that drift behind it as it
  // bobs along.
  function drawJellyfish(x, y, warn) {
    ctx.save(); ctx.translate(x, y);
    drawHazardShimmer(warn);
    ctx.translate(0, Math.sin(elapsed * 2.4) * 3); // gentle bob

    const drift = Math.sin(elapsed * 2) * 4;
    // Vivian's colours: the original deep pink dome, with distinctly darker
    // tentacles underneath so the two halves read apart.
    ctx.strokeStyle = '#8E1B3A'; ctx.lineWidth = 2.8; ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const tx = -14 + i * 7;
      ctx.beginPath();
      ctx.moveTo(tx, 6);
      ctx.quadraticCurveTo(tx - 3 + drift, 16, tx + 1 + drift, 25);
      ctx.quadraticCurveTo(tx + 4 + drift * 1.2, 31, tx + 1 + drift * 1.5, 37);
      ctx.stroke();
    }

    ctx.fillStyle = '#C2185B';
    ctx.beginPath();
    ctx.ellipse(0, 4, 20, 17, 0, Math.PI, Math.PI * 2); // top half of the dome
    ctx.quadraticCurveTo(15, 11, 10, 4);
    ctx.quadraticCurveTo(5, 11, 0, 4);
    ctx.quadraticCurveTo(-5, 11, -10, 4);
    ctx.quadraticCurveTo(-15, 11, -20, 4);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.beginPath(); ctx.ellipse(-7, -6, 7, 4, -0.4, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-7, -1, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -1, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d0c22';
    ctx.beginPath(); ctx.arc(-7, -1, 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -1, 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Picks the right hazard art for this obstacle.
  function drawObstacle(kind, x, y, warn) {
    if (kind === 'urchin') drawSeaUrchin(x, y, warn);
    else if (kind === 'jelly') drawJellyfish(x, y, warn);
    else drawSpikyShell(x, y, warn);
  }

  function drawSpikyShell(x, y, warn) {
    ctx.save(); ctx.translate(x, y);
    drawHazardShimmer(warn);
    ctx.rotate(Math.sin(elapsed * 3) * 0.2);

    ctx.fillStyle = '#8B0000'; ctx.beginPath();
    ctx.moveTo(-5, -5); ctx.lineTo(-10, -20); ctx.lineTo(0, -10);
    ctx.moveTo(5, -5); ctx.lineTo(5, -25); ctx.lineTo(15, -8);
    ctx.moveTo(15, -2); ctx.lineTo(25, -15); ctx.lineTo(20, 5);
    ctx.moveTo(0, 5); ctx.lineTo(-5, 20); ctx.lineTo(10, 8);
    ctx.moveTo(15, 5); ctx.lineTo(18, 22); ctx.lineTo(25, 5); ctx.fill();
    ctx.fillStyle = '#FFA07A'; ctx.beginPath(); ctx.moveTo(25, 0); ctx.bezierCurveTo(25, 15, -10, 15, -25, 0); ctx.bezierCurveTo(-10, -15, 25, -15, 25, 0); ctx.fill();
    ctx.fillStyle = '#FFC0CB'; ctx.beginPath(); ctx.ellipse(20, 0, 6, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#CD5C5C'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(5, -12); ctx.quadraticCurveTo(-5, 0, 5, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(15, -10); ctx.quadraticCurveTo(5, 0, 15, 10); ctx.stroke();
    ctx.restore();
  }

  // Draws the dolphin + kitty unicorn rider at a given spot. Taking x/y as
  // arguments means the start screen can show the hero somewhere else
  // without secretly moving the real player.
  function drawHero(x, y, dy, inWater) {
    ctx.save();
    ctx.translate(x, y);
    let tilt = dy * TILT_PER_SPEED;
    if (!inWater) tilt *= 0.5; // gentler tip while airborne
    tilt = Math.max(-MAX_TILT, Math.min(MAX_TILT, tilt));
    ctx.rotate(tilt);
    let animCycle = Math.sin(elapsed * 12);

    let dolGrad = ctx.createLinearGradient(-60, 0, 70, 0);
    dolGrad.addColorStop(0, '#0099DD'); dolGrad.addColorStop(1, '#44CCFF');
    ctx.fillStyle = dolGrad;

    let tailY = 20 + animCycle * 10;
    ctx.beginPath(); ctx.moveTo(-40, 20); ctx.quadraticCurveTo(-60, tailY - 25, -70, tailY - 15); ctx.quadraticCurveTo(-55, tailY, -70, tailY + 15); ctx.quadraticCurveTo(-60, tailY + 25, -40, 20); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5, 22, 50, 22, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(45, 12, 15, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(60, 24, 18, 7, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0099DD'; ctx.beginPath(); ctx.moveTo(0, 5); ctx.quadraticCurveTo(-5, -20, -15, -20); ctx.quadraticCurveTo(-15, -5, -25, 10); ctx.fill();

    let flipRot = Math.sin(elapsed * 12) * 0.2;
    ctx.save(); ctx.translate(15, 35); ctx.rotate(flipRot); ctx.beginPath(); ctx.ellipse(-5, 10, 8, 15, -Math.PI/4, 0, Math.PI*2); ctx.fill(); ctx.restore();

    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(42, 14, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(44, 14, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#005588'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(45, 25); ctx.quadraticCurveTo(60, 28, 70, 24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(45, 25); ctx.lineTo(42, 22); ctx.stroke();

    // --- THE RIDER ---
    // Vivian's redesign: a lavender chibi kitten with a rainbow mane, a flower
    // crown, a rainbow horn, closed happy eyes and a paw that waves.
    // Drawn at 0.7 so the whole hero keeps the footprint it had before.
    //
    // The DOLPHIN above is deliberately untouched. Every attempt to redraw it
    // came out worse than this one -- it went "closer", then "looks like a
    // shark", then "worse". It already has what matters: a long snout, a
    // rounded body, a friendly eye and a big smile. Leave it alone.
    ctx.translate(5, 2);
    ctx.scale(0.7, 0.7);

    const OUTLINE = '#4A4670';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // Rainbow mane, sweeping back behind her and drifting as she swims.
    const maneSway = Math.sin(elapsed * 3) * 3;
    ctx.lineWidth = 12;
    [['#FF6B6B', -58], ['#FFA94D', -66], ['#FFD93D', -70]].forEach((band, i) => {
      ctx.strokeStyle = band[0];
      ctx.beginPath();
      ctx.moveTo(-18 + i * 7, band[1]);
      ctx.quadraticCurveTo(-50 + i * 9, -48 + i * 6 + maneSway,
                           -58 + i * 11, -18 + i * 6 + maneSway);
      ctx.stroke();
    });
    ctx.strokeStyle = OUTLINE;

    // Body, chest and front paws.
    ctx.lineWidth = 3; ctx.fillStyle = '#C9A5E8';
    ctx.beginPath(); ctx.ellipse(2, -6, 17, 15, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 2.4; ctx.fillStyle = '#FDFAFF';
    ctx.beginPath(); ctx.ellipse(6, -4, 9, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-4, 7, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(12, 8, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // The raised paw actually waves.
    ctx.save();
    ctx.translate(16, -22);
    ctx.rotate(Math.sin(elapsed * 5) * 0.25);
    ctx.strokeStyle = '#C9A5E8'; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -10, 22, -22); ctx.stroke();
    ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -10, 22, -22); ctx.stroke();
    ctx.fillStyle = '#FDFAFF';
    ctx.beginPath(); ctx.arc(25, -28, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#F5A3BE';
    ctx.beginPath(); ctx.ellipse(25, -31, 3.2, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    [[21, -26], [25, -24.5], [29, -26]].forEach(pad => {
      ctx.beginPath(); ctx.arc(pad[0], pad[1], 1.8, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    // Ears.
    ctx.lineWidth = 3; ctx.fillStyle = '#C9A5E8';
    ctx.beginPath(); ctx.moveTo(-30, -66);
    ctx.quadraticCurveTo(-38, -94, -32, -97);
    ctx.quadraticCurveTo(-19, -86, -9, -80); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30, -66);
    ctx.quadraticCurveTo(38, -94, 32, -97);
    ctx.quadraticCurveTo(19, -86, 9, -80); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#F5A3BE';
    ctx.beginPath(); ctx.moveTo(-28, -68);
    ctx.quadraticCurveTo(-33, -88, -31, -90);
    ctx.quadraticCurveTo(-21, -82, -13, -78); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(28, -68);
    ctx.quadraticCurveTo(33, -88, 31, -90);
    ctx.quadraticCurveTo(21, -82, 13, -78); ctx.closePath(); ctx.fill();

    // Rainbow horn, built from stacked slices of a cone.
    ctx.lineWidth = 2.2;
    [['#B980F0', -86, -95, 7, 5.6], ['#5BA9F0', -95, -104, 5.6, 4.2],
     ['#6BCB77', -104, -113, 4.2, 2.8]].forEach(sl => {
      ctx.fillStyle = sl[0];
      ctx.beginPath();
      ctx.moveTo(-sl[3], sl[1]); ctx.lineTo(sl[3], sl[1]);
      ctx.lineTo(sl[4], sl[2]); ctx.lineTo(-sl[4], sl[2]);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    });
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath(); ctx.moveTo(-2.8, -113); ctx.lineTo(2.8, -113); ctx.lineTo(0, -126);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Head.
    ctx.lineWidth = 3; ctx.fillStyle = '#C9A5E8';
    ctx.beginPath(); ctx.arc(0, -50, 34, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // Flower crown.
    [[-22, -74, '#FF9ECD'], [22, -72, '#FFE066']].forEach(f => {
      ctx.lineWidth = 2; ctx.fillStyle = f[2];
      [[0, -4], [3.8, -1.3], [2.4, 3.3], [-2.4, 3.3], [-3.8, -1.3]].forEach(petal => {
        ctx.beginPath();
        ctx.arc(f[0] + petal[0], f[1] + petal[1], 3.3, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      });
      ctx.fillStyle = '#FFE066';
      ctx.beginPath(); ctx.arc(f[0], f[1], 2.3, 0, Math.PI * 2); ctx.fill();
    });

    // Closed happy eyes. Two upward arcs read as a delighted cat; solid dark
    // almond shapes read as a sleeping one.
    ctx.strokeStyle = OUTLINE; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.moveTo(-21, -56); ctx.quadraticCurveTo(-13, -67, -5, -56); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, -56); ctx.quadraticCurveTo(13, -67, 21, -56); ctx.stroke();

    // Blush.
    ctx.globalAlpha = 0.8; ctx.fillStyle = '#F5A3BE';
    ctx.beginPath(); ctx.ellipse(-25, -42, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(25, -42, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // Muzzle, nose, open smile and tongue.
    ctx.fillStyle = '#FDFAFF';
    ctx.beginPath(); ctx.ellipse(-8, -36, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, -36, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#E8709B';
    ctx.beginPath(); ctx.moveTo(-3, -42); ctx.lineTo(3, -42); ctx.lineTo(0, -38.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7A4A6A'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(-11, -38);
    ctx.quadraticCurveTo(0, -41, 11, -38);
    ctx.quadraticCurveTo(10, -22, 0, -22);
    ctx.quadraticCurveTo(-10, -22, -11, -38);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FF8FB8';
    ctx.beginPath(); ctx.moveTo(-5, -27); ctx.quadraticCurveTo(0, -21, 5, -27);
    ctx.quadraticCurveTo(0, -24, -5, -27); ctx.closePath(); ctx.fill();
    ctx.restore();

    // TODO: customization shop — swap the pink/blue colours above for the
    // outfit and dolphin colours the player has bought.
  }

  // Bubble weed: a curving stem studded with beads. The beads are placed by
  // walking the SAME curve the stem is drawn from, so they always sit on it.
  function drawBubbleWeed(sway, h) {
    ctx.strokeStyle = '#1B5E45'; ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(sway * 0.4, -h * 0.55, sway, -h);
    ctx.stroke();

    ctx.fillStyle = '#2A7D5C';
    for (let t = 0.16; t <= 1.001; t += 0.17) {
      const mt = 1 - t;
      const bx = 2 * mt * t * (sway * 0.4) + t * t * sway;
      const by = 2 * mt * t * (-h * 0.55) + t * t * (-h);
