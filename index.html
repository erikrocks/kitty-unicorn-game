<!DOCTYPE html>
<html>
<head>
  <title>Kitty Unicorn Dolphin Rider</title>
  <!-- NEW: This meta tag prevents mobile browsers from zooming in when you tap! -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    /* NEW: touch-action: none prevents the screen from scrolling when swiping/tapping */
    body { margin: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; } 
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // NEW: Handle window resizing (like rotating a phone) dynamically
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (player.y > canvas.height - 80) player.y = canvas.height - 80;
    });

    let isPressing = false;
    let score = 0;
    let lives = 3;
    let gameState = 'START'; 
    let frameCount = 0;

    // --- AUDIO SYSTEM ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playCollectSound(isDonut) {
      if (!audioCtx) return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      
      osc.type = 'sine';
      let freq = isDonut ? 1200 : 800; 
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.1);
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function playHitSound() {
      if (!audioCtx) return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      
      osc.type = 'sawtooth'; 
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2); 
      
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
    
    function playHeartSound() {
      if (!audioCtx) return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      
      osc.type = 'square'; 
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
      
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      
      osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }

    function playSplashSound() {
      if (!audioCtx) return;
      let bloop = audioCtx.createOscillator();
      let bloopGain = audioCtx.createGain();
      bloop.type = 'sine';
      bloop.frequency.setValueAtTime(600, audioCtx.currentTime); 
      bloop.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15); 
      bloopGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
      bloopGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      bloop.connect(bloopGain); bloopGain.connect(audioCtx.destination);
      bloop.start(); bloop.stop(audioCtx.currentTime + 0.15);

      let bufferSize = audioCtx.sampleRate * 0.15;
      let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      let data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      let noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      let filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass'; filter.frequency.value = 800;
      let noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
      noise.start();
    }

    // Our Hero
    const player = { x: 200, y: canvas.height / 2, dy: 0 };
    const items = [];
    const obstacles = [];
    const splashes = [];
    const clouds = [];

    for(let i = 0; i < 6; i++) {
      clouds.push({ x: Math.random() * canvas.width, y: Math.random() * (canvas.height / 2 - 80) + 20, size: Math.random() * 25 + 30, speed: Math.random() * 0.5 + 0.2 });
    }

    // --- CONTROLS LOGIC ---
    function handleGameStart() {
      score = 0;
      lives = 3;
      items.length = 0;
      obstacles.length = 0;
      splashes.length = 0;
      player.y = canvas.height / 2;
      player.dy = 0;
      gameState = 'PLAYING';
    }

    function handlePointerDown(e) {
      if (e) e.preventDefault(); // Extra safeguard for mobile touches
      initAudio();
      if (gameState === 'START' || gameState === 'GAMEOVER') {
        handleGameStart();
      } else if (gameState === 'PLAYING') {
        isPressing = true;
      }
    }

    window.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mouseup', () => isPressing = false);
    window.addEventListener('touchstart', handlePointerDown, {passive: false});
    window.addEventListener('touchend', () => isPressing = false);
    
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Enter') {
        if (gameState === 'START' || gameState === 'GAMEOVER') {
           initAudio();
           handleGameStart();
        }
        e.preventDefault();
      }
      if (e.code === 'Space') { 
        if (gameState === 'PLAYING') {
           initAudio();
           isPressing = true; 
        }
        e.preventDefault(); 
      }
    });
    
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') isPressing = false;
    });

    function spawn() {
      if (Math.random() < 0.02) {
        let rand = Math.random();
        let type = 'gem';
        if (rand < 0.05) type = 'heart'; 
        else if (rand < 0.25) type = 'donut'; 

        items.push({ 
          x: canvas.width + 50, 
          baseY: Math.random() * (canvas.height / 2 - 50) + 40, 
          phase: Math.random() * Math.PI * 2, 
          itemType: type
        });
      }
      if (Math.random() < 0.006) {
        obstacles.push({ 
          x: canvas.width + 50, 
          y: (canvas.height / 2) + Math.random() * (canvas.height / 2 - 80) + 20
        });
      }
    }

    function createSplash(x, y, speed) {
      playSplashSound(); 
      for(let i = 0; i < 30; i++) {
        splashes.push({
          x: x + (Math.random() - 0.5) * 80, y: y,
          dx: (Math.random() - 0.5) * 8 - 2, dy: -(Math.random() * 8 + Math.abs(speed) * 0.6 + 2), 
          life: 1.0, size: Math.random() * 8 + 3
        });
      }
    }

    function update() {
      if (gameState !== 'PLAYING') return; 

      frameCount++;
      let waterLine = canvas.height / 2 + 20;
      let wasInWater = player.y >= waterLine;
      let isInWater = player.y >= waterLine;

      clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x < -100) { c.x = canvas.width + 100; c.y = Math.random() * (canvas.height / 2 - 80) + 20; }
      });

      if (isInWater) {
        if (isPressing) player.dy -= 2.2; else player.dy += 1.0; 
        player.dy *= 0.92; 
      } else {
        player.dy += 0.45; player.dy *= 0.98; 
      }

      player.y += player.dy;
      if (player.y < 40) { player.y = 40; player.dy = 0; }
      
      let floorHeight = 60;
      if (player.y > canvas.height - floorHeight - 20) { player.y = canvas.height - floorHeight - 20; player.dy = 0; }

      if (wasInWater && player.y < waterLine) createSplash(player.x, waterLine, player.dy); 
      else if (!wasInWater && player.y >= waterLine) createSplash(player.x, waterLine, player.dy); 

      for (let i = splashes.length - 1; i >= 0; i--) {
        let p = splashes[i];
        p.x += p.dx; p.y += p.dy; p.dy += 0.5; p.life -= 0.03; 
        if (p.life <= 0) splashes.splice(i, 1);
      }

      for (let i = items.length - 1; i >= 0; i--) {
        items[i].x -= 5;
        items[i].y = items[i].baseY + Math.sin(frameCount * 0.05 + items[i].phase) * 10; 

        if (Math.abs(items[i].x - player.x) < 50 && Math.abs(items[i].y - player.y) < 50) {
          if (items[i].itemType === 'heart') {
             lives++;
             playHeartSound();
          } else {
             score += items[i].itemType === 'donut' ? 50 : 10;
             playCollectSound(items[i].itemType === 'donut'); 
          }
          items.splice(i, 1);
        } else if (items[i].x < -50) {
          items.splice(i, 1);
        }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= 6;
        if (Math.abs(obstacles[i].x - player.x) < 45 && Math.abs(obstacles[i].y - player.y) < 45) {
          playHitSound(); 
          lives--; 
          obstacles.splice(i, 1);
          
          if (lives <= 0) {
            gameState = 'GAMEOVER';
            isPressing = false; 
          }
        } else if (obstacles[i].x < -50) {
          obstacles.splice(i, 1);
        }
      }
    }

    // --- CUSTOM DRAWING FUNCTIONS ---
    function drawGem(x, y) {
      ctx.save(); ctx.translate(x, y); ctx.fillStyle = '#00FFFF'; 
      ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(15, 0); ctx.lineTo(0, 20); ctx.lineTo(-15, 0); ctx.fill();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(8, -5); ctx.lineTo(0, 5); ctx.lineTo(-8, -5); ctx.fill();
      ctx.strokeStyle = '#008B8B'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(15, 0); ctx.lineTo(0, 20); ctx.lineTo(-15, 0); ctx.closePath(); ctx.stroke();
      ctx.restore();
    }

    function drawDonut(x, y) {
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = '#D2B48C'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FF69B4'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'white'; ctx.fillRect(-8, -8, 4, 2); ctx.fillStyle = 'yellow'; ctx.fillRect(5, -10, 2, 4);
      ctx.fillStyle = 'cyan'; ctx.fillRect(-10, 5, 2, 4); ctx.fillStyle = 'white'; ctx.fillRect(4, 8, 4, 2);
      ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; 
      ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    function drawHeart(x, y) {
      ctx.save(); ctx.translate(x, y);
      let scale = 1 + Math.sin(frameCount * 0.1) * 0.1; 
      ctx.scale(scale, scale);
      ctx.fillStyle = '#FF0000'; 
      ctx.beginPath(); ctx.moveTo(0, 5); ctx.bezierCurveTo(0, -10, -15, -15, -15, -5); ctx.bezierCurveTo(-15, 5, 0, 15, 0, 20); ctx.bezierCurveTo(0, 15, 15, 5, 15, -5); ctx.bezierCurveTo(15, -15, 0, -10, 0, 5); ctx.fill();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ctx.beginPath(); ctx.arc(-6, -5, 3, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#8B0000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 5); ctx.bezierCurveTo(0, -10, -15, -15, -15, -5); ctx.bezierCurveTo(-15, 5, 0, 15, 0, 20); ctx.bezierCurveTo(0, 15, 15, 5, 15, -5); ctx.bezierCurveTo(15, -15, 0, -10, 0, 5); ctx.stroke();
      ctx.restore();
    }

    function drawSpikyShell(x, y) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(frameCount * 0.05) * 0.2); 
      ctx.fillStyle = '#8B0000'; ctx.beginPath();
      ctx.moveTo(-5, -5); ctx.lineTo(-10, -20); ctx.lineTo(0, -10); 
      ctx.moveTo(5, -5); ctx.lineTo(5, -25); ctx.lineTo(15, -8);    
      ctx.moveTo(15, -2); ctx.lineTo(25, -15); ctx.lineTo(20, 5);   
      ctx.moveTo(0, 5); ctx.lineTo(-5, 20); ctx.lineTo(10, 8);      
      ctx.moveTo(15, 5); ctx.lineTo(18, 22); ctx.lineTo(25, 5); ctx.fill();
      ctx.fillStyle = '#FFA07A'; ctx.beginPath(); ctx.moveTo(25, 0); ctx.bezierCurveTo(25, 15, -10, 15, -25, 0); ctx.bezierCurveTo(-10, -15, 25, -15, 25, 0); ctx.fill();
      ctx.fillStyle = '#FFC0CB'; ctx.beginPath(); ctx.ellipse(20, 0, 6, 12, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#CD5C5C'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(5, -12); ctx.quadraticCurveTo(-5, 0, 5, 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(15, -10); ctx.quadraticCurveTo(5, 0, 15, 10); ctx.stroke();
      ctx.restore();
    }

    function drawHero(dy, inWater) {
      ctx.save();
      ctx.translate(player.x, player.y);
      let tilt = dy * 0.03;
      if (!inWater) tilt *= 0.5; 
      ctx.rotate(tilt);
      let animCycle = Math.sin(frameCount * 0.2);

      let dolGrad = ctx.createLinearGradient(-60, 0, 70, 0);
      dolGrad.addColorStop(0, '#0099DD'); dolGrad.addColorStop(1, '#44CCFF'); 
      ctx.fillStyle = dolGrad;
      
      let tailY = 20 + animCycle * 10; 
      ctx.beginPath(); ctx.moveTo(-40, 20); ctx.quadraticCurveTo(-60, tailY - 25, -70, tailY - 15); ctx.quadraticCurveTo(-55, tailY, -70, tailY + 15); ctx.quadraticCurveTo(-60, tailY + 25, -40, 20); ctx.fill();
      ctx.beginPath(); ctx.ellipse(5, 22, 50, 22, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(45, 12, 15, 12, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(60, 24, 18, 7, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0099DD'; ctx.beginPath(); ctx.moveTo(0, 5); ctx.quadraticCurveTo(-5, -20, -15, -20); ctx.quadraticCurveTo(-15, -5, -25, 10); ctx.fill();
      
      let flipRot = Math.sin(frameCount * 0.2) * 0.2;
      ctx.save(); ctx.translate(15, 35); ctx.rotate(flipRot); ctx.beginPath(); ctx.ellipse(-5, 10, 8, 15, -Math.PI/4, 0, Math.PI*2); ctx.fill(); ctx.restore();

      ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(42, 14, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(44, 14, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#005588'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(45, 25); ctx.quadraticCurveTo(60, 28, 70, 24); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(45, 25); ctx.lineTo(42, 22); ctx.stroke(); 

      ctx.translate(-5, -20); 
      ctx.strokeStyle = '#FF69B4'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-20, -5); ctx.quadraticCurveTo(-40, -15 - animCycle*5, -35, -25 + animCycle*5); ctx.stroke();
      ctx.fillStyle = '#FFB6C1'; ctx.beginPath(); ctx.ellipse(-10, -5, 18, 14, 0.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FF69B4'; ctx.beginPath(); ctx.ellipse(5, 5, 6, 8, -0.5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(-15, 8, 6, 8, 0.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FF69B4'; ctx.beginPath(); ctx.ellipse(8, -25, 24, 18, 0, 0, Math.PI * 2); ctx.fill();
      
      ctx.beginPath(); ctx.moveTo(-10, -35); ctx.lineTo(-15, -55); ctx.lineTo(5, -40); ctx.fill(); ctx.beginPath(); ctx.moveTo(15, -40); ctx.lineTo(30, -55); ctx.lineTo(25, -30); ctx.fill();
      ctx.fillStyle = '#FFB6C1'; ctx.beginPath(); ctx.moveTo(-8, -38); ctx.lineTo(-12, -48); ctx.lineTo(1, -40); ctx.fill(); ctx.beginPath(); ctx.moveTo(16, -38); ctx.lineTo(25, -48); ctx.lineTo(22, -32); ctx.fill();
      
      let hornGrad = ctx.createLinearGradient(8, -43, 8, -75); hornGrad.addColorStop(0, 'white'); hornGrad.addColorStop(1, '#FFD700');
      ctx.fillStyle = hornGrad; ctx.beginPath(); ctx.moveTo(2, -43); ctx.lineTo(8, -75); ctx.lineTo(14, -43); ctx.fill();
      ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(4, -50); ctx.lineTo(12, -48); ctx.stroke(); ctx.beginPath(); ctx.moveTo(5, -58); ctx.lineTo(11, -56); ctx.stroke(); ctx.beginPath(); ctx.moveTo(6, -66); ctx.lineTo(10, -64); ctx.stroke();
      
      ctx.fillStyle = 'black'; ctx.beginPath(); ctx.ellipse(0, -22, 4, 6, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(16, -22, 4, 6, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(1, -24, 1.5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(17, -24, 1.5, 0, Math.PI*2); ctx.fill();
      
      ctx.fillStyle = '#FF1493'; ctx.beginPath(); ctx.moveTo(6, -15); ctx.lineTo(10, -15); ctx.lineTo(8, -12); ctx.fill();
      ctx.strokeStyle = 'black'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(5.5, -10, 2.5, 0, Math.PI); ctx.stroke(); ctx.beginPath(); ctx.arc(10.5, -10, 2.5, 0, Math.PI); ctx.stroke();
      ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-6, -16); ctx.lineTo(-18, -18); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-6, -13); ctx.lineTo(-18, -11); ctx.stroke(); ctx.beginPath(); ctx.moveTo(22, -16); ctx.lineTo(34, -18); ctx.stroke(); ctx.beginPath(); ctx.moveTo(22, -13); ctx.lineTo(34, -11); ctx.stroke();
      ctx.restore();
    }

    function draw() {
      let waterLine = canvas.height / 2 + 20;

      // SKY
      ctx.fillStyle = '#87CEEB'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // CLOUDS 
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size, 0, Math.PI*2);
        ctx.arc(c.x + c.size * 0.8, c.y - c.size * 0.3, c.size * 0.8, 0, Math.PI*2);
        ctx.arc(c.x + c.size * 1.6, c.y, c.size * 0.9, 0, Math.PI*2);
        ctx.fill();
      });

      // SANDY FLOOR
      let floorHeight = 60;
      ctx.fillStyle = '#EEDD82'; 
      ctx.fillRect(0, canvas.height - floorHeight, canvas.width, floorHeight);

      ctx.font = '25px Arial';
      for(let i = 0; i <= canvas.width + 200; i += 200) {
          let scrollX = Math.round(i - (frameCount * 5) % 200);
          ctx.fillText('🦪', scrollX, canvas.height - 25);
          ctx.fillText('⭐', scrollX + 100, canvas.height - 10);
      }

      // HERO
      if (gameState === 'PLAYING') {
         drawHero(player.dy, player.y >= waterLine);
      } else if (gameState === 'START') {
         ctx.save();
         player.x = canvas.width / 2;
         player.y = waterLine + Math.sin(frameCount * 0.05) * 10;
         drawHero(Math.sin(frameCount * 0.05), true);
         ctx.restore();
         player.x = 200; 
      }

      // WATER
      ctx.fillStyle = 'rgba(30, 144, 255, 0.45)'; 
      ctx.beginPath();
      ctx.moveTo(0, canvas.height);
      ctx.lineTo(0, waterLine);
      for (let w = 0; w <= canvas.width; w += 20) {
          let wave = Math.sin((w * 0.005) + (frameCount * 0.05)) * 15;
          ctx.lineTo(w, waterLine + wave);
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.fill();

      ctx.strokeStyle = 'rgba(135, 206, 235, 0.6)';
      ctx.lineWidth = 4;
      ctx.stroke();

      // SPLASHES
      splashes.forEach(p => {
        ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      });

      // ITEMS & OBSTACLES
      if (gameState === 'PLAYING') {
        items.forEach(item => {
          if (item.itemType === 'donut') drawDonut(Math.round(item.x), Math.round(item.y));
          else if (item.itemType === 'heart') drawHeart(Math.round(item.x), Math.round(item.y));
          else drawGem(Math.round(item.x), Math.round(item.y));
        });
        
        obstacles.forEach(obs => drawSpikyShell(Math.round(obs.x), Math.round(obs.y)));
      }

      // --- UI RENDERING (RESPONSIVE) ---
      if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        let hudFont = Math.max(16, Math.min(30, canvas.width * 0.04));
        ctx.fillStyle = 'black';
        ctx.font = `bold ${hudFont}px Arial`;
        ctx.fillText('Money (Gems & Donuts): ' + score, 20, 40 + hudFont);
        ctx.fillText('Lives: ' + '❤️'.repeat(Math.max(0, lives)), 20, 50 + hudFont * 2.2);
      }

      // --- START SCREEN (RESPONSIVE) ---
      if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.textAlign = 'center';
        
        let titleFont = Math.min(60, canvas.width * 0.06);
        let creditFont = Math.max(12, Math.min(24, canvas.width * 0.035));
        let promptFont = Math.max(14, Math.min(30, canvas.width * 0.045));
        
        ctx.fillStyle = '#FF69B4';
        ctx.font = `bold ${titleFont}px Arial`;
        ctx.fillText('Kitty Unicorn Dolphin Rider', canvas.width / 2, canvas.height / 2 - titleFont * 2);
        
        ctx.fillStyle = 'white';
        ctx.font = `${creditFont}px Arial`;
        ctx.fillText('Designed and built by 7 year old Vivian,', canvas.width / 2, canvas.height / 2 - creditFont * 2.5);
        ctx.fillText('with some help from Gemini.', canvas.width / 2, canvas.height / 2 - creditFont * 1.0);
        
        ctx.fillStyle = '#FFD700'; 
        ctx.font = `bold ${promptFont}px Arial`;
        ctx.globalAlpha = 0.5 + Math.abs(Math.sin(frameCount * 0.05)) * 0.5;
        ctx.fillText('Click or press Enter to Start!', canvas.width / 2, canvas.height / 2 + promptFont * 4.5);
        ctx.globalAlpha = 1.0; 
        
        ctx.textAlign = 'left'; 
      }

      // --- GAME OVER SCREEN (RESPONSIVE) ---
      if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.textAlign = 'center';
        
        let goFont = Math.min(80, canvas.width * 0.12);
        let scoreFont = Math.min(40, canvas.width * 0.07);
        let retryFont = Math.max(14, Math.min(30, canvas.width * 0.045));

        ctx.fillStyle = 'white';
        ctx.font = `bold ${goFont}px Arial`;
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - goFont * 0.5);
        
        ctx.font = `bold ${scoreFont}px Arial`;
        ctx.fillStyle = '#FFD700'; 
        ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + scoreFont * 1.2);
        
        ctx.fillStyle = 'white';
        ctx.font = `bold ${retryFont}px Arial`;
        ctx.globalAlpha = 0.5 + Math.abs(Math.sin(frameCount * 0.05)) * 0.5;
        ctx.fillText('Click or press Enter to try again!', canvas.width / 2, canvas.height / 2 + scoreFont * 1.2 + retryFont * 3);
        ctx.globalAlpha = 1.0; 
        
        ctx.textAlign = 'left'; 
      }
    }

    function loop() {
      frameCount++; 
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (gameState === 'PLAYING') {
        spawn();
      }
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop(); 
  </script>
</body>
</html>
